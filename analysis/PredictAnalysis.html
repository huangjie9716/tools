<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上线达标预测及增量分析系统</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js">
    </script>
    <style>
        :root {
            --primary: #4f6ef7;
            --primary-dark: #3b54d4;
            --bg: #f0f4f8;
            --card-bg: #ffffff;
            --text: #2d3748;
            --text-secondary: #5a6c7d;
            --border: #e2e8f0;
            --border-light: #edf2f7;
            --success: #38a169;
            --danger: #e53e3e;
            --shadow: 0 4px 24px rgba(0,0,0,0.07);
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.12);
            --radius: 14px;
            --radius-sm: 10px;
            --transition: 0.25s;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif; background: #eef2f6; color: var(--text); line-height:1.6; min-height:100vh; }

        .header { background: linear-gradient(135deg, #1a2a6c, #2d4aa8, #3f5ef7); color:#fff; padding:16px 28px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 4px 20px rgba(26,42,108,0.25); position:sticky; top:0; z-index:100; }
        .header .logo { font-size:1.8rem; font-weight:700; letter-spacing:1px; display:flex; align-items:center; gap:12px; flex:1; justify-content:center; text-shadow:0 2px 4px rgba(0,0,0,0.2); }
        .header .badge { background:rgba(255,255,255,0.18); padding:8px 20px; border-radius:24px; font-size:0.9rem; backdrop-filter:blur(4px); white-space:nowrap; margin-left:auto; }

        .sub-header {
            background: #f0f4ff;
            margin: 12px 24px;
            border-radius: 12px;
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid #dde4f7;
        }
        .sub-header span { font-size: 0.85rem; font-weight: 500; color: #2b6cb0; }

        .main-container { max-width:1500px; margin:20px auto 40px; padding:0 24px; display:grid; grid-template-columns:420px 1fr; gap:24px; }
        @media (max-width:1150px) { .main-container { grid-template-columns:1fr; } }

        .card { background:var(--card-bg); border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--border-light); overflow:hidden; }
        .card-header { padding:18px 22px; border-bottom:1px solid var(--border-light); font-weight:700; font-size:1rem; display:flex; align-items:center; gap:8px; background:#fafbfc; flex-wrap:wrap; justify-content:space-between; }
        .card-body { padding:20px; }

        .upload-zone { border:2px dashed #cbd5e0; border-radius:var(--radius-sm); padding:24px 18px; text-align:center; cursor:pointer; transition:var(--transition); background:#fafcfd; position:relative; min-height:130px; display:flex; flex-direction:column; align-items:center; justify-content:center; margin-bottom:10px; }
        .upload-zone.uploaded { background:#f0fff4; border-color:var(--success); box-shadow:0 0 0 4px rgba(56,161,105,0.08); }
        .upload-zone:hover, .upload-zone.drag-over { border-color:var(--primary); background:#f0f4ff; }
        .upload-zone input[type="file"] { position:absolute; inset:0; opacity:0; cursor:pointer; }
        .upload-status { padding:8px 12px; border-radius:8px; font-size:0.82rem; font-weight:500; display:none; align-items:center; gap:6px; margin-bottom:8px; }
        .upload-status.success { display:flex; background:#f0fff4; color:#276749; border:1px solid #c6f6d5; }
        .upload-status.error { display:flex; background:#fff5f5; color:#9b2c2c; border:1px solid #fed7d7; }
        .upload-status.info { display:flex; background:#ebf8ff; color:#2b6cb0; border:1px solid #bee3f8; }

        .mode-selector { display:flex; background:#f1f5f9; border-radius:12px; padding:4px; gap:4px; margin-bottom:16px; }
        .mode-btn { flex:1; padding:10px 12px; border-radius:10px; border:none; background:transparent; font-weight:600; font-size:0.84rem; cursor:pointer; color:var(--text-secondary); text-align:center; }
        .mode-btn.active { background:#fff; color:var(--primary); box-shadow:0 2px 8px rgba(0,0,0,0.05); }

        .form-group { margin-bottom:14px; }
        .form-group label { display:block; font-weight:600; font-size:0.84rem; margin-bottom:4px; color:var(--text); }
        .form-group input { width:100%; padding:10px 14px; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-size:0.95rem; transition:var(--transition); background:#fafcfd; color:var(--text); }
        .form-group input:focus { outline:none; border-color:var(--primary); background:#fff; }
        .form-group input[readonly] { background:#f1f5f9; color:#4a5568; cursor:default; }
        .form-row { display:flex; gap:12px; }
        .form-row .form-group { flex:1; }

        .btn { padding:10px 18px; border:none; border-radius:var(--radius-sm); cursor:pointer; font-weight:600; font-size:0.9rem; transition:var(--transition); display:inline-flex; align-items:center; gap:6px; }
        .btn-primary { background:var(--primary); color:#fff; }
        .btn-primary:disabled { background:#b0bec5; cursor:not-allowed; }
        .btn-outline { background:#fff; color:var(--primary); border:1.5px solid var(--primary); }
        .btn-success { background:var(--success); color:#fff; }
        .btn-sm { padding:6px 14px; font-size:0.78rem; border-radius:8px; }
        .btn-block { width:100%; justify-content:center; }

        .line-item { background:#f8fafc; border:1px solid var(--border-light); border-radius:10px; padding:12px; margin-bottom:10px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
        .line-item input { padding:8px 10px; border:1px solid #dde4ed; border-radius:6px; font-size:0.85rem; background:#fff; }
        .line-item .line-name { flex:2; min-width:100px; }
        .line-item .line-target { flex:1; min-width:80px; }
        .line-item .btn-remove { background:none; border:none; color:var(--danger); cursor:pointer; font-size:1.2rem; padding:0 6px; }

        .line-selector-bar { display:flex; flex-wrap:wrap; gap:6px; padding:8px 18px; background:#fafcfd; border-bottom:1px solid var(--border-light); }
        .line-select-btn { padding:6px 14px; border-radius:20px; border:1px solid #dde4ed; background:#fff; cursor:pointer; font-size:0.8rem; font-weight:500; transition:0.2s; color:var(--text-secondary); }
        .line-select-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); }

        .class-filter-bar { display:flex; flex-wrap:wrap; gap:6px; padding:8px 18px; background:#fafcfd; border-bottom:1px solid var(--border-light); }
        .class-filter-btn { padding:5px 14px; border-radius:20px; border:1px solid #dde4ed; background:#fff; cursor:pointer; font-size:0.78rem; font-weight:500; transition:0.2s; color:var(--text-secondary); }
        .class-filter-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); }

        .tab-bar { display:flex; background:#f1f5f9; border-radius:12px; padding:4px; gap:4px; }
        .tab-btn { padding:8px 18px; border-radius:10px; border:none; background:transparent; font-weight:600; font-size:0.84rem; cursor:pointer; transition:0.2s; color:var(--text-secondary); display:flex; align-items:center; gap:6px; }
        .tab-btn.active { background:#fff; color:var(--primary); box-shadow:0 2px 8px rgba(0,0,0,0.05); }

        .table-container { overflow:auto; max-height:55vh; border-radius:var(--radius-sm); border:1px solid var(--border-light); background:#fff; }
        .table-container table { width:100%; border-collapse:collapse; font-size:0.84rem; min-width:850px; }
        .table-container thead th { background:#f1f5f9; padding:12px 8px; text-align:center; font-weight:700; font-size:0.79rem; border-bottom:2px solid #dde4ed; white-space:nowrap; color:#374151; }
        .sort-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            border-radius: 20px;
            background: #e2e8f0;
            color: #475569;
            font-weight: 600;
            font-size: 0.78rem;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
            border: none;
        }
        .sort-btn:hover { background: #cbd5e1; }
        .sort-btn.sort-active {
            background: #fed7aa;
            color: #c2410c;
            box-shadow: 0 1px 4px rgba(237,137,54,0.3);
        }
        .table-container tbody td { padding:10px 8px; text-align:center; border-bottom:1px solid var(--border-light); }
        .table-container tbody tr:hover { background:#f8fafc; }
        .prob-high { color:#276749; font-weight:700; }
        .prob-mid { color:#c05621; font-weight:600; }
        .prob-low { color:#c53030; font-weight:600; }
        .increment-positive { color:#276749; font-weight:700; }
        .increment-negative { color:#c53030; font-weight:700; }
        .total-row { font-weight:700; background:#fffbeb !important; border-top:2px solid #f6e05e; }

        .toast { position:fixed; top:20px; right:20px; z-index:2000; padding:14px 20px; border-radius:10px; color:#fff; font-weight:600; font-size:0.9rem; box-shadow:var(--shadow-lg); animation:slideInRight 0.35s; max-width:420px; }
        @keyframes slideInRight { from{transform:translateX(120%);opacity:0;} to{transform:translateX(0);opacity:1;} }
        .toast.success { background:#38a169; }
        .toast.error { background:#e53e3e; }
        .toast.warning { background:#ed8936; }
    </style>
</head>
<body>
    <div class="header">
        <div></div>
        <div class="logo">📊 上线达标预测及增量分析系统</div>
        <span class="badge" id="modeBadge">增量分析模式</span>
    </div>
    <div class="sub-header">
        <span>理论来源：《一种上线预测概率分布函数》——珠海市教育研究院黄玉平主任团队</span>
        <span>设计制作：珠海市九洲中学 黄结（优化改进、最新版工具获取、闲聊、合作交流等请联系vx：Phys_H）</span>
    </div>

    <div class="main-container">
        <div class="left-panel" style="display:flex;flex-direction:column;gap:20px;">
            <div class="card">
                <div class="card-header"><span>📌 分析模式</span></div>
                <div class="card-body">
                    <div class="mode-selector" id="modeSelector">
                        <button class="mode-btn active" data-mode="increment">📊 上线达标增量分析</button>
                        <button class="mode-btn" data-mode="prediction">📈 上线达标预测</button>
                    </div>
                </div>
            </div>

            <div class="card" id="uploadCard">
                <div class="card-header"><span>📁 上传成绩文件</span></div>
                <div class="card-body" id="uploadBody"></div>
            </div>

            <div class="card">
                <div class="card-header"><span>⚙️ 全局参数</span></div>
                <div class="card-body">
                    <div class="form-group"><label>全校总人数（自动识别）</label><input type="number" id="totalStudents" value="800" readonly></div>
                    <div class="form-group"><label>预测范围系数</label><input type="number" id="rangeCoefficient" value="0.2" min="0.001" max="5" step="0.01"></div>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><span>🎯 达标线管理</span><button class="btn btn-outline btn-sm" id="btnAddLine">+ 添加达标线</button></div>
                <div class="card-body" id="linesContainer"></div>
            </div>

            <button class="btn btn-primary btn-block" id="btnCalculate" disabled>🔍 开始分析</button>

            <div class="card" id="actionCard" style="display:none;">
                <div class="card-header"><span>📥 数据导出</span></div>
                <div class="card-body">
                    <button class="btn btn-success btn-block" id="btnDownload">💾 下载当前达标线明细</button>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <div class="card" style="height:100%;display:flex;flex-direction:column;">
                <div class="card-header">
                    <span>📊 分析结果视图</span>
                    <div class="tab-bar" id="tabBar">
                        <button class="tab-btn active" data-tab="detail">📋 预测明细</button>
                        <button class="tab-btn" data-tab="summary">🏫 班级汇总</button>
                    </div>
                </div>
                <div style="flex:1;display:flex;flex-direction:column;">
                    <div class="line-selector-bar" id="lineSelectorBar" style="display:none;"></div>
                    <div id="detailPanel" style="flex:1;display:flex;flex-direction:column;">
                        <div style="padding:8px 18px;font-size:0.8rem;color:var(--text-secondary);" id="resultMeta"></div>
                        <div class="class-filter-bar" id="classFilterBar" style="display:none;"></div>
                        <div class="table-container" style="flex:1;">
                            <div class="empty-state" id="emptyStateDetail"><span style="font-size:2.5rem;">📭</span><p>请上传文件并开始分析</p></div>
                            <table id="resultTable" style="display:none;"><thead id="resultTableHead"></thead><tbody id="resultTableBody"></tbody></table>
                        </div>
                    </div>
                    <div id="summaryPanel" style="flex:1;display:none;flex-direction:column;">
                        <div style="padding:8px 18px;font-size:0.8rem;color:var(--text-secondary);" id="summaryMeta"></div>
                        <div class="table-container summary-table" style="flex:1;">
                            <table id="summaryTable" style="display:none;"><thead id="summaryTableHead"></thead><tbody id="summaryTableBody"></tbody></table>
                        </div>
                        <div style="padding:12px 18px;text-align:right;display:none;" id="summaryDownloadArea">
                            <button class="btn btn-outline btn-sm" id="btnDownloadClassSummary">📋 下载班级汇总</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toastContainer"></div>

    <script>
        (function() {
            const modeSelector = document.getElementById('modeSelector');
            const modeBadge = document.getElementById('modeBadge');
            const uploadBody = document.getElementById('uploadBody');
            const totalStudentsInput = document.getElementById('totalStudents');
            const rangeCoefficientInput = document.getElementById('rangeCoefficient');
            const btnCalculate = document.getElementById('btnCalculate');
            const btnDownload = document.getElementById('btnDownload');
            const btnDownloadClassSummary = document.getElementById('btnDownloadClassSummary');
            const actionCard = document.getElementById('actionCard');
            const linesContainer = document.getElementById('linesContainer');
            const btnAddLine = document.getElementById('btnAddLine');
            const lineSelectorBar = document.getElementById('lineSelectorBar');
            const resultTable = document.getElementById('resultTable');
            const resultTableHead = document.getElementById('resultTableHead');
            const resultTableBody = document.getElementById('resultTableBody');
            const emptyStateDetail = document.getElementById('emptyStateDetail');
            const resultMeta = document.getElementById('resultMeta');
            const classFilterBar = document.getElementById('classFilterBar');
            const summaryMeta = document.getElementById('summaryMeta');
            const detailPanel = document.getElementById('detailPanel');
            const summaryPanel = document.getElementById('summaryPanel');
            const summaryTable = document.getElementById('summaryTable');
            const summaryTableHead = document.getElementById('summaryTableHead');
            const summaryTableBody = document.getElementById('summaryTableBody');
            const summaryDownloadArea = document.getElementById('summaryDownloadArea');
            const tabBar = document.getElementById('tabBar');
            const toastContainer = document.getElementById('toastContainer');

            let currentMode = 'increment';
            let predictionFileData = null;
            let currentFileData = null;
            let refFileData = null;
            let processedResults = [];
            let activeLineIndex = 0;
            let activeTab = 'detail';
            let selectedClass = 'all';
            let lineCounter = 1;
            let sortByIncrement = false;

            function showToast(msg, type='info') {
                const t = document.createElement('div'); t.className=`toast ${type}`; t.textContent=msg; toastContainer.appendChild(t);
                setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateX(120%)'; setTimeout(()=>t.remove(),400); },2800);
            }

            function switchTab(tab) {
                activeTab = tab;
                tabBar.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
                detailPanel.style.display = tab==='detail' ? 'flex' : 'none';
                summaryPanel.style.display = tab==='summary' ? 'flex' : 'none';
                if(tab==='summary') { summaryDownloadArea.style.display='block'; renderSummaryTable(); }
                else { summaryDownloadArea.style.display='none'; }
            }
            tabBar.addEventListener('click', e=>{
                const btn = e.target.closest('.tab-btn');
                if(btn && btn.dataset.tab !== activeTab) switchTab(btn.dataset.tab);
            });

            function setMode(mode) {
                currentMode = mode;
                modeSelector.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active', b.dataset.mode===mode));
                modeBadge.textContent = mode==='prediction' ? '预测模式' : '增量分析模式';
                predictionFileData = null; currentFileData = null; refFileData = null;
                processedResults = []; activeLineIndex = 0; selectedClass = 'all'; sortByIncrement = false;
                renderUploadZones();
                actionCard.style.display = 'none';
                resultTable.style.display = 'none'; summaryTable.style.display = 'none';
                emptyStateDetail.style.display = 'flex';
                lineSelectorBar.style.display = 'none'; classFilterBar.style.display = 'none';
                resultMeta.textContent = ''; summaryMeta.textContent = '';
                btnCalculate.disabled = true;
                totalStudentsInput.value = '800';
                renderLines([{name:'达标线1', target:80}]);
            }
            modeSelector.addEventListener('click', e=>{
                const btn = e.target.closest('.mode-btn');
                if(btn && btn.dataset.mode !== currentMode) setMode(btn.dataset.mode);
            });

            function parseFile(file, cb) {
                if(!file) return;
                const reader = new FileReader();
                reader.onload = e => {
                    try {
                        const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
                        const sheet = wb.Sheets[wb.SheetNames[0]];
                        const json = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
                        if(!json || json.length<2) { cb({error:'数据不足'}); return; }
                        const headers = json[0].map(h=>String(h).trim());
                        const rows = json.slice(1).filter(r=>r.some(c=>c!==''&&c!==null));
                        const idx = identifyColumns(headers);
                        if(!idx) { cb({error:'列识别失败'}); return; }
                        const valid = rows.filter(r=>!isNaN(parseFloat(r[idx.scoreCol])));
                        if(valid.length===0) { cb({error:'无有效成绩'}); return; }
                        cb({data:{headers, rows:valid, indices:idx}});
                    } catch(err) { cb({error:'解析失败'}); }
                };
                reader.onerror = ()=> cb({error:'读取失败'});
                reader.readAsArrayBuffer(file);
            }
            function identifyColumns(headers) {
                const h = headers.map((s,i)=>({s,i}));
                const idCol = h.find(x=>x.s.includes('学号'))?.i ?? 0;
                const nameCol = h.find(x=>x.s.includes('姓名')||x.s.includes('名字'))?.i ?? 1;
                const classCol = h.find(x=>x.s.includes('班级'))?.i ?? 2;
                const scoreCol = h.find(x=>x.s.includes('成绩')||x.s.includes('总分')||x.s.includes('原始分'))?.i ?? 3;
                if([idCol,nameCol,classCol,scoreCol].some(v=>v===undefined)) return null;
                return {idCol,nameCol,classCol,scoreCol};
            }

            function renderUploadZones() {
                uploadBody.innerHTML = '';
                if(currentMode==='prediction') {
                    uploadBody.innerHTML = `
                        <div class="upload-zone" id="predictionUploadZone">
                            <span style="font-size:2rem;">📄</span>
                            <span class="upload-text">点击或拖拽上传成绩文件</span>
                            <span class="upload-hint">列顺序：学号、姓名、班级、成绩</span>
                            <input type="file" id="predictionFileInput" accept=".xlsx,.xls">
                        </div>
                        <div class="upload-status" id="predictionUploadStatus"></div>
                    `;
                    const zone = document.getElementById('predictionUploadZone');
                    const input = document.getElementById('predictionFileInput');
                    const status = document.getElementById('predictionUploadStatus');
                    bindUpload(zone, input, status, (file)=>{
                        parseFile(file, res=>{
                            if(res.error) { status.className='upload-status error'; status.textContent='❌ '+res.error; status.style.display='flex'; zone.classList.remove('uploaded'); }
                            else { predictionFileData=res.data; totalStudentsInput.value=res.data.rows.length; status.className='upload-status success'; status.textContent=`✅ ${res.data.rows.length} 条`; status.style.display='flex'; zone.classList.add('uploaded'); btnCalculate.disabled=false; }
                        });
                    });
                } else {
                    uploadBody.innerHTML = `
                        <div style="margin-bottom:16px;"><div style="font-weight:600;font-size:0.85rem;margin-bottom:6px;">📌 本次成绩</div>
                        <div class="upload-zone" id="currentUploadZone"><span style="font-size:1.8rem;">📈</span><span class="upload-text">上传本次成绩文件</span><span class="upload-hint">学号、姓名、班级、成绩</span><input type="file" id="currentFileInput" accept=".xlsx,.xls"></div>
                        <div class="upload-status" id="currentUploadStatus"></div></div>
                        <div><div style="font-weight:600;font-size:0.85rem;margin-bottom:6px;">📌 参考成绩</div>
                        <div class="upload-zone" id="refUploadZone"><span style="font-size:1.8rem;">📉</span><span class="upload-text">上传参考成绩文件</span><span class="upload-hint">学号、姓名、班级、成绩</span><input type="file" id="refFileInput" accept=".xlsx,.xls"></div>
                        <div class="upload-status" id="refUploadStatus"></div></div>
                    `;
                    const curZone = document.getElementById('currentUploadZone');
                    const curInput = document.getElementById('currentFileInput');
                    const curStatus = document.getElementById('currentUploadStatus');
                    const refZone = document.getElementById('refUploadZone');
                    const refInput = document.getElementById('refFileInput');
                    const refStatus = document.getElementById('refUploadStatus');
                    bindUpload(curZone, curInput, curStatus, (file)=>{
                        parseFile(file, res=>{
                            if(res.error) { curStatus.className='upload-status error'; curStatus.textContent='❌ '+res.error; curStatus.style.display='flex'; curZone.classList.remove('uploaded'); }
                            else { currentFileData=res.data; curStatus.className='upload-status success'; curStatus.textContent=`✅ ${res.data.rows.length} 条`; curStatus.style.display='flex'; curZone.classList.add('uploaded'); checkIncrementReady(); }
                        });
                    });
                    bindUpload(refZone, refInput, refStatus, (file)=>{
                        parseFile(file, res=>{
                            if(res.error) { refStatus.className='upload-status error'; refStatus.textContent='❌ '+res.error; refStatus.style.display='flex'; refZone.classList.remove('uploaded'); }
                            else { refFileData=res.data; refStatus.className='upload-status success'; refStatus.textContent=`✅ ${res.data.rows.length} 条`; refStatus.style.display='flex'; refZone.classList.add('uploaded'); checkIncrementReady(); }
                        });
                    });
                }
            }

            function bindUpload(zone, input, statusEl, cb) {
                zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.classList.add('drag-over'); });
                zone.addEventListener('dragleave', ()=> zone.classList.remove('drag-over'));
                zone.addEventListener('drop', e=>{ e.preventDefault(); zone.classList.remove('drag-over'); if(e.dataTransfer.files[0]){ statusEl.className='upload-status info'; statusEl.textContent='⏳ 读取中...'; statusEl.style.display='flex'; cb(e.dataTransfer.files[0]); } });
                input.addEventListener('change', ()=>{ if(input.files[0]){ statusEl.className='upload-status info'; statusEl.textContent='⏳ 读取中...'; statusEl.style.display='flex'; cb(input.files[0]); } });
            }

            function checkIncrementReady() {
                if(currentFileData && refFileData) {
                    const common = getCommonIds(currentFileData, refFileData);
                    totalStudentsInput.value = common.length;
                    btnCalculate.disabled = false;
                } else btnCalculate.disabled = true;
            }
            function getCommonIds(d1,d2) {
                const s1 = new Set(d1.rows.map(r=>String(r[d1.indices.idCol]||'').trim()));
                const s2 = new Set(d2.rows.map(r=>String(r[d2.indices.idCol]||'').trim()));
                return [...s1].filter(id=>s2.has(id));
            }

            function rankAvg(scores) {
                const sorted = scores.map((s,i)=>({s,i})).sort((a,b)=>b.s-a.s);
                const ranks = new Array(scores.length);
                let i=0;
                while(i<sorted.length) {
                    let j=i;
                    while(j<sorted.length && sorted[j].s===sorted[i].s) j++;
                    const avg = (i+1+j)/2;
                    for(let k=i;k<j;k++) ranks[sorted[k].i] = avg;
                    i=j;
                }
                return ranks;
            }

            // 自然排序：智能处理班级名称中的数字部分
            function naturalCompare(a, b) {
                const aStr = String(a);
                const bStr = String(b);
                // 提取数字部分进行比较
                const aNum = parseInt(aStr.match(/\d+/)?.[0]);
                const bNum = parseInt(bStr.match(/\d+/)?.[0]);
                if (!isNaN(aNum) && !isNaN(bNum)) {
                    if (aNum !== bNum) return aNum - bNum;
                }
                // 数字相同时按字符串排序
                return aStr.localeCompare(bStr, 'zh-CN');
            }

            function sortClassEntries(entries) {
                return entries.sort((a, b) => naturalCompare(a[0], b[0]));
            }

            function renderLines(lines) {
                if(!lines) lines = [{name:'达标线1', target:80}];
                linesContainer.innerHTML = '';
                lines.forEach(l => {
                    const div = document.createElement('div'); div.className='line-item';
                    div.innerHTML = `<input class="line-name" value="${escapeHtml(l.name)}" placeholder="名称"><input class="line-target" type="number" value="${l.target}" min="1" placeholder="上线人数"><button class="btn-remove">✕</button>`;
                    div.querySelector('.btn-remove').addEventListener('click', ()=>{ div.remove(); if(linesContainer.children.length===0) addDefaultLine(); });
                    linesContainer.appendChild(div);
                });
            }
            function addDefaultLine() {
                const div = document.createElement('div'); div.className='line-item';
                div.innerHTML = `<input class="line-name" value="达标线${lineCounter++}" placeholder="名称"><input class="line-target" type="number" value="80" min="1"><button class="btn-remove">✕</button>`;
                div.querySelector('.btn-remove').addEventListener('click', ()=>{ div.remove(); if(linesContainer.children.length===0) addDefaultLine(); });
                linesContainer.appendChild(div);
            }
            btnAddLine.addEventListener('click', addDefaultLine);

            function getLinesData() {
                const items = linesContainer.querySelectorAll('.line-item');
                const lines = [];
                items.forEach(item => {
                    const nameEl = item.querySelector('.line-name');
                    const targetEl = item.querySelector('.line-target');
                    lines.push({ name: nameEl.value.trim() || `达标线${lineCounter++}`, target: parseInt(targetEl.value)||80 });
                });
                return lines;
            }

            function performCalculation() {
                const lines = getLinesData();
                if(lines.length===0) { showToast('请设置达标线','warning'); return; }
                const total = +totalStudentsInput.value || 800;
                const coeff = +rangeCoefficientInput.value || 0.2;
                const base = getBaseData();
                if(!base) return;

                processedResults = [];
                lines.forEach(line => {
                    const target = line.target;
                    const range = target + total * coeff;
                    if(range <= target) { showToast(`${line.name}: 范围需大于上线人数`,'warning'); return; }
                    const A = target / (range - target);
                    const B = 1 / Math.pow(range, A);
                    let rows = [];
                    if(currentMode==='prediction') {
                        const ranks = rankAvg(base.scores);
                        rows = base.originalRows.map((r,idx) => {
                            const classVal = String(r[base.indices.classCol]||'').trim();
                            const nameVal = String(r[base.indices.nameCol]||'').trim();
                            const id = String(r[base.indices.idCol]||'').trim();
                            let prob = 1 - B * Math.pow(ranks[idx], A);
                            if(prob<0) prob=0;
                            return {学号:id,姓名:nameVal,班级:classVal,成绩:base.scores[idx],原始分名次:ranks[idx],预测上线概率:prob};
                        });
                    } else {
                        const curRanks = rankAvg(base.curScores);
                        const refRanks = rankAvg(base.refScores);
                        rows = base.matchedRows.map((item,idx) => {
                            const classVal = String(item.curRow[base.curIndices.classCol]||'').trim();
                            const nameVal = String(item.curRow[base.curIndices.nameCol]||'').trim();
                            let prob = 1 - B * Math.pow(refRanks[idx], A);
                            if(prob<0) prob=0;
                            return {学号:item.id,姓名:nameVal,班级:classVal,本次成绩:item.curScore,本次名次:curRanks[idx],参考成绩:item.refScore,参考名次:refRanks[idx],预测上线概率:prob};
                        });
                    }
                    const classSum = new Map();
                    rows.forEach(r => {
                        const cls = r.班级;
                        if(!classSum.has(cls)) classSum.set(cls, {count:0, totalProb:0, qualified:0});
                        const c = classSum.get(cls);
                        c.count++; c.totalProb += r.预测上线概率;
                        if(currentMode==='increment' && r.本次名次 <= target) c.qualified++;
                    });
                    // 对classSummary进行排序
                    const sortedClassSum = new Map([...classSum.entries()].sort((a,b) => naturalCompare(a[0], b[0])));
                    processedResults.push({
                        lineName: line.name, target,
                        rows, classSummary: sortedClassSum,
                        params: { total, target, coeff, range:Math.round(range*100)/100, A:Math.round(A*1e4)/1e4, B:Math.round(B*1e6)/1e6 }
                    });
                });
                if(processedResults.length===0) return;
                renderLineSelector();
                activeLineIndex = 0;
                selectLine(0);
                actionCard.style.display = 'block';
                btnCalculate.disabled = false;
                btnCalculate.textContent = '🔄 重新分析';
                showToast('✅ 分析完成','success');
            }

            function getBaseData() {
                if(currentMode==='prediction') {
                    if(!predictionFileData) { showToast('请上传成绩文件','warning'); return null; }
                    const {rows, indices} = predictionFileData;
                    const scores = rows.map(r=>parseFloat(r[indices.scoreCol])||0);
                    return { scores, originalRows: rows, indices };
                } else {
                    if(!currentFileData||!refFileData) { showToast('请上传两次成绩','warning'); return null; }
                    const commonIds = getCommonIds(currentFileData, refFileData);
                    if(commonIds.length===0) { showToast('无匹配学号','error'); return null; }
                    const curMap = new Map(); currentFileData.rows.forEach(r=>curMap.set(String(r[currentFileData.indices.idCol]||'').trim(), r));
                    const refMap = new Map(); refFileData.rows.forEach(r=>refMap.set(String(r[refFileData.indices.idCol]||'').trim(), r));
                    const curScores=[], refScores=[], matched=[];
                    commonIds.forEach(id=>{
                        const curRow=curMap.get(id), refRow=refMap.get(id);
                        const cs=parseFloat(curRow[currentFileData.indices.scoreCol])||0, rs=parseFloat(refRow[refFileData.indices.scoreCol])||0;
                        curScores.push(cs); refScores.push(rs); matched.push({id,curRow,refRow,curScore:cs,refScore:rs});
                    });
                    return { curScores, refScores, matchedRows:matched, curIndices:currentFileData.indices, refIndices:refFileData.indices };
                }
            }

            function renderLineSelector() {
                lineSelectorBar.innerHTML = '';
                processedResults.forEach((res, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'line-select-btn';
                    btn.textContent = res.lineName;
                    btn.addEventListener('click', ()=> selectLine(idx));
                    lineSelectorBar.appendChild(btn);
                });
                lineSelectorBar.style.display = 'flex';
            }

            function selectLine(idx) {
                activeLineIndex = idx;
                lineSelectorBar.querySelectorAll('.line-select-btn').forEach((b,i)=> b.classList.toggle('active', i===idx));
                selectedClass = 'all';
                renderClassFilter();
                if(activeTab==='detail') renderDetailTable();
                else renderSummaryTable();
            }

            function renderClassFilter() {
                if(!processedResults.length || activeLineIndex>=processedResults.length) return;
                const data = processedResults[activeLineIndex];
                const classes = [...data.classSummary.keys()];
                // classSummary 已经是排序过的，直接使用即可
                classFilterBar.innerHTML = '<button class="class-filter-btn active" data-cls="all">🌐 全校</button>';
                classes.forEach(cls => {
                    const btn = document.createElement('button'); btn.className='class-filter-btn'; btn.dataset.cls=cls; btn.textContent=cls;
                    classFilterBar.appendChild(btn);
                });
                classFilterBar.style.display = 'flex';
                classFilterBar.querySelectorAll('.class-filter-btn').forEach(btn=>{
                    btn.addEventListener('click', ()=>{
                        classFilterBar.querySelectorAll('.class-filter-btn').forEach(b=>b.classList.remove('active'));
                        btn.classList.add('active');
                        selectedClass = btn.dataset.cls;
                        renderDetailTable();
                    });
                });
            }

            function renderDetailTable() {
                if(!processedResults.length || activeLineIndex>=processedResults.length) return;
                emptyStateDetail.style.display = 'none';
                resultTable.style.display = 'table';
                const data = processedResults[activeLineIndex];
                const isPred = currentMode==='prediction';
                const headers = isPred ? ['学号','姓名','班级','成绩','原始分名次','预测上线概率'] : ['学号','姓名','班级','本次成绩','本次名次','参考成绩','参考名次','预测上线概率'];
                let rows = data.rows;
                if(selectedClass!=='all') rows = rows.filter(r=>r.班级===selectedClass);
                rows = [...rows].sort((a,b)=>b.预测上线概率 - a.预测上线概率);
                resultTableHead.innerHTML = '<tr>'+headers.map(h=>`<th>${h}</th>`).join('')+'</tr>';
                resultTableBody.innerHTML = '';
                rows.forEach(row => {
                    const tr = document.createElement('tr');
                    headers.forEach(h => {
                        const td = document.createElement('td');
                        if(h==='预测上线概率') {
                            td.textContent = (row['预测上线概率']*100).toFixed(2)+'%';
                            const p = row['预测上线概率'];
                            if(p>=0.6) td.classList.add('prob-high');
                            else if(p>=0.25) td.classList.add('prob-mid');
                            else if(p>0) td.classList.add('prob-low');
                        } else if(h.includes('名次')) {
                            td.textContent = row[h].toFixed(1);
                        } else if(h.includes('成绩')) {
                            td.textContent = row[h].toFixed(2);
                        } else {
                            td.textContent = row[h]!==undefined ? row[h] : '';
                        }
                        tr.appendChild(td);
                    });
                    resultTableBody.appendChild(tr);
                });
                resultMeta.textContent = `${data.lineName} | 上线${data.target}人 | 范围${data.params.range} | A:${data.params.A} B:${data.params.B}`;
            }

            function renderSummaryTable() {
                if(!processedResults.length || activeLineIndex>=processedResults.length) return;
                const data = processedResults[activeLineIndex];
                const isPred = currentMode==='prediction';
                summaryTable.style.display = 'table';

                let headerHTML = '<tr><th>班级</th><th>人数</th><th>预测上线达标人数</th>';
                if(!isPred) {
                    headerHTML += '<th>上线人数</th>';
                    headerHTML += `<th><button class="sort-btn${sortByIncrement ? ' sort-active' : ''}" id="sortIncrementBtn">增量 ↑</button></th>`;
                }
                headerHTML += '</tr>';
                summaryTableHead.innerHTML = headerHTML;

                const entries = [...data.classSummary.entries()];
                // 默认按班级自然排序，增量排序时按增量降序
                if(isPred) {
                    sortClassEntries(entries);
                } else {
                    if(sortByIncrement) {
                        entries.sort((a,b) => (b[1].qualified - b[1].totalProb) - (a[1].qualified - a[1].totalProb));
                    } else {
                        sortClassEntries(entries);
                    }
                }

                summaryTableBody.innerHTML = '';
                let totalPred = 0, totalQual = 0;
                entries.forEach(([cls, info]) => {
                    totalPred += info.totalProb;
                    const tr = document.createElement('tr');
                    if(isPred) {
                        tr.innerHTML = `<td>${cls}</td><td>${info.count}</td><td>${info.totalProb.toFixed(2)}</td>`;
                    } else {
                        totalQual += info.qualified;
                        const inc = info.qualified - info.totalProb;
                        const clsName = inc>0 ? 'increment-positive' : inc<0 ? 'increment-negative' : '';
                        tr.innerHTML = `<td>${cls}</td><td>${info.count}</td><td>${info.totalProb.toFixed(2)}</td><td>${info.qualified}</td><td class="${clsName}">${inc>0?'+':''}${inc.toFixed(2)}</td>`;
                    }
                    summaryTableBody.appendChild(tr);
                });
                const totalRow = document.createElement('tr'); totalRow.classList.add('total-row');
                if(isPred) {
                    totalRow.innerHTML = `<td>合计</td><td>${data.rows.length}</td><td>${totalPred.toFixed(2)}</td>`;
                } else {
                    const totalInc = totalQual - totalPred;
                    const clsName = totalInc>0?'increment-positive':totalInc<0?'increment-negative':'';
                    totalRow.innerHTML = `<td>合计</td><td>${data.rows.length}</td><td>${totalPred.toFixed(2)}</td><td>${totalQual}</td><td class="${clsName}">${totalInc>0?'+':''}${totalInc.toFixed(2)}</td>`;
                }
                summaryTableBody.appendChild(totalRow);
                summaryMeta.textContent = `${data.lineName} | 全校预测上线总人数：${totalPred.toFixed(2)}`;

                if(!isPred) {
                    const sortBtn = document.getElementById('sortIncrementBtn');
                    if(sortBtn) {
                        sortBtn.onclick = (e) => {
                            e.stopPropagation();
                            sortByIncrement = !sortByIncrement;
                            renderSummaryTable();
                        };
                    }
                }
            }

            function escapeHtml(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

            function downloadDetailExcel() {
                if(!processedResults.length || activeLineIndex>=processedResults.length) {
                    showToast('请先分析并选择达标线','warning');
                    return;
                }
                const data = processedResults[activeLineIndex];
                const isPred = currentMode==='prediction';
                const headers = isPred ? ['学号','姓名','班级','成绩','原始分名次','预测上线概率'] : ['学号','姓名','班级','本次成绩','本次名次','参考成绩','参考名次','预测上线概率'];
                const wsData = [headers];
                data.rows.forEach(r => wsData.push(headers.map(h => h==='预测上线概率' ? r['预测上线概率'] : r[h])));
                const ws = XLSX.utils.aoa_to_sheet(wsData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, '明细');
                XLSX.writeFile(wb, `${data.lineName}_明细.xlsx`);
                showToast('明细下载成功','success');
            }

            function downloadClassSummaryExcel() {
                if(!processedResults.length || activeLineIndex>=processedResults.length) {
                    showToast('暂无数据','warning');
                    return;
                }
                const data = processedResults[activeLineIndex];
                const isPred = currentMode==='prediction';
                const headers = isPred ? ['班级','人数','预测上线达标人数'] : ['班级','人数','预测上线达标人数','上线人数','增量'];
                const wsData = [headers];
                for(const [cls, info] of data.classSummary) {
                    const row = [cls, info.count, Number(info.totalProb.toFixed(2))];
                    if(!isPred) row.push(info.qualified, Number((info.qualified - info.totalProb).toFixed(2)));
                    wsData.push(row);
                }
                const ws = XLSX.utils.aoa_to_sheet(wsData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, '班级汇总');
                XLSX.writeFile(wb, `${data.lineName}_班级汇总.xlsx`);
                showToast('班级汇总下载成功','success');
            }

            btnCalculate.addEventListener('click', ()=>{
                if((currentMode==='prediction'&&!predictionFileData) || (currentMode==='increment'&&(!currentFileData||!refFileData))) {
                    showToast('请上传所需文件','warning'); return;
                }
                btnCalculate.disabled=true; btnCalculate.textContent='⏳ 分析中...';
                setTimeout(()=>performCalculation(), 50);
            });

            btnDownload.addEventListener('click', downloadDetailExcel);
            btnDownloadClassSummary.addEventListener('click', downloadClassSummaryExcel);

            setMode('increment');
            renderLines([{name:'达标线1', target:80}]);
        })();
    </script>
</body>
