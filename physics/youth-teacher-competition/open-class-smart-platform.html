<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<script src="oc-fullscreen.js?v=1"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#070b12" />
<title>2026年香洲区课堂智慧平台</title>
<style>
    * { box-sizing: border-box; }

    :root {
        color-scheme: dark;
        --panel: rgba(18, 26, 38, 0.94);
        --line: rgba(120, 160, 255, 0.16);
        --text: #e6edf7;
        --muted: #8fa3bd;
        --cyan: #4dd0ff;
    }

    body {
        min-height: 100vh;
        margin: 0;
        padding: 48px 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        background:
            radial-gradient(900px 520px at 8% 0%, rgba(77, 208, 255, 0.14), transparent 60%),
            radial-gradient(760px 480px at 100% 20%, rgba(124, 140, 255, 0.13), transparent 58%),
            linear-gradient(155deg, #070b12 0%, #0b1220 55%, #070b12 100%);
        background-attachment: fixed;
    }

    /* 不套浮框：内容直接铺在桌面背景上 */
    .container {
        width: min(100%, 1180px);
        padding: 0;
        margin: auto;
    }

    .header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding-bottom: 28px;
    }

    .logo {
        width: 56px;
        height: 56px;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        color: var(--text);            /* 图标颜色跟随标题 */
    }

    .logo svg {
        width: 100%;
        height: 100%;
        fill: currentColor;
        filter: drop-shadow(0 0 10px rgba(120, 180, 255, 0.25));
    }

    h1 {
        margin: 0;
        font-size: clamp(24px, 4vw, 34px);
        letter-spacing: 2px;
        font-weight: 600;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 16px;
        padding-top: 30px;
    }

    .card {
        grid-column: span 2;
    }

    /* 学生端：上面 3 张（各 2 格），下面 2 张（各 3 格）——下面两个更宽，
       两张合起来正好等于上面一行 3 张的总宽 */
    body[data-role="student"] .card[data-order-student="4"],
    body[data-role="student"] .card[data-order-student="5"] {
        grid-column: span 3;
    }

    /* 教师端：前 6 张排成 3 列 × 2 行，第 7 张（反射游戏）居中放第三行 */
    body[data-role="teacher"] .card[data-order-teacher="7"] {
        grid-column: 3 / span 2;
    }

    .card {
        --accent: var(--cyan);
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 18px;
        min-height: 176px;
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 18px;
        text-decoration: none;
        color: inherit;
        overflow: hidden;
        background: linear-gradient(145deg, rgba(22, 33, 49, 0.96), rgba(13, 21, 33, 0.96));
        background:
            radial-gradient(220px 130px at 100% 0%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 72%),
            linear-gradient(145deg, rgba(22, 33, 49, 0.96), rgba(13, 21, 33, 0.96));
        transition: transform 200ms ease, border-color 200ms ease, box-shadow 200ms ease;
    }

    .card::after {
        content: "";
        position: absolute;
        top: auto;
        right: 0;
        bottom: 0;
        left: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        opacity: 0;
        transition: opacity 200ms ease;
    }

    .card:hover,
    .card:focus-visible {
        transform: translateY(-4px);
        border-color: rgba(120, 170, 255, 0.46);
        border-color: color-mix(in srgb, var(--accent) 46%, transparent);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px color-mix(in srgb, var(--accent) 16%, transparent);
        outline: none;
    }

    .card:hover::after,
    .card:focus-visible::after { opacity: 1; }

    .card .icon {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border-radius: 13px;
        color: var(--accent);
        background: rgba(77, 208, 255, 0.12);
        background: color-mix(in srgb, var(--accent) 12%, transparent);
        border: 1px solid rgba(77, 208, 255, 0.26);
        border: 1px solid color-mix(in srgb, var(--accent) 26%, transparent);
    }

    .card .icon svg {
        width: 24px;
        height: 24px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .card .name {
        display: block;
        margin: 0;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 3px;
    }

    .card .hint {
        display: block;
        margin: 8px 0 0;
        font-size: 13px;
        letter-spacing: 1px;
        color: var(--muted);
    }

    /* ---------- 全屏按钮（固定右上角） ---------- */
    /* ---------- 右上角操作区：学生端/教师端 · 全屏 · 退出登录 ---------- */
    .top-actions {
        position: fixed;
        top: 20px;
        right: 22px;
        z-index: 60;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .role-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        border-radius: 999px;
        border: 1px solid rgba(77, 208, 255, 0.35);
        background: rgba(77, 208, 255, 0.12);
        color: #9fe4ff;
        font-size: 13.5px;
        letter-spacing: 1px;
        white-space: nowrap;
    }

    .role-badge.teacher {
        border-color: rgba(155, 140, 255, 0.42);
        background: rgba(155, 140, 255, 0.14);
        color: #cfc7ff;
    }

    .top-btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 9px 18px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(18, 26, 38, 0.72);
        backdrop-filter: blur(8px);
        color: var(--muted);
        font: inherit;
        font-size: 14px;
        letter-spacing: 1px;
        cursor: pointer;
        white-space: nowrap;
        transition: color 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    .top-btn:hover {
        color: var(--text);
        border-color: rgba(77, 208, 255, 0.45);
        background: rgba(77, 208, 255, 0.08);
    }

    .top-btn:focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 2px;
    }

    .top-btn svg {
        width: 15px;
        height: 15px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .top-btn .fs-shrink { display: none; }
    .top-btn.is-fs .fs-expand { display: none; }
    .top-btn.is-fs .fs-shrink { display: inline; }
    .top-btn.hidden { display: none; }

    /* ---------- 登录界面 ---------- */
    .login {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 120;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        overflow-y: auto;
        background-color: #070b12;
        background:
            radial-gradient(900px 520px at 18% 0%, rgba(77, 208, 255, 0.14), transparent 60%),
            radial-gradient(760px 480px at 100% 18%, rgba(124, 140, 255, 0.13), transparent 58%),
            linear-gradient(155deg, #070b12 0%, #0b1220 55%, #070b12 100%);
    }

    .login.hidden { display: none; }

    /* 登录未完成时隐藏桌面内容：即使浏览器对 fixed 浮层支持不完整，也不会出现“登录页与主页重叠” */
    body.is-locked main,
    body.is-locked .top-actions { visibility: hidden; }

    .login-card {
        width: min(100%, 420px);
        margin: auto;
        padding: 30px 30px 26px;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: linear-gradient(180deg, rgba(18, 26, 38, 0.98), rgba(13, 20, 31, 0.98));
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5);
        text-align: center;
    }

    .login-logo {
        width: 48px;
        height: 48px;
        margin: 0 auto 14px;
        color: var(--text);
    }

    .login-logo svg { width: 100%; height: 100%; fill: currentColor; }

    .login h2 {
        margin: 0 0 6px;
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 1px;
    }

    .login .sub {
        margin: 0 0 20px;
        font-size: 12.5px;
        color: var(--muted);
        letter-spacing: 1px;
    }

    .role-seg {
        display: flex;
        gap: 6px;
        padding: 4px;
        margin-bottom: 18px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.05);
    }

    .role-btn {
        flex: 1;
        padding: 9px 8px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 13.5px;
        letter-spacing: 1px;
        cursor: pointer;
        transition: color 160ms ease, background 160ms ease;
    }

    .role-btn:hover:not(.on) { color: var(--text); }

    .role-btn.on {
        background: linear-gradient(120deg, var(--cyan), #7c8cff);
        color: #04131d;
        font-weight: 700;
    }

    .field {
        display: block;
        margin-bottom: 12px;
        text-align: left;
    }

    .field span {
        display: block;
        margin-bottom: 6px;
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 1px;
    }

    .field input {
        width: 100%;
        padding: 11px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        font: inherit;
        font-size: 15px;
        letter-spacing: 1px;
        outline: none;
        transition: border-color 160ms ease, background 160ms ease;
    }

    .field input:focus {
        border-color: rgba(77, 208, 255, 0.55);
        background: rgba(77, 208, 255, 0.06);
    }

    .login-err {
        min-height: 18px;
        margin: 2px 0 8px;
        font-size: 12.5px;
        color: #ff8080;
    }

    .login-btn {
        width: 100%;
        padding: 12px;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(120deg, var(--cyan), #7c8cff);
        color: #04131d;
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 3px;
        cursor: pointer;
        transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .login-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 26px rgba(77, 208, 255, 0.25);
    }

    /* 角色隐藏（学生端不显示教师专属入口） */
    [hidden] {
        display: none !important;
    }

    /* ---------- 工具内嵌窗口（保持全屏状态） ---------- */
    .viewer {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 90;
        display: none;
        flex-direction: column;
        width: 100%;
        height: 100%;
        background: #070b12;
    }

    .viewer.open { display: flex; }

    /* 工具里用自己的「返回平台」，所以内嵌时把平台右上角的按钮收起来 */
    body.viewing .top-actions { display: none; }

    .viewer iframe {
        flex: 1 1 auto;
        width: 100%;
        height: 100%;
        border: 0;
        background: #0a0d11;
    }

    /* 工具加载较慢时的提示（不会自动跳转，避免退出全屏） */
    .viewer-hint {
        position: absolute;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 9px 16px;
        border-radius: 999px;
        background: rgba(10, 16, 26, 0.92);
        border: 1px solid rgba(120, 160, 255, 0.28);
        color: #cfe3ff;
        font-size: 13px;
        white-space: nowrap;
    }

    .viewer-hint a { color: #4dd0ff; text-decoration: none; font-weight: 700; }
    .viewer-hint a:hover { text-decoration: underline; }

    /* 横屏平板（屏幕高度有限）：右上角按钮改为独立一行，压缩留白，让所有卡片一屏显示 */
    @media (max-height: 820px) and (min-width: 901px) {
        body {
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-start;
            padding: 10px 24px 18px;
        }
        .top-actions {
            position: static;
            justify-content: flex-end;
        }
        .header { gap: 14px; padding: 6px 0 12px; }
        .logo { width: 44px; height: 44px; }
        h1 { font-size: 26px; }
        .grid { padding-top: 8px; gap: 12px; }
        .card { min-height: 126px; gap: 10px; padding: 14px 18px; }
        .card .icon { width: 40px; height: 40px; }
        .card .name { font-size: 20px; }
        .card .hint { margin-top: 4px; font-size: 12.5px; }
    }

    @media (max-width: 900px) {
        .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .card,
        .card:nth-child(4),
        .card:nth-child(5),
        body[data-role="student"] .card[data-order-student="4"],
        body[data-role="student"] .card[data-order-student="5"],
        body[data-role="teacher"] .card[data-order-teacher="7"] { grid-column: auto; }
        .top-actions { top: 12px; right: 12px; gap: 8px; }
        .top-btn, .role-badge { padding: 7px 12px; font-size: 12.5px; }
    }

    @media (max-width: 560px) {
        body { padding: 58px 14px 20px; }
        .container { padding: 0; }
        .header { gap: 14px; padding-bottom: 22px; }
        .top-actions { top: 10px; right: 10px; gap: 6px; }
        .top-btn, .role-badge { padding: 6px 10px; font-size: 12px; }
        .logo { width: 46px; height: 46px; border-radius: 13px; }
        .grid { grid-template-columns: 1fr; }
        .card,
        .card:nth-child(5),
        body[data-role="student"] .card[data-order-student="4"],
        body[data-role="student"] .card[data-order-student="5"],
        body[data-role="teacher"] .card[data-order-teacher="7"] { grid-column: auto; min-height: 132px; gap: 22px; padding: 20px; }
        .card .name { font-size: 21px; }
    }

    @media (prefers-reduced-motion: reduce) {
        .card, .card::after { transition: none; }
        .card:hover, .card:focus-visible { transform: none; }
    }
</style>

<body data-role="student">
<!-- ================= 登录界面 ================= -->
<div class="login" id="loginScreen">
    <div class="login-card">
        <div class="login-logo" id="loginLogo" aria-hidden="true"></div>
        <h2>2026年香洲区课堂智慧平台</h2>
        <p class="sub">请选择身份后登录</p>

        <div class="role-seg" id="roleSeg">
            <button class="role-btn on" type="button" data-role="student">学生端</button>
            <button class="role-btn" type="button" data-role="teacher">教师端</button>
        </div>

        <label class="field">
            <span>账号</span>
            <input id="loginUser" type="text" autocomplete="username" />
        </label>
        <label class="field">
            <span>密码</span>
            <input id="loginPass" type="password" autocomplete="current-password" placeholder="请输入密码" />
        </label>

        <p class="login-err" id="loginErr"></p>
        <button class="login-btn" id="loginBtn" type="button">登 录</button>
    </div>
</div>

<!-- ================= 右上角：身份 · 全屏 · 退出登录 ================= -->
<div class="top-actions" id="topActions">
    <span class="role-badge" id="roleBadge">学生端</span>
    <button class="top-btn" id="btnFullscreen" type="button" aria-label="全屏显示">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="fs-expand" d="M9 4H4v5M15 4h5v5M20 15v5h-5M4 15v5h5" />
            <path class="fs-shrink" d="M4 9h5V4M20 9h-5V4M15 20v-5h5M9 20v-5H4" />
        </svg>
        <span id="fsLabel">全屏</span>
    </button>
    <button class="top-btn" id="btnLogout" type="button">退出登录</button>
</div>

<!-- ================= 工具内嵌窗口（全屏状态保持） ================= -->
<div class="viewer" id="viewer">
    <iframe id="toolFrame" title="课堂工具" allow="fullscreen; autoplay; clipboard-write; encrypted-media"></iframe>
</div>

<script>
    (function () {
        /* ================= 账号名单（优先读 accounts.json） ================= */
        const FALLBACK_ACCOUNTS = {
            students: Array.from({ length: 9 }, function (_, i) {
                const id = String(i + 1).padStart(3, '0');
                return { account: id, password: id, group: i + 1 };
            }),
            teachers: [
                { account: 'admin01', password: 'admin01' },
                { account: 'admin02', password: 'admin02' }
            ]
        };

        let accountsPromise = null;
        function getAccounts() {
            if (!accountsPromise) {
                accountsPromise = fetch('accounts.json', { cache: 'no-store' })
                    .then(function (res) { return res.ok ? res.json() : FALLBACK_ACCOUNTS; })
                    .catch(function () { return FALLBACK_ACCOUNTS; });   // 本地双击打开时读不到文件，用内置名单兜底
            }
            return accountsPromise;
        }

        /* ================= 登录 ================= */
        const STORE_KEY = 'oc_login_session';
        const loginScreen = document.getElementById('loginScreen');
        const roleSeg = document.getElementById('roleSeg');
        const userInput = document.getElementById('loginUser');
        const passInput = document.getElementById('loginPass');
        const loginErr = document.getElementById('loginErr');
        const loginBtn = document.getElementById('loginBtn');
        const roleBadge = document.getElementById('roleBadge');
        let role = 'student';

        function readSession() {
            try { return JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); }
            catch (err) { return null; }
        }

        function writeSession(session) {
            try {
                if (session) localStorage.setItem(STORE_KEY, JSON.stringify(session));
                else localStorage.removeItem(STORE_KEY);
            } catch (err) { /* 隐私模式忽略 */ }
        }

        function applySession(session) {
            const isTeacher = !!(session && session.role === 'teacher');
            document.body.dataset.role = isTeacher ? 'teacher' : 'student';
            document.body.classList.toggle('is-locked', !session);
            // 教师专属入口（抽签等）在学生端隐藏
            Array.prototype.forEach.call(document.querySelectorAll('[data-teacher-only]'), function (el) {
                el.hidden = !isTeacher;
            });
            applyCardOrder(isTeacher);
            applyCardLabels(isTeacher);

            if (!session) {
                loginScreen.classList.remove('hidden');
                roleBadge.textContent = '未登录';
                roleBadge.classList.remove('teacher');
                return;
            }
            loginScreen.classList.add('hidden');
            roleBadge.textContent = (isTeacher ? '教师端' : '学生端') + ' · ' + session.account;
            roleBadge.classList.toggle('teacher', isTeacher);
        }

        // 按角色调整卡片顺序（学生 5 个 / 教师 7 个，顺序不同）
        function applyCardOrder(isTeacher) {
            const nav = document.getElementById('toolGrid');
            if (!nav) return;
            const attr = isTeacher ? 'orderTeacher' : 'orderStudent';
            const cards = Array.prototype.slice.call(nav.querySelectorAll('.card'));
            cards.sort(function (a, b) {
                const ao = Number(a.dataset[attr] || 99);
                const bo = Number(b.dataset[attr] || 99);
                return ao - bo;
            });
            cards.forEach(function (card) { nav.appendChild(card); });
        }

        // 同一张卡片在不同角色下的名称/说明
        function applyCardLabels(isTeacher) {
            Array.prototype.forEach.call(document.querySelectorAll('.card'), function (card) {
                const suffix = isTeacher ? 'Teacher' : 'Student';
                const name = card.dataset['name' + suffix];
                const hint = card.dataset['hint' + suffix];
                if (name) card.querySelector('.name').textContent = name;
                if (hint) card.querySelector('.hint').textContent = hint;
            });
        }

        roleSeg.addEventListener('click', function (e) {
            const btn = e.target.closest('.role-btn');
            if (!btn) return;
            role = btn.dataset.role;
            Array.prototype.forEach.call(roleSeg.children, function (b) {
                b.classList.toggle('on', b === btn);
            });
            loginErr.textContent = '';
            userInput.focus();
        });

        async function doLogin() {
            const user = userInput.value.trim();
            const pass = passInput.value;
            loginErr.textContent = '';
            if (!user || !pass) {
                loginErr.textContent = '请输入账号和密码';
                return;
            }

            const data = await getAccounts();
            let account = null;

            if (role === 'teacher') {
                const list = data.teachers || (data.teacher ? [data.teacher] : []);
                const found = list.find(function (t) {
                    return String(user).toLowerCase() === String(t.account).toLowerCase() && pass === t.password;
                });
                if (found) account = found.account;
            } else {
                const id = /^\d{1,3}$/.test(user) ? user.padStart(3, '0') : user;
                const found = (data.students || []).find(function (s) { return s.account === id; });
                if (found && pass === found.password) account = found.account;
            }

            if (!account) {
                loginErr.textContent = '账号或密码不正确';
                passInput.select();
                return;
            }

            writeSession({ role: role, account: account, loginAt: Date.now() });
            passInput.value = '';
            applySession(readSession());
        }

        loginBtn.addEventListener('click', doLogin);
        [userInput, passInput].forEach(function (el) {
            el.addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
        });

        /* ================= 工具在平台内打开（全屏不会被打断） ================= */
        const viewer = document.getElementById('viewer');
        const toolFrame = document.getElementById('toolFrame');
        let toolLoading = false;
        let toolLoadTimer = null;

        function openTool(href) {
            // 把当前身份带给工具页，并加时间戳强制读取最新文件（本地文件容易被浏览器缓存）
            const session = readSession();
            const sep = href.indexOf('?') === -1 ? '?' : '&';
            const role = session && session.role ? 'role=' + encodeURIComponent(session.role) + '&' : '';
            const url = href + sep + role + 'v=' + Date.now();

            viewer.classList.add('open');
            document.body.classList.add('viewing');
            hideToolHint();
            toolLoading = true;
            toolFrame.src = url;

            // 加载慢时只给个提示，绝不自动跳转整页——整页跳转会让浏览器退出全屏
            clearTimeout(toolLoadTimer);
            toolLoadTimer = setTimeout(function () {
                if (toolLoading) showToolHint(url);
            }, 8000);
        }

        function showToolHint(url) {
            let hint = document.getElementById('toolHint');
            if (!hint) {
                hint = document.createElement('div');
                hint.id = 'toolHint';
                hint.className = 'viewer-hint';
                viewer.appendChild(hint);
            }
            hint.innerHTML = '<span>页面加载较慢…</span><a href="' + url + '" target="_blank" rel="noopener">在新标签打开</a>';
            hint.hidden = false;
        }

        function hideToolHint() {
            const hint = document.getElementById('toolHint');
            if (hint) hint.hidden = true;
        }

        function closeTool() {
            clearTimeout(toolLoadTimer);
            toolLoading = false;
            hideToolHint();
            viewer.classList.remove('open');
            document.body.classList.remove('viewing');
            toolFrame.src = 'about:blank';
        }

        toolFrame.addEventListener('load', function () {
            toolLoading = false;
            clearTimeout(toolLoadTimer);
            hideToolHint();
            try {
                const file = (toolFrame.contentWindow.location.pathname || '').split('/').pop();
                if (file === 'open-class-smart-platform.html' || file === 'macao-class.html') closeTool();
            } catch (err) { /* 跨域时忽略 */ }
        });

        toolFrame.addEventListener('load', function () {
            toolLoading = false;
            clearTimeout(toolLoadTimer);
            try {
                const file = (toolFrame.contentWindow.location.pathname || '').split('/').pop();
                if (file === 'open-class-smart-platform.html' || file === 'macao-class.html') closeTool();
            } catch (err) { /* 跨域时忽略 */ }
        });

        // 工具页点“返回平台”时会通知外层关闭面板；跨域/被隔离时也能收到
        window.addEventListener('message', function (event) {
            const data = event.data;
            if (data && data.type === 'oc-close-tool') closeTool();
        });

        // 平台页自己被工具面板内嵌时（工具页跳回了平台），主动通知外层关闭
        try {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'oc-close-tool' }, '*');
            }
        } catch (err) { /* 忽略 */ }

        Array.prototype.forEach.call(document.querySelectorAll('.card'), function (card) {
            card.addEventListener('click', function (e) {
                e.preventDefault();
                if (!readSession()) { applySession(null); return; }
                openTool(card.getAttribute('href'));
            });
        });

        /* ================= 退出登录 ================= */
        document.getElementById('btnLogout').addEventListener('click', function () {
            if (!confirm('确定要退出登录吗？')) return;
            writeSession(null);
            closeTool();
            userInput.value = '';
            passInput.value = '';
            loginErr.textContent = '';
            applySession(null);
            userInput.focus();
        });

        /* ================= 全屏 ================= */
        const root = document.documentElement;
        const btn = document.getElementById('btnFullscreen');
        const label = document.getElementById('fsLabel');
        const canFullscreen = !!(root.requestFullscreen || root.webkitRequestFullscreen);
        const fsEl = function () {
            return document.fullscreenElement || document.webkitFullscreenElement || null;
        };

        if (!canFullscreen) {
            btn.classList.add('hidden');            // iPhone 等不支持全屏的环境
        } else {
            btn.addEventListener('click', function () {
                try {
                    if (fsEl()) {
                        if (document.exitFullscreen) document.exitFullscreen();
                        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                    } else if (root.requestFullscreen) {
                        const p = root.requestFullscreen();
                        if (p && p.catch) p.catch(function () {});
                    } else if (root.webkitRequestFullscreen) {
                        root.webkitRequestFullscreen();
                    }
                } catch (err) { /* 被浏览器拒绝时忽略 */ }
            });
        }

        function sync() {
            const on = !!fsEl();
            btn.classList.toggle('is-fs', on);
            label.textContent = on ? '退出全屏' : '全屏';
            btn.setAttribute('aria-label', on ? '退出全屏' : '全屏显示');
        }

        document.addEventListener('fullscreenchange', sync);
        document.addEventListener('webkitfullscreenchange', sync);

        /* ================= 启动 ================= */
        document.getElementById('loginLogo').innerHTML = document.querySelector('.logo').innerHTML;
        applySession(readSession());
        sync();
    })();
</script>
