<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>初中物理课堂知识PK赛</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #0f172a, #1e293b, #0f3460); min-height: 100vh; color: #fff; overflow-x: hidden; }
    .game-container { max-width: 1500px; margin: 0 auto; padding: 18px; }
    .title-area { text-align: center; padding: 10px 0 6px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    .title-area .left { display: flex; flex-direction: column; align-items: flex-start; }
    .title-area .left h1 { font-size: 2rem; background: linear-gradient(90deg, #f7971e, #ffd200); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: 3px; }
    .title-area .left .sub { color: #a5b4fc; font-size: 1.2rem; margin-top: 4px; }
    .title-area .right { display: flex; gap: 12px; align-items: center; }
    .title-area .right button { padding: 12px 28px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: #cbd5e1; cursor: pointer; font-size: 1.2rem; transition: all 0.2s; }
    .title-area .right button:hover { background: rgba(255,255,255,0.18); color: #fff; }
    .top-bar { display: flex; justify-content: center; align-items: center; gap: 18px; flex-wrap: wrap; margin: 12px 0 14px; }
    .timer-box, .question-progress, .topic-badge { background: rgba(255,255,255,0.09); border-radius: 12px; padding: 10px 18px; border: 1px solid rgba(255,255,255,0.12); }
    .timer-box { background: linear-gradient(135deg, #e94560, #c0392b); font-weight: bold; font-size: 1.5rem; }
    .question-progress { color: #ffd200; font-size: 1.2rem; }
    .topic-badge { color: #cbd5e1; font-size: 1.1rem; }
    .main-area { display: grid; grid-template-columns: 480px 1fr 480px; gap: 16px; align-items: start; }
    .player-panel, .question-area { background: rgba(255,255,255,0.08); border-radius: 18px; border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(4px); }
    .player-panel { padding: 18px 16px; min-height: 650px; display: flex; flex-direction: column; }
    .player-panel.correct-flash { animation: correctFlash 0.5s ease; }
    .player-panel.wrong-flash { animation: wrongFlash 0.5s ease; }
    @keyframes correctFlash { 0%,100% { background: rgba(255,255,255,0.08); } 50% { background: rgba(46,213,115,0.28); } }
    @keyframes wrongFlash { 0%,100% { background: rgba(255,255,255,0.08); } 50% { background: rgba(233,69,96,0.28); } }
    .player-head { text-align: center; margin-bottom: 14px; }
    .avatar { width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; box-shadow: 0 6px 18px rgba(0,0,0,0.25); }
    .player-a .avatar { background: linear-gradient(135deg, #4facfe, #00f2fe); }
    .player-b .avatar { background: linear-gradient(135deg, #f093fb, #f5576c); }
    .player-name { font-size: 1.5rem; font-weight: bold; margin-bottom: 6px; }
    .player-a .player-name { color: #4facfe; }
    .player-b .player-name { color: #f093fb; }
    .score-label { color: #94a3b8; font-size: 1rem; }
    .score-num { font-size: 3.2rem; font-weight: bold; margin-top: 6px; }
    .player-a .score-num { color: #4facfe; }
    .player-b .score-num { color: #f093fb; }
    .player-status { text-align: center; margin: 12px 0; min-height: 38px; font-size: 1.2rem; color: #ffd200; }
    .answer-area { margin-top: 6px; display: grid; gap: 12px; }
    .answer-btn { width: 100%; padding: 16px 18px; border-radius: 14px; border: 2px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.06); color: #fff; cursor: pointer; text-align: left; font-size: 1.6rem; line-height: 1.5; transition: all 0.2s; }
    .answer-btn:hover:not(:disabled) { transform: translateY(-2px); background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.35); }
    .answer-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .answer-btn.correct { background: rgba(46,213,115,0.23); border-color: #2ed573; color: #2ed573; }
    .answer-btn.wrong { background: rgba(233,69,96,0.23); border-color: #e94560; color: #ff7b8a; }
    .record-wrap { margin-top: 18px; }
    .record-title { text-align: center; color: #94a3b8; font-size: 1rem; margin-bottom: 8px; }
    .record-dots { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .record-dot { width: 18px; height: 18px; border-radius: 50%; background: rgba(255,255,255,0.14); }
    .record-dot.correct { background: #2ed573; }
    .record-dot.wrong { background: #e94560; }
    .question-area { padding: 22px 20px; min-height: 650px; display: flex; flex-direction: column; align-items: center; }
    .q-dots { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; justify-content: center; }
    .q-dot { width: 16px; height: 16px; border-radius: 50%; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); }
    .q-dot.current { background: #ffd200; border-color: #ffd200; animation: pulse 1s infinite; }
    .q-dot.done-correct { background: #2ed573; border-color: #2ed573; }
    .q-dot.done-wrong { background: #e94560; border-color: #e94560; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.25); } }
    .question-type { background: linear-gradient(135deg, #f7971e, #ffd200); color: #1e293b; border-radius: 20px; padding: 8px 22px; font-size: 1.2rem; font-weight: bold; margin-bottom: 14px; }
    .mid-hint { display: none; }
    .question-text { font-size: 2.2rem; line-height: 1.9; text-align: center; color: #f8fafc; min-height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 18px; padding: 0 8px; width: 100%; transition: font-size 0.2s ease; }
    .question-text img { max-width: 100%; height: auto; margin: 10px 0; border-radius: 8px; }
    .question-text sup { font-size: 0.7em; vertical-align: super; }
    .question-text sub { font-size: 0.7em; vertical-align: sub; }
    .result-msg { width: 100%; min-height: 80px; border-radius: 12px; padding: 14px 18px; background: rgba(255,255,255,0.05); color: #e2e8f0; line-height: 1.75; margin-top: 8px; text-align: center; font-size: 1.2rem; }
    .next-btn { margin-top: 18px; padding: 16px 48px; border: none; border-radius: 14px; background: linear-gradient(135deg, #f7971e, #ffd200); color: #1a1a2e; font-weight: bold; font-size: 1.4rem; cursor: pointer; display: none; transition: all 0.2s; }
    .next-btn.show { display: inline-block; }
    .next-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,210,0,0.35); }
    .restart-wrap { display: flex; justify-content: center; gap: 16px; margin-top: 14px; }
    .restart-wrap button { padding: 12px 32px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: #cbd5e1; cursor: pointer; font-size: 1.1rem; transition: all 0.2s; }
    .restart-wrap button:hover { background: rgba(255,255,255,0.14); color: #fff; }
    .start-screen, .result-screen { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: rgba(2,6,23,0.92); padding: 20px; }
    .start-card, .result-card { width: min(1000px, 96vw); background: linear-gradient(135deg, #111827, #1e293b); border-radius: 40px; padding: 60px 50px; border: 1px solid rgba(255,255,255,0.12); text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
    .start-card h1, .result-title { font-size: 3.2rem; background: linear-gradient(90deg, #f7971e, #ffd200); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 20px; letter-spacing: 2px; }
    .start-card p { color: #cbd5e1; line-height: 2.2; font-size: 1.3rem; margin-bottom: 8px; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 18px 0; }
    .tag { background: rgba(255,210,0,0.14); color: #ffd200; border: 1px solid rgba(255,210,0,0.35); border-radius: 24px; padding: 8px 22px; font-size: 1.1rem; }
    .chapter-select-area { margin: 25px 0 15px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 16px 20px; }
    .chapter-select-area .select-group { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
    .chapter-select-area label { color: #94a3b8; font-size: 1.1rem; letter-spacing: 1px; }
    .chapter-select-area select { padding: 12px 18px; border-radius: 12px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: #f1f5f9; font-size: 1.1rem; cursor: pointer; outline: none; appearance: none; min-width: 160px; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23cbd5e1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 12px center; background-size: 18px; }
    .chapter-select-area select:focus { border-color: #ffd200; }
    .chapter-select-area select option { background: #1e293b; color: #f1f5f9; }
    #questionCountHint { color: #94a3b8; font-size: 1.1rem; margin-top: 8px; width: 100%; text-align: center; }
    .start-btn, .restart-btn { margin-top: 25px; padding: 18px 64px; border-radius: 999px; border: none; cursor: pointer; font-weight: bold; font-size: 1.4rem; background: linear-gradient(135deg, #f7971e, #ffd200); color: #1e293b; transition: all 0.2s; }
    .start-btn:hover, .restart-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(255,210,0,0.35); }
    .start-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
    .result-screen { display: none; }
    .result-screen.show { display: flex; }
    .winner-emoji, .draw-emoji { font-size: 5rem; margin-bottom: 12px; }
    .winner-emoji { animation: jump 0.7s infinite alternate; }
    @keyframes jump { from { transform: translateY(0); } to { transform: translateY(-12px); } }
    .score-summary { display: flex; justify-content: center; align-items: center; gap: 40px; margin: 22px 0; flex-wrap: wrap; }
    .score-item .name { color: #94a3b8; margin-bottom: 6px; font-size: 1.2rem; }
    .score-item .num { font-size: 3.2rem; font-weight: bold; }
    .confetti-container { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 99; overflow: hidden; }
    .confetti-container.show { display: block; }
    .confetti { position: absolute; animation: fall linear forwards; }
    @keyframes fall { 0% { transform: translateY(-30px) rotate(0deg); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
    @media (max-width: 1200px) { .main-area { grid-template-columns: 1fr; } .player-panel, .question-area { min-height: auto; } .chapter-select-area { flex-direction: column; align-items: stretch; } .chapter-select-area .select-group { width: 100%; } .title-area { flex-direction: column; align-items: center; } .title-area .right { margin-top: 10px; } }
    @media (max-width: 600px) { .start-card { padding: 30px 20px; } .start-card h1 { font-size: 2.2rem; } .question-text { font-size: 1.6rem; } .answer-btn { font-size: 1.2rem; } }
  </style>
</head>
<body>

  <!-- ============ 开始界面 ============ -->
  <div class="start-screen" id="startScreen">
    <div class="start-card">
      <h1>🎮 初中物理课堂知识PK赛</h1>
      <p>双人同时作答 · 每题各答一次，答对 +10 分，答错 -10 分</p>
      <p>选择年级、章、节后，系统自动加载对应题库，题量动态适配</p>
      <div class="chapter-select-area">
        <div class="select-group">
          <label for="gradeSelect">📚 年级</label>
          <select id="gradeSelect"></select>
        </div>
        <div class="select-group">
          <label for="chapterSelect">📖 章</label>
          <select id="chapterSelect"></select>
        </div>
        <div class="select-group">
          <label for="sectionSelect">📝 节</label>
          <select id="sectionSelect"></select>
        </div>
      </div>
      <div id="questionCountHint">当前题库共 0 题</div>
      <div class="tag-list" id="tagList">
        <span class="tag">长度测量</span>
        <span class="tag">单位换算</span>
        <span class="tag">刻度尺读数</span>
        <span class="tag">停表读数</span>
      </div>
      <button class="start-btn" id="startBtn" onclick="startGame()">开始 PK</button>
    </div>
  </div>

  <!-- ============ 游戏主界面 ============ -->
  <div class="game-container" id="gameContainer">
    <div class="title-area">
      <div class="left">
        <h1>🎮 初中物理课堂知识PK赛</h1>
        <div class="sub" id="currentChapterDisplay">章节：1.1 长度和时间的测量</div>
      </div>
      <div class="right">
        <button onclick="goHome()">🏠 返回主界面</button>
      </div>
    </div>
    <div class="top-bar">
      <div class="timer-box">⏱ <span id="timerDisplay">00:00</span></div>
      <div class="question-progress" id="questionProgress">第 1 / 0 题</div>
      <div class="topic-badge" id="topicBadge">知识点：—</div>
    </div>
    <div class="main-area">
      <div class="player-panel player-a" id="panelA">
        <div class="player-head">
          <div class="avatar">A</div>
          <div class="player-name">参赛者 A</div>
          <div class="score-label">当前得分</div>
          <div class="score-num" id="scoreA">0</div>
        </div>
        <div class="player-status" id="statusA">等待本题作答</div>
        <div class="answer-area" id="answerAreaA"></div>
        <div class="record-wrap">
          <div class="record-title">答题记录</div>
          <div class="record-dots" id="recordA"></div>
        </div>
      </div>
      <div class="question-area">
        <div class="q-dots" id="qDots"></div>
        <div class="question-type" id="questionType">📝 单选题</div>
        <div class="mid-hint" id="midHint"></div>
        <div class="question-text" id="questionText">点击“开始 PK”后显示题目</div>
        <div class="result-msg" id="resultMsg"></div>
        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">下一题 ▶</button>
      </div>
      <div class="player-panel player-b" id="panelB">
        <div class="player-head">
          <div class="avatar">B</div>
          <div class="player-name">参赛者 B</div>
          <div class="score-label">当前得分</div>
          <div class="score-num" id="scoreB">0</div>
        </div>
        <div class="player-status" id="statusB">等待本题作答</div>
        <div class="answer-area" id="answerAreaB"></div>
        <div class="record-wrap">
          <div class="record-title">答题记录</div>
          <div class="record-dots" id="recordB"></div>
        </div>
      </div>
    </div>
    <div class="restart-wrap">
      <button onclick="restartGame()">🔄 重新开始</button>
    </div>
  </div>

  <!-- ============ 结果界面 ============ -->
  <div class="result-screen" id="resultScreen">
    <div class="result-card">
      <div id="resultEmoji"></div>
      <div class="result-title" id="resultTitle"></div>
      <div class="score-summary" id="scoreSummary"></div>
      <button class="restart-btn" onclick="restartGame()">再来一局</button>
    </div>
  </div>

  <!-- 彩带容器 -->
  <div class="confetti-container" id="confettiContainer"></div>

  <script>
    // ===================================================================
    //  ★★★ 题库定义（包含 1.1~6.4 全部章节） ★★★
    // ===================================================================
    const chapterQuestions = {
      // ----- 1.1 长度和时间的测量 -----
      '1.1': [
        { type: 'choice', topic: '长度估测', text: '一元硬币的直径约为（　　）', options: { A: '2.5 cm', B: '2.5 mm', C: '2.5 dm', D: '2.5 m' }, answer: 'A' },
        { type: 'choice', topic: '长度估测', text: '一张纸的厚度约为（　　）', options: { A: '0.1 mm', B: '0.1 cm', C: '0.1 dm', D: '0.1 m' }, answer: 'A' },
        { type: 'choice', topic: '长度估测', text: '地球的半径约为（　　）', options: { A: '6400 km', B: '6400 m', C: '6400 cm', D: '6400 mm' }, answer: 'A' },
        { type: 'choice', topic: '单位换算', text: '700 mm 最接近下列哪个长度（　　）', options: { A: '教室黑板的长度', B: '物理课本的长度', C: '中学生步行一步的长度', D: '一个篮球场的长度' }, answer: 'C' },
        { type: 'choice', topic: '刻度尺读数', text: '如图所示，用刻度尺测量木块的长度，读数正确的是（　　）<br><img src="https://pub-3827e3697a0b44428ab555d41c8d38f3.r2.dev/image1_1/1-1-5.webp" style="max-width:100%;">', options: { A: '3.90 cm', B: '3.9 cm', C: '3.0 cm', D: '4.00 cm' }, answer: 'A' },
        { type: 'choice', topic: '停表读数', text: '如图所示，停表的示数为（　　）<br><img src="https://pub-3827e3697a0b44428ab555d41c8d38f3.r2.dev/image1_1/1-1-6.webp" style="max-width:100%;">', options: { A: '229.7 s', B: '229.0 s', C: '230.0 s', D: '228.7 s' }, answer: 'A' },
        { type: 'choice', topic: '刻度尺读数', text: '如图所示，展板上标签的长度为（　　）<br><img src="https://pub-3827e3697a0b44428ab555d41c8d38f3.r2.dev/image1_1/1-1-7.webp" style="max-width:100%;">', options: { A: '4.00 cm', B: '4.0 cm', C: '4 cm', D: '5.00 cm' }, answer: 'A' }
      ],
      // ----- 1.2 运动的描述 -----
      '1.2': [
        { type: 'choice', topic: '参照物', text: '《吕氏春秋·察今》记录了"刻舟求剑"的典故。其中有文字记载："船已行矣，而剑不行......"从物理学角度看，"剑不行"所选的参照物是（　　）', options: { A: '船', B: '剑', C: '岸边的山', D: '江水' }, answer: 'C' },
        { type: 'choice', topic: '参照物', text: '"不疑行船动，唯看远树来"这句诗，生动体现了运动和静止的相对性。诗人觉得树在运动，是因为选择的参照物是（　　）', options: { A: '乘坐的船', B: '远处的树木', C: '岸边的山石', D: '天上的太阳' }, answer: 'A' },
        { type: 'choice', topic: '参照物', text: '2026年5月，神舟二十三号载人飞船发射取得圆满成功。在飞船升空过程中，相对飞船静止的是（　　）', options: { A: '地面上的发射架', B: '地面上行驶的高铁', C: '机场降落的飞机', D: '飞船内固定的设备' }, answer: 'D' },
        { type: 'choice', topic: '参照物', text: '如图所示，加油机正在给两架受油机加油，与加油机相对静止的是（　　）<br><img src="https://pub-3827e3697a0b44428ab555d41c8d38f3.r2.dev/image1_2/1-2-4.webp" style="max-width:100%;">', options: { A: '地面', B: '云', C: '受油机', D: '太阳' }, answer: 'C' },
        { type: 'choice', topic: '运动和静止的相对性', text: '如图所示是赛龙舟时的激烈情景，摇桨队员们动作完全相同、整齐划一。下列说法正确的是（　　）<br><img src="https://pub-3827e3697a0b44428ab555d41c8d38f3.r2.dev/image1_2/1-2-5.webp" style="max-width:100%;">', options: { A: '以龙舟为参照物，龙舟上的鼓是运动的', B: '以岸边的树木为参照物，龙舟是静止的', C: '划桨的队友之间保持相对静止', D: '以鼓为参照物，击鼓的鼓槌是静止的' }, answer: 'C' }
      ],
      // ----- 1.3 运动的快慢 -----
      '1.3': [

    function populateSelects() {
      const gradeSelect = document.getElementById('gradeSelect');
      const chapterSelect = document.getElementById('chapterSelect');
      const sectionSelect = document.getElementById('sectionSelect');

      Object.keys(gradeStructure).forEach(g => {
        const opt = document.createElement('option');
        opt.value = g;
        opt.textContent = g;
        gradeSelect.appendChild(opt);
      });

      gradeSelect.addEventListener('change', function() {
        const grade = this.value;
        const data = gradeStructure[grade];
        if (!data) return;
        chapterSelect.innerHTML = '<option value="">-- 请选择章 --</option>';
        sectionSelect.innerHTML = '<option value="">-- 请选择节 --</option>';
        data.chapters.forEach(ch => {
          const opt = document.createElement('option');
          opt.value = ch;
          opt.textContent = ch;
          chapterSelect.appendChild(opt);
        });
        chapterSelect.dispatchEvent(new Event('change'));
      });

      chapterSelect.addEventListener('change', function() {
        const grade = gradeSelect.value;
        const chapter = this.value;
        if (!grade || !chapter) {
          sectionSelect.innerHTML = '<option value="">-- 请选择节 --</option>';
          updateQuestionCountHint();
          return;
        }
        const sections = gradeStructure[grade].sections[chapter] || [];
        sectionSelect.innerHTML = '<option value="">-- 请选择节 --</option>';
        sections.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s;
          opt.textContent = chapterDisplayNames[s] || s;
          sectionSelect.appendChild(opt);
        });
        if (sections.length > 0) {
          sectionSelect.value = sections[0];
        }
        updateQuestionCountHint();
        updateTagList(sectionSelect.value);
      });

      sectionSelect.addEventListener('change', function() {
        updateQuestionCountHint();
        updateTagList(this.value);
        const key = this.value;
        const qs = chapterQuestions[key] || [];
        document.getElementById('startBtn').disabled = (qs.length === 0);
      });

      gradeSelect.dispatchEvent(new Event('change'));

        if (firstChapter) {
          chapterSelect.value = firstChapter;
          chapterSelect.dispatchEvent(new Event('change'));

    let gameState = {

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function shuffleGroups(questionList) {
      const groups = {};
      const noGroup = [];
      questionList.forEach(q => {
        if (q.group) {
          if (!groups[q.group]) groups[q.group] = [];
          groups[q.group].push(q);
        } else {
          noGroup.push(q);
        }
      });
      const groupArray = [];
      for (const key in groups) {
        groupArray.push(groups[key]);
      }
      noGroup.forEach(q => groupArray.push([q]));
      const shuffledGroups = shuffle(groupArray);
      return shuffledGroups.flat();
    }

      clearInterval(gameState.timer);
      document.getElementById('scoreA').textContent = '0';
      document.getElementById('scoreB').textContent = '0';
      document.getElementById('startScreen').style.display = 'flex';
      document.getElementById('resultScreen').classList.remove('show');
      gameState.questions = [];
      gameState.totalQuestions = 0;
      gameState.currentIndex = 0;
      gameState.recordA = [];
      gameState.recordB = [];
      document.getElementById('startBtn').disabled = false;
    }

    function startGame() {
      const key = document.getElementById('sectionSelect').value;
      if (!key) {
        alert('请先选择一个小节。');
        return;
      }
      const qs = chapterQuestions[key] || [];
      if (qs.length === 0) {
        alert('该章节暂无题目，请选择其他章节。');
        return;
      }
      gameState.chapterKey = key;
      document.getElementById('startScreen').style.display = 'none';
      document.getElementById('currentChapterDisplay').textContent = `章节：${chapterDisplayNames[key]}`;
      initGame(qs);
    }

    function initGame(questionList) {
      gameState.scoreA = 0;
      gameState.scoreB = 0;
      gameState.currentIndex = 0;
      gameState.questions = shuffleGroups(questionList);
      gameState.totalQuestions = gameState.questions.length;
      gameState.seconds = 0;
      gameState.answerA = null;
      gameState.answerB = null;
      gameState.recordA = [];
      gameState.recordB = [];

      clearInterval(gameState.timer);
      startTimer();
      updateScores();
      buildDots();
      updateRecords();
      loadQuestion(0);

      document.getElementById('resultScreen').classList.remove('show');
      document.getElementById('confettiContainer').classList.remove('show');
      document.getElementById('confettiContainer').innerHTML = '';
    }

    function restartGame() {
      const key = gameState.chapterKey || '1.1';
      const qs = chapterQuestions[key] || [];
      if (qs.length === 0) {
        alert('该章节无题目，请返回重新选择。');
        document.getElementById('startScreen').style.display = 'flex';
        return;
      }
      initGame(qs);
    }

    function startTimer() {
      document.getElementById('timerDisplay').textContent = '00:00';
      gameState.timer = setInterval(() => {
        gameState.seconds++;
        const m = String(Math.floor(gameState.seconds / 60)).padStart(2, '0');
        const s = String(gameState.seconds % 60).padStart(2, '0');
        document.getElementById('timerDisplay').textContent = `${m}:${s}`;
      }, 1000);
    }

    function updateScores() {
      document.getElementById('scoreA').textContent = gameState.scoreA;
      document.getElementById('scoreB').textContent = gameState.scoreB;
    }

    function buildDots() {
      const box = document.getElementById('qDots');
      box.innerHTML = '';
      for (let i = 0; i < gameState.totalQuestions; i++) {
        const dot = document.createElement('div');
        dot.className = 'q-dot' + (i === 0 ? ' current' : '');
        dot.id = 'qdot-' + i;
        box.appendChild(dot);
      }
    }

    function updateDot(index, result) {
      const dot = document.getElementById('qdot-' + index);
      if (dot) {
        dot.classList.remove('current');
        dot.classList.add(result === 'correct' ? 'done-correct' : 'done-wrong');
      }
      const next = document.getElementById('qdot-' + (index + 1));
      if (next) next.classList.add('current');
    }

    function updateRecords() {
      ['A', 'B'].forEach(player => {
        const list = player === 'A' ? gameState.recordA : gameState.recordB;
        const el = document.getElementById('record' + player);
        el.innerHTML = '';
        for (let i = 0; i < gameState.totalQuestions; i++) {
          const dot = document.createElement('div');
          dot.className = 'record-dot';
          if (list[i]) dot.classList.add(list[i]);
          el.appendChild(dot);
        }
      });
    }

    function loadQuestion(index) {
      const q = gameState.questions[index];
      gameState.answerA = null;
      gameState.answerB = null;

      document.getElementById('questionProgress').textContent = `第 ${index + 1} / ${gameState.totalQuestions} 题`;
      document.getElementById('topicBadge').textContent = `知识点：${q.topic}`;
      document.getElementById('questionType').textContent = '📝 单选题';
      const textEl = document.getElementById('questionText');
      textEl.innerHTML = q.text;

      // 自适应字体
      const plainText = textEl.textContent || '';
      const len = plainText.length;
      let fontSize = 2.2;
      if (len > 80) fontSize = 1.8;
      if (len > 120) fontSize = 1.5;
      if (len > 160) fontSize = 1.3;
      if (len > 200) fontSize = 1.2;
      textEl.style.fontSize = fontSize + 'rem';

      document.getElementById('resultMsg').innerHTML = '';
      document.getElementById('nextBtn').classList.remove('show');

      document.getElementById('statusA').textContent = '请作答';
      document.getElementById('statusB').textContent = '请作答';

      document.getElementById('panelA').classList.remove('correct-flash', 'wrong-flash');
      document.getElementById('panelB').classList.remove('correct-flash', 'wrong-flash');

      const keys = Object.keys(q.options);
      renderAnswerArea('A', q, keys);
      const shuffledKeys = shuffle([...keys]);
      renderAnswerArea('B', q, shuffledKeys);
    }

    function renderAnswerArea(player, question, keyOrder) {
      const area = document.getElementById('answerArea' + player);
      area.innerHTML = '';
      keyOrder.forEach(key => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.textContent = `${key}. ${question.options[key]}`;
        btn.dataset.key = key;
        btn.onclick = (e) => submitAnswer(player, e.target.dataset.key);
        area.appendChild(btn);
      });
    }

    function disablePlayerButtons(player) {
      document.querySelectorAll(`#answerArea${player} .answer-btn`).forEach(btn => btn.disabled = true);
    }

    function submitAnswer(player, answerKey) {
      const q = gameState.questions[gameState.currentIndex];
      const currentAnswer = player === 'A' ? gameState.answerA : gameState.answerB;
      if (currentAnswer !== null) return;

      const isCorrect = (answerKey === q.answer);

      if (player === 'A') {
        gameState.answerA = answerKey;
        gameState.scoreA += isCorrect ? 10 : -10;
        gameState.recordA.push(isCorrect ? 'correct' : 'wrong');
        document.getElementById('statusA').textContent = isCorrect ? '✅ 正确，+10分' : '❌ 错误，-10分';
        document.getElementById('panelA').classList.add(isCorrect ? 'correct-flash' : 'wrong-flash');
      } else {
        gameState.answerB = answerKey;
        gameState.scoreB += isCorrect ? 10 : -10;
        gameState.recordB.push(isCorrect ? 'correct' : 'wrong');
        document.getElementById('statusB').textContent = isCorrect ? '✅ 正确，+10分' : '❌ 错误，-10分';
        document.getElementById('panelB').classList.add(isCorrect ? 'correct-flash' : 'wrong-flash');
      }

      updateScores();
      updateRecords();
      markPlayerButtons(player, answerKey, q.answer);
      disablePlayerButtons(player);

      setTimeout(() => {
        document.getElementById('panelA').classList.remove('correct-flash', 'wrong-flash');
        document.getElementById('panelB').classList.remove('correct-flash', 'wrong-flash');
      }, 500);

      checkBothAnswered();
    }

    function markPlayerButtons(player, userKey, correctKey) {
      const buttons = document.querySelectorAll(`#answerArea${player} .answer-btn`);
      buttons.forEach(btn => {
        const key = btn.dataset.key;
        if (key === correctKey) {
          btn.classList.add('correct');
        } else if (key === userKey && key !== correctKey) {
          btn.classList.add('wrong');
        }
      });
    }

    function checkBothAnswered() {
      const answeredA = gameState.answerA !== null;
      const answeredB = gameState.answerB !== null;

      if (!answeredA || !answeredB) return;

      const q = gameState.questions[gameState.currentIndex];
      const isCorrectA = gameState.answerA === q.answer;
      const isCorrectB = gameState.answerB === q.answer;

      const anyCorrect = isCorrectA || isCorrectB;
      updateDot(gameState.currentIndex, anyCorrect ? 'correct' : 'wrong');

      document.getElementById('resultMsg').innerHTML = `
        <div><b>正确答案：</b>${q.answer}</div>
        <div style="margin-top:6px;">
          参赛者A：${isCorrectA ? '✅ 正确，+10分' : '❌ 错误，-10分'}　
          ｜　
          参赛者B：${isCorrectB ? '✅ 正确，+10分' : '❌ 错误，-10分'}
        </div>
      `;

      const btn = document.getElementById('nextBtn');
      btn.textContent = gameState.currentIndex < gameState.totalQuestions - 1 ? '下一题 ▶' : '查看结果 🏆';
      btn.classList.add('show');
    }

    function nextQuestion() {
      if (gameState.currentIndex < gameState.totalQuestions - 1) {
        gameState.currentIndex++;
        loadQuestion(gameState.currentIndex);
      } else {
        showResult();
      }
    }

    function showResult() {
      clearInterval(gameState.timer);

      const a = gameState.scoreA;
      const b = gameState.scoreB;
      let title = '';
      let emoji = '';

      if (a > b) {
        title = '参赛者 A 获胜！';
        emoji = '<div class="winner-emoji">🏆</div>';
        launchConfetti();
      } else if (b > a) {
        title = '参赛者 B 获胜！';
        emoji = '<div class="winner-emoji">🎉</div>';
        launchConfetti();
      } else {
        title = '平局！旗鼓相当！';
        emoji = '<div class="draw-emoji">🤝</div>';
      }

      document.getElementById('resultEmoji').innerHTML = emoji;
      document.getElementById('resultTitle').textContent = title;
      document.getElementById('scoreSummary').innerHTML = `
        <div class="score-item">
          <div class="name">参赛者 A</div>
          <div class="num" style="color:${a >= b ? '#ffd200' : '#4facfe'}">${a}</div>
        </div>
        <div style="font-size:1.8rem;color:#64748b;">VS</div>
        <div class="score-item">
          <div class="name">参赛者 B</div>
          <div class="num" style="color:${b >= a ? '#ffd200' : '#f093fb'}">${b}</div>
        </div>
      `;
      document.getElementById('resultScreen').classList.add('show');
    }

    function launchConfetti() {
      const container = document.getElementById('confettiContainer');
      container.innerHTML = '';
      container.classList.add('show');

      const colors = ['#ffd200', '#f7971e', '#4facfe', '#f093fb', '#2ed573', '#e94560', '#48dbfb', '#ff9ff3'];
      for (let i = 0; i < 140; i++) {
        const el = document.createElement('div');
        const size = Math.random() * 10 + 6;
        el.className = 'confetti';
        el.style.left = Math.random() * 100 + 'vw';
        el.style.top = '-20px';
        el.style.width = size + 'px';
        el.style.height = size + 'px';
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        el.style.animationDuration = (Math.random() * 2 + 2.2) + 's';
        el.style.animationDelay = (Math.random() * 1.5) + 's';
        container.appendChild(el);
      }

      setTimeout(() => {
        container.classList.remove('show');
      }, 5000);
    }

    // ===================================================================
    //  页面加载完成后初始化
    // ===================================================================
    window.onload = function() {
      populateSelects();
    };
  </script>
</body>
</html>
