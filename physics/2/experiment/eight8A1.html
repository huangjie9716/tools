        .ground.texture-towel { background: repeating-linear-gradient(45deg, #d6b8a2, #d6b8a2 10px, #c8a68c 10px, #c8a68c 20px); }

 <body>

     <div class="control-group action-buttons">

   <div class="demo-area" id="demoArea">

       <div class="release-point-label" id="releasePointLabel">0%</div>

     <div class="cart" id="cart" style="left: -65.5279px; bottom: 198.944px; transform: rotate(26.5651deg);">

  <script>
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        document.getElementById('particles').appendChild(canvas);

        let particles = [];
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
                this.opacity = Math.random() * 0.3;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = `rgba(0, 0, 0, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            for (let i = 0; i < 50; i++) particles.push(new Particle());
        }
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            requestAnimationFrame(animateParticles);
        }
        initParticles();
        animateParticles();

        // --- 物理仿真逻辑 ---
        const RAMP_WIDTH = 300;
        const RAMP_HEIGHT = 150;
        const RAMP_ANGLE = Math.atan(RAMP_HEIGHT / RAMP_WIDTH);
        const RAMP_ANGLE_DEG = RAMP_ANGLE * (180 / Math.PI);
        const RAMP_LENGTH = Math.sqrt(RAMP_WIDTH * RAMP_WIDTH + RAMP_HEIGHT * RAMP_HEIGHT);
        
        const GROUND_Y = 40;
        const WHEEL_RADIUS = 10;
        const CART_WIDTH = 70;
        const GRAVITY = 9.8;
        const PIXELS_PER_METER = 50;
        const METERS_PER_DECIMETER = 0.1; // 1分米 = 0.1米
        
        // 新增：释放位置相关变量
        let releasePositionPercent = 0; // 释放位置百分比 (0-100)
        let initialVelocity = 0; // 初始速度 (根据释放位置计算)
        
        const WHEEL_CIRCUMFERENCE = 2 * Math.PI * WHEEL_RADIUS;
        let wheelRotation = 0;
        let wheelRotationSpeed = 0;
        
        let mu = 0.15;
        let isSimulating = false;
        let animationId = null;
        let cartState = {
            cartLeft: 0,
            v: 0,
            d: 0, // 水平距离 (米)
            phase: 'ramp'
        };

        const cartEl = document.getElementById('cart');
        const speedDisplay = document.getElementById('speedDisplay');
        const distanceDisplay = document.getElementById('distanceDisplay');
        const groundEl = document.getElementById('ground');
        const playBtn = document.getElementById('playBtn');
        const sceneEl = document.getElementById('scene');
        const rulerEl = document.getElementById('ruler');
        const releasePosSlider = document.getElementById('releasePosSlider');
        const releasePosVal = document.getElementById('releasePosVal');
        const releasePoint = document.getElementById('releasePoint');
        const releasePointLabel = document.getElementById('releasePointLabel');
        const leftWheelEl = cartEl.querySelector('.wheel-left');
        const rightWheelEl = cartEl.querySelector('.wheel-right');

        // 修改：标尺刻度单位改为分米
        for(let i=0; i<20; i++) {
            const tick = document.createElement('div');
            tick.className = 'tick';
            tick.innerText = i + 'dm'; // 分米单位
            rulerEl.appendChild(tick);
        }

        // 材质预设数据
        const materials = {
            'towel': { mu: 0.4, name: '毛巾', class: 'texture-towel' },
            'cotton': { mu: 0.25, name: '棉布', class: 'texture-cotton' },
            'wood': { mu: 0.15, name: '木板', class: 'texture-wood' },
            'ice': { mu: 0.0, name: '理想光滑表面', class: 'texture-ice' }
        };

        // 新增：计算释放位置处的初始速度
        function calculateInitialVelocity(releasePercent) {
            // 根据能量守恒：mgh = 1/2 mv²
            // 释放点的高度 = 斜面顶端高度 * (1 - releasePercent/100)
            const totalHeight = RAMP_HEIGHT;
            const releaseHeight = totalHeight * (releasePercent / 100);
            
            // 重力势能转化为动能：mgh = 1/2 mv²
            // 所以 v = √(2gh)
            return Math.sqrt(2 * GRAVITY * (releaseHeight / PIXELS_PER_METER));
        }

        // 新增：更新释放位置标记
        function updateReleasePoint() {
            const releasePercent = releasePositionPercent;
            
            // 计算释放点在斜面上的位置
            const releaseRatio = releasePercent / 100;
            const releaseX = releaseRatio * RAMP_WIDTH;
            const releaseY = GROUND_Y + (1 - releaseRatio) * RAMP_HEIGHT;
            
            // 计算释放点标记的位置（在斜面上方）
            const markerY = releaseY + 20; // 标记在斜面上方20px
            
            releasePoint.style.left = `${releaseX}px`;
            releasePoint.style.bottom = `${markerY}px`;
            
            // 更新标签文字
            releasePointLabel.textContent = `${releasePercent}%`;
        }

        // 释放位置滑块事件监听
        releasePosSlider.addEventListener('input', (e) => {
            releasePositionPercent = parseInt(e.target.value);
            releasePosVal.textContent = `${releasePositionPercent}%`;
            
            // 更新释放位置标记
            updateReleasePoint();
            
            // 计算并显示初始速度
            initialVelocity = calculateInitialVelocity(releasePositionPercent);
            
            // 重置实验
            resetSimulation();
        });

        function setMaterial(type) {
            const mat = materials[type];
            mu = mat.mu;
            groundEl.className = `ground ${mat.class}`;
            updateActiveButton(type);
            resetSimulation();
        }

        function updateActiveButton(type) {
            document.querySelectorAll('.material-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${type}`).classList.add('active');
        }

        function updateWheels(dt) {
            if (cartState.v !== 0) {
                const wheelLinearSpeed = cartState.v * PIXELS_PER_METER;
                wheelRotationSpeed = (wheelLinearSpeed / WHEEL_CIRCUMFERENCE) * 360;
                wheelRotation += wheelRotationSpeed * dt;
                
                if (leftWheelEl && rightWheelEl) {
                    leftWheelEl.style.transform = `rotate(${wheelRotation}deg)`;
                    rightWheelEl.style.transform = `rotate(${wheelRotation}deg)`;
                }
            } else {
                wheelRotationSpeed = 0;
                if (leftWheelEl && rightWheelEl) {
                    leftWheelEl.style.transform = `rotate(0deg)`;
                    rightWheelEl.style.transform = `rotate(0deg)`;
                }
            }
        }

        // 修改：更新小车位置计算，考虑释放位置
        function updateCartRampPosition(progressDistance) {
            const ratio = progressDistance / RAMP_LENGTH;
            const frontEdgeX = ratio * RAMP_WIDTH;
            const frontEdgeY = GROUND_Y + (1 - ratio) * RAMP_HEIGHT;
            const cartLeft = frontEdgeX - CART_WIDTH + Math.sin(RAMP_ANGLE) * WHEEL_RADIUS;
            const cartBottom = frontEdgeY + Math.cos(RAMP_ANGLE) * WHEEL_RADIUS;
            
            cartEl.style.left = `${cartLeft}px`;
            cartEl.style.bottom = `${cartBottom}px`;
            cartEl.style.transform = `rotate(${RAMP_ANGLE_DEG}deg)`;
            cartState.cartLeft = cartLeft;
            
            if (leftWheelEl && rightWheelEl) {
                leftWheelEl.style.transform = `rotate(${wheelRotation}deg) rotate(${-RAMP_ANGLE_DEG}deg)`;
                rightWheelEl.style.transform = `rotate(${wheelRotation}deg) rotate(${-RAMP_ANGLE_DEG}deg)`;
            }
        }

        function initCartPosition() {
            // 根据释放位置计算初始位置
            const releaseRatio = releasePositionPercent / 100;
            const initialFrontEdgeX = releaseRatio * RAMP_WIDTH;
            
            cartState = {
                cartLeft: initialFrontEdgeX - CART_WIDTH + Math.sin(RAMP_ANGLE) * WHEEL_RADIUS,
                v: initialVelocity, // 使用计算得到的初始速度
                d: 0,
                phase: 'ready'
            };
            
            wheelRotation = 0;
            wheelRotationSpeed = 0;
            
            // 更新小车到释放位置
            const progressDistance = releaseRatio * RAMP_LENGTH;
            updateCartRampPosition(progressDistance);
            updateDisplay();
        }

        function updateDisplay() {
            speedDisplay.innerText = Math.abs(cartState.v).toFixed(2);
            // 修改：水平距离显示为分米
            distanceDisplay.innerText = (cartState.d / METERS_PER_DECIMETER).toFixed(2);
        }

        let lastTime = 0;
        
        function startSimulation() {
            if (isSimulating) return;
            document.querySelectorAll('.marker, .marker-label').forEach(el => el.remove());

            isSimulating = true;
            playBtn.disabled = true;
            playBtn.innerText = "演示中...";
            cartState.phase = 'ramp';
            cartState.v = initialVelocity; // 设置初始速度
            wheelRotation = 0;
            lastTime = performance.now();
            animationId = requestAnimationFrame(loop);
        }

        function loop(timestamp) {
            if (!isSimulating) return;
            const dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            if (dt > 0.1) {
                animationId = requestAnimationFrame(loop);
                return;
            }

            if (cartState.phase === 'ramp') {
                // 斜面运动：a = g * sin(theta)
                const a = GRAVITY * Math.sin(RAMP_ANGLE);
                cartState.v += a * dt;
                const dx = cartState.v * dt * PIXELS_PER_METER;
                const currentFrontEdgeX = cartState.cartLeft + CART_WIDTH + dx;
                
                if (currentFrontEdgeX >= RAMP_WIDTH) { 
                    cartState.phase = 'flat';
                    cartState.cartLeft = RAMP_WIDTH - CART_WIDTH;
                    cartState.d = 0;
                    cartEl.style.transform = `rotate(0deg)`;
                    cartEl.style.left = `${cartState.cartLeft}px`;
                    cartEl.style.bottom = `${GROUND_Y + WHEEL_RADIUS}px`;
                } else {
                    const progressDistance = (currentFrontEdgeX / RAMP_WIDTH) * RAMP_LENGTH;
                    updateCartRampPosition(progressDistance);
                }
                
                updateWheels(dt);

            } else if (cartState.phase === 'flat') {
                const a = -mu * GRAVITY;
                if (mu === 0) {
                    cartState.v = cartState.v;
                } else {
                    cartState.v += a * dt;
                }

                if (cartState.v <= 0 && mu > 0) {
                    cartState.v = 0;
                    cartState.phase = 'stopped';
                    stopSimulation();
                }

                const dx = cartState.v * dt * PIXELS_PER_METER;
                cartState.cartLeft += dx;
                // 水平距离计算（单位：米）
                cartState.d = (cartState.cartLeft + CART_WIDTH - RAMP_WIDTH) / PIXELS_PER_METER;
                cartEl.style.left = `${cartState.cartLeft}px`;
                cartEl.style.bottom = `${GROUND_Y + WHEEL_RADIUS}px`;
                
                updateWheels(dt);

                const frontEdgeX = cartState.cartLeft + CART_WIDTH;
                const viewPortWidth = document.querySelector('.demo-area').offsetWidth;
                if (frontEdgeX > viewPortWidth * 0.6) {
                    const offset = -(frontEdgeX - viewPortWidth * 0.6);
                    gsap.to(sceneEl, { x: offset, duration: 0.1, ease: "none" });
                }
                
                if (mu === 0 && cartState.d > 50) {
                     stopSimulation();
                }
            }

            updateDisplay();

            if (isSimulating) {
                animationId = requestAnimationFrame(loop);
            }
        }

        function stopSimulation() {
            isSimulating = false;
            cancelAnimationFrame(animationId);
            playBtn.innerText = "重新演示";
            playBtn.disabled = false;
            
            if (mu > 0) {
                addMarker();
            }
        }

        // 修改：标记点标签显示分米单位
        function addMarker() {
            const marker = document.createElement('div');
            marker.className = 'marker';
            const frontEdgeX = cartState.cartLeft + CART_WIDTH;
            marker.style.left = `${frontEdgeX}px`;
            const label = document.createElement('div');
            label.className = 'marker-label';
            // 将米转换为分米显示
            label.innerText = (cartState.d / METERS_PER_DECIMETER).toFixed(2) + 'dm';
            marker.appendChild(label);
            sceneEl.appendChild(marker);
            gsap.from(marker, { scaleY: 0, duration: 0.3, ease: "back.out" });
        }

        function resetSimulation() {
            isSimulating = false;
            cancelAnimationFrame(animationId);
            playBtn.innerText = "开始演示";
            playBtn.disabled = false;
            gsap.to(sceneEl, { x: 0, duration: 0.5 });
            initCartPosition();
            document.querySelectorAll('.marker').forEach(el => el.remove());
        }

        // 初始化
        updateReleasePoint(); // 初始化释放位置标记
        initCartPosition(); // 初始化小车位置
        
        // 计算初始速度
        initialVelocity = calculateInitialVelocity(releasePositionPercent);
    </script>
 
</body></html>
