<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>初中物理实验资源库</title>
    <style>
        /* ====================== 全局基础样式 ====================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Noto Sans SC', Roboto, 'Helvetica Neue', sans-serif;
            background: #f8fafc;
            color: #1e2a3a;
            line-height: 1.6;
            padding: 0;
        }

        /* ====================== 顶部标题区域 ====================== */
        .header-wrap {
            background: #ffffff;
            padding: 16px 24px;
            position: relative;
        }

        .main-title {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 1px;
            text-align: center;
            position: relative;
            z-index: 2;
        }
        .main-title span {
            color: #2576D9;
        }
        .main-title .title-icon {
            width: 1em;
            height: 1em;
            vertical-align: -0.15em;
            margin-right: 8px;
        }
        .header-divider {
            width: 100%;
            height: 2px;
            margin-top:14px;
            background: linear-gradient(90deg, transparent, #94bce8, transparent);
        }

        /* ====================== 筛选控件区域 ====================== */
        .filter-wrap {
            max-width: 1260px;
            margin: 32px auto;
            padding: 0 24px;
        }
        .filter-row {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-label {
            font-size: 18px;
            font-weight: 600;
            color: #334155;
            min-width: 110px;
            flex-shrink: 0;
        }
        .btn-group-select {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .select-btn {
            padding: 9px 18px;
            border-radius: 7px;
            border: 1.5px solid #cbd5e1;
            background: #ffffff;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .select-btn.active {
            background-color: #2576D9;
            color: white;
            border-color: #2576D9;
        }
        .select-btn:hover:not(.active) {
            border-color: #2576D9;
            background: #f0f7ff;
        }

        .search-input {
            flex: 1;
            max-width: 420px;
            padding: 10px 16px;
            border-radius: 8px;
            border: 1.5px solid #cbd5e1;
            background: #ffffff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input:focus {
            border-color: #2576D9;
        }

        /* ====================== 实验卡片列表区域 ====================== */
        .experiment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
            gap: 28px;
            max-width: 1260px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .experiment-grid.empty-state-mode {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 240px);
        }

        .experiment-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            border: 1px solid #edf2f9;
            transition: transform 0.2s, box-shadow 0.25s;
            overflow: hidden;
        }
        .experiment-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 26px rgba(26, 111, 181, 0.07);
            border-color: #c7ddf5;
        }

        .exp-cover {
            width: 100%;
            height: 180px;
            background: #e9edf3;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8892a0;
            font-size: 18px;
        }
        .exp-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .exp-card-body {
            padding: 20px;
        }
        .exp-chapter-tag {
            display: inline-block;
            margin-bottom: 10px;
            padding: 2px 10px;
            border-radius: 6px;
            background: #eef4fc;
            color: #2576D9;
            font-size: 13px;
            font-weight: 500;
        }
        .experiment-name {
            font-size: 19px;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px dashed #e2e8f0;
            text-align: center;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn {
            flex: 1 0 auto;
            padding: 10px 4px;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            min-width: 75px;
            letter-spacing: 0.2px;
        }

        .btn:hover:not(:disabled) {
            transform: scale(1.02);
        }
        .btn:active:not(:disabled) {
            transform: scale(0.97);
        }
        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        .btn-video {
            background: #e3f0ff;
            color: #1a6fb5;
        }
        .btn-video:hover:not(:disabled) {
            background: #cde2fe;
        }

        .btn-sim {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .btn-sim:hover:not(:disabled) {
            background: #d4edda;
        }

        .btn-exercise {
            background: #fff3e0;
            color: #bf6f00;
        }
        .btn-exercise:hover:not(:disabled) {
            background: #ffe4b5;
        }

        /* ====================== 弹窗通用样式 ====================== */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(3px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal.active {
            display: flex;
        }
        .video-modal-content {
            background: #ffffff;
            border-radius: 16px;
            width: 96%;
            height: 92vh;
            padding: 22px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.25);
            animation: fadeUp 0.25s ease;
            display: flex;
            flex-direction: column;
        }
        .modal-content {
            background: #ffffff;
            border-radius: 16px;
            width: 100%;
            max-width: 900px;
            padding: 28px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.25);
            animation: fadeUp 0.25s ease;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h3 {
            font-size: 22px;
            font-weight: 600;
            color: #0f172a;
        }
        .modal-close {
            background: transparent;
            border: none;
            font-size: 34px;
            line-height: 1;
            cursor: pointer;
            color: #64748b;
        }
        .modal-close:hover {
            color: #0f172a;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .video-wrapper {
            flex: 1;
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 10px;
            background: #0f172a;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* ====================== 习题弹窗样式（优化版） ====================== */
        /* 让习题弹窗和视频弹窗一样大 */
        #exerciseModal .modal-content {
            width: 96%;               /* 与视频弹窗宽度一致 */
            height: 92vh;             /* 与视频弹窗高度一致 */
            max-width: none;          /* 去掉原有的 900px 或 1000px 限制 */
            padding: 22px;            /* 与视频弹窗内边距一致 */
            display: flex;
            flex-direction: column;
        }

        #exerciseModal .exercise-body {
            flex: 1;                  /* 自动填充剩余高度 */
            max-height: none;         /* 取消原有的 70vh 限制 */
            overflow-y: auto;         /* 保持滚动 */
            padding: 4px;
            font-size: 17px;
        }
        .exercise-body {
            max-height: 50vh;
            overflow-y: auto;
            padding: 4px;
            font-size:17px;
        }
        .question-item {
            background: #f9fafc;
            border-radius: 10px;
            padding: 18px 20px;
            margin-bottom: 20px;
            border: 1px solid #e8edf4;
        }
        .question-text {
            font-weight: 500;
            margin-bottom: 12px;
            line-height: 1.8;
            white-space: pre-wrap;    /* 保留换行和空格，但需配合 innerHTML 中的 <br> */
        }
        .question-text .option-line {
            display: block;
            padding-left: 1.2em;
            text-indent: -1.2em;
            margin-left: 1.2em;
        }
        .question-images {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin: 12px 0;
        }
        .question-images img {
            max-width: 100%;
             max-height: 70vh;           /* 限制最大高度为视口高度的70%，防止图片过高 */
            height: auto;               /* 保持宽高比 */
            object-fit: contain;        /* 保持比例，不裁剪 */
            border-radius: 8px;
            border: 1px solid #dce3ec;
            display: block;             /* 确保居中生效 */
            margin: 0 auto;             /* 水平居中 */
        }
        .answer-section {
            margin-top: 14px;
            border-top: 1px dashed #d0d9e6;
            padding-top: 14px;
            display: none;
        }
        .answer-section.show {
            display: block;
        }
        .answer-section p {
            margin-bottom: 6px;
            line-height: 1.8;
        }
        .answer-section .answer-label {
            font-weight: 600;
            color: #1a5fa8;
        }
        .toggle-answer-btn {
            margin-top: 10px;
            padding: 8px 20px;
            border-radius: 6px;
            border: none;
            background: #2576D9;
            color: white;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.2s;
        }
        .toggle-answer-btn:hover {
            background: #1a5fa8;
        }

        /* ====================== 空状态内部样式 ====================== */
        .empty-state {
            text-align: center;
            color: #8892a0;
            font-size: 20px;
        }
        .empty-state .icon {
            font-size: 64px;
            display: block;
            margin-bottom: 16px;
        }

        /* ====================== 移动端自适应 ====================== */
        @media (max-width: 900px) {
            .filter-row {
                flex-direction: column;
                align-items: flex-start;
            }
            .filter-label {
                min-width: unset;
                margin-bottom:8px;
            }
        }
        @media (max-width: 768px) {
            .main-title {
                font-size: 30px;
            }
            .experiment-grid {
                grid-template-columns: 1fr;
            }
            .video-modal-content {
                width: 100%;
                height: 94vh;
                padding:14px;
            }
            .experiment-grid.empty-state-mode {
                min-height: calc(100vh - 200px);
            }
        }
        @media (max-width: 480px) {
            .main-title {
                font-size: 26px;
            }
            .select-btn {
                font-size:15px;
                padding:8px 14px;
            }
        }
    </style>

    <!-- ====================== 筛选选择区域 ====================== -->
    <div class="filter-wrap">
        <div class="filter-row">
            <label class="filter-label">📚 选择书册</label>
            <div class="btn-group-select" id="bookBtnBox">
            </div>
        </div>
        <div class="filter-row">
            <label class="filter-label">📖 选择章节</label>
            <div class="btn-group-select" id="chapterBtnBox">
            </div>
        </div>
        <div class="filter-row" id="searchRow">
            <label class="filter-label">🔎 搜索实验</label>
            <input type="text" id="searchInput" class="search-input" placeholder="输入关键词搜索实验">
        </div>
    </div>

    <!-- ====================== 实验卡片容器 ====================== -->
    <div id="experimentContainer" class="experiment-grid empty-state-mode">
        <div class="empty-state">
            <span class="icon">🔍</span>

        </div>
    </div>

    <!-- ====================== 视频弹窗 ====================== -->
    <div class="modal" id="videoModal">
        <div class="video-modal-content">
            <div class="modal-header">
                <h3 id="videoModalTitle">🎬 视频资源</h3>
                <button class="modal-close" id="videoModalClose">&times;</button>
            </div>
            <div class="video-wrapper">
                <iframe id="videoIframe" src="" allowfullscreen loading="lazy"></iframe>

                <h3 id="exerciseModalTitle">📝 习题资源</h3>
                <button class="modal-close" id="exerciseModalClose">&times;</button>

                name: '九年级全一册',
                chapters: [
                    { id: 'ch13', name: '第十三章・内能', experiments: ['比较不同物质吸收热量的情况', '气体扩散实验', '墨水扩散快慢与温度的关系', '铅柱间的作用力', '做功改变空气的内能'] },
                    { id: 'ch14', name: '第十四章・内能的利用', experiments: ['能量的转化与守恒', '加热试管中的水', '热机工作原理', '跨学科实践：制作简易热机模型'] },
                    { id: 'ch15', name: '第十五章・电流和电路', experiments: ['电荷间的相互作用', '验电器', '摩擦起电的原因', '连接串联电路和并联电路', '用电流表测量电流', '探究串联电路中各处电流的关系', '探究并联电路中干路电流与各支路电流的关系'] },
                    { id: 'ch16', name: '第十六章・电压 电阻', experiments: ['电压的概念', '用电压表测量电压', '探究串联电路中用电器两端电压与电源两端电压的关系', '探究并联电路中各支路用电器两端电压与电源两端电压的关系', '用铅笔芯连接电路', '影响导体电阻大小的因素', '超导体和半导体', '练习使用滑动变阻器', '跨学科实践：制作简易调光台灯'] },
                    { id: 'ch17', name: '第十七章・欧姆定律', experiments: ['探究电阻一定时电流与电压的关系', '探究电压一定时电流与电阻的关系', '用电流表和电压表测量电阻'] },
                    { id: 'ch18', name: '第十八章・电功率', experiments: ['小灯泡的电功率随电压变化', '跨学科实践：为家庭节约用电提建议', '焦耳定律实验'] },
                    { id: 'ch19', name: '第十九章・生活用电', experiments: ['家庭电路中电流过大的原因', '安全用电', '家庭电路的基本组成', '试电笔的使用', '跨学科实践：为家庭电路做设计'] },
                    { id: 'ch20', name: '第二十章・电与磁', experiments: ['研究磁体周围磁场的方向', '电流的磁效应', '探究通电螺线管外部磁场的方向', '安培定则', '制作简易的电磁起重机', '电磁继电器', '通电导体棒在磁场中运动', '电动机工作原理', '扬声器的工作原理', '跨学科实践：制作简易直流电动机', '探究导体在磁场中运动时产生感应电流的条件', '发电机工作原理', '麦克风工作原理'] },
                    { id: 'ch21', name: '第二十一章・电磁波及其应用', experiments: ['电磁波及其应用'] },
                    { id: 'ch22', name: '第二十二章・能源与可持续发展', experiments: ['能源的分类', '核裂变与核聚变'] }
                ]
            }
        ];

        // ================================================================
        // 2. 引用外部资源（由外部 JS 定义全局变量）
        //    coverImages  -> 来自 cover.js
        //    videoLinks   -> 来自 video.js
        //    simLinks     -> 来自 simulate.js
        //    exerciseData -> 来自 question.js
        // ================================================================

        // ================================================================
        // 3. DOM 引用 & 状态
        // ================================================================

        const bookBtnBox = document.getElementById('bookBtnBox');
        const chapterBtnBox = document.getElementById('chapterBtnBox');
        const container = document.getElementById('experimentContainer');

        const videoModal = document.getElementById('videoModal');
        const videoIframe = document.getElementById('videoIframe');
        const videoModalTitle = document.getElementById('videoModalTitle');
        const videoModalClose = document.getElementById('videoModalClose');

        const exerciseModal = document.getElementById('exerciseModal');
        const exerciseModalTitle = document.getElementById('exerciseModalTitle');
        const exerciseModalClose = document.getElementById('exerciseModalClose');
        const exerciseContent = document.getElementById('exerciseContent');

        const searchRow = document.getElementById('searchRow');
        const searchInput = document.getElementById('searchInput');

        let selectedBookId = null;
        let selectedChapterId = null;
        let searchKeyword = '';

        // ---- 上次选择记忆（localStorage）----
        const SEL_KEY = 'physicsExpLastSelection';
        function saveSelection(){
            try{
                localStorage.setItem(SEL_KEY, JSON.stringify({
                    book: selectedBookId,
                    chapter: selectedChapterId
                }));
            }catch(e){ /* 隐私模式等场景下可能失败，忽略即可 */ }
        }
        function restoreSelection(){
            try{
                const raw = localStorage.getItem(SEL_KEY);
                if(!raw) return;
                const data = JSON.parse(raw);
                if(!data || !bookData.some(b => b.id === data.book)) return;
                selectedBookId = data.book;
                const book = bookData.find(b => b.id === data.book);
                if(data.chapter && book && book.chapters.some(ch => ch.id === data.chapter)){
                    selectedChapterId = data.chapter;
                }
            }catch(e){ /* 忽略解析错误 */ }
        }

        // ================================================================
        // 4. 渲染函数
        // ================================================================

        function renderBookButtons() {
            bookBtnBox.innerHTML = '';
            bookData.forEach(book => {
                const btn = document.createElement('button');
                btn.className = 'select-btn';
                if(selectedBookId === book.id) btn.classList.add('active');
                btn.textContent = book.name;
                btn.dataset.bookid = book.id;
                btn.addEventListener('click',()=>{
                    if(selectedBookId === book.id){
                        selectedBookId = null;
                        selectedChapterId = null;
                    }else{
                        selectedBookId = book.id;
                        selectedChapterId = null;
                    }
                    saveSelection();
                    renderBookButtons();
                    renderChapterButtons();
                    renderExperiments();
                })
                bookBtnBox.appendChild(btn);
            })
        }

        function renderChapterButtons() {
            chapterBtnBox.innerHTML = '';
            if(!selectedBookId) return;
            const book = bookData.find(b => b.id === selectedBookId);
            book.chapters.forEach(ch=>{
                const btn = document.createElement('button');
                btn.className = 'select-btn';
                if(selectedChapterId === ch.id) btn.classList.add('active');
                btn.textContent = ch.name;
                btn.dataset.chapid = ch.id;
                btn.addEventListener('click',()=>{
                    if(selectedChapterId === ch.id){
                        selectedChapterId = null;
                    }else{
                        selectedChapterId = ch.id;
                    }
                    saveSelection();
                    renderChapterButtons();
                    renderExperiments();
                })
                chapterBtnBox.appendChild(btn);
            })
        }

        // 构建单张实验卡片 HTML；chapterLabel 用于全局搜索时标注来源章节
        function buildCardHtml(expName, chapterLabel){
            const coverImages = window.coverImages || {};
            const videoLinks = window.videoLinks || {};
            const simLinks = window.simLinks || {};
            const exerciseData = window.exerciseData || {};

            const hasVideo = !!videoLinks[expName];
            const hasSim = !!simLinks[expName];
            const hasExercise = !!exerciseData[expName];
            const coverUrl = coverImages[expName] || '';

            let coverHtml = '';
            if(coverUrl){
                coverHtml = `<div class="exp-cover"><img src="${coverUrl}" alt="${expName}" loading="lazy"></div>`;
            }else{
                coverHtml = `<div class="exp-cover">📷 实验封面待上传</div>`;
            }

            const tagHtml = chapterLabel ? `<div class="exp-chapter-tag">${chapterLabel}</div>` : '';

            return `
                <div class="experiment-card">
                    ${coverHtml}
                    <div class="exp-card-body">
                        ${tagHtml}
                        <div class="experiment-name">${expName}</div>
                        <div class="btn-group">
                            <button class="btn btn-video" data-exp="${expName}" ${!hasVideo ? 'disabled' : ''}>
                                🎬 视频资源
                            </button>
                            <button class="btn btn-sim" data-exp="${expName}" ${!hasSim ? 'disabled' : ''}>
                                🖥️ 模拟软件
                            </button>
                            <button class="btn btn-exercise" data-exp="${expName}" ${!hasExercise ? 'disabled' : ''}>
                                📝 习题资源
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // 为当前容器内的卡片按钮绑定事件
        function bindCardEvents(){
            const videoLinks = window.videoLinks || {};
            const simLinks = window.simLinks || {};
            container.querySelectorAll('.btn-video:not([disabled])').forEach(btn=>{
                btn.onclick = ()=>{
                    openVideoModal(btn.dataset.exp, videoLinks[btn.dataset.exp]);
                }
            })
            container.querySelectorAll('.btn-sim:not([disabled])').forEach(btn=>{
                btn.onclick = ()=>{
                    // 直接在新标签页打开模拟软件，获得更大的显示范围
                    window.open(simLinks[btn.dataset.exp], '_blank');
                }
            })
            container.querySelectorAll('.btn-exercise:not([disabled])').forEach(btn=>{
                btn.onclick = ()=>{
                    openExerciseModal(btn.dataset.exp);
                }
            })
            container.querySelectorAll('.btn[disabled]').forEach(btn=>{
                btn.onclick = ()=>{
                    alert(`【${btn.dataset.exp}】该资源暂未上传，敬请期待！`)
                }
            })
        }

        function renderExperiments() {
            // ===== 全局搜索模式：搜索所有书册/章节的实验 =====
            if(searchKeyword){
                const kw = searchKeyword.toLowerCase();
                const results = [];
                bookData.forEach(book => {
                    book.chapters.forEach(ch => {
                        ch.experiments.forEach(expName => {
                            if(expName.toLowerCase().includes(kw)){
                                results.push({
                                    name: expName,
                                    label: `${book.name} · ${ch.name}`
                                });
                            }
                        });
                    });
                });

                if(results.length === 0){
                    container.className = 'experiment-grid empty-state-mode';
                    container.innerHTML = `
                        <div class="empty-state">
                            <span class="icon">🔍</span>
                            没有找到匹配“${searchKeyword}”的实验，请换个关键词试试
                        </div>
                    `;
                    return;
                }

                container.className = 'experiment-grid';
                let html = '';
                results.forEach(item => { html += buildCardHtml(item.name, item.label); });
                container.innerHTML = html;
                bindCardEvents();
                return;
            }

            // ===== 按章节浏览模式 =====
            if(!selectedBookId || !selectedChapterId){
                container.className = 'experiment-grid empty-state-mode';
                container.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">🔍</span>
                        请先选择【书册】与【章节】，查看对应实验
                    </div>
                `;
                return;
            }

            container.className = 'experiment-grid';
            const book = bookData.find(b => b.id === selectedBookId);
            const chapter = book.chapters.find(ch => ch.id === selectedChapterId);

            let html = '';
            chapter.experiments.forEach(expName => { html += buildCardHtml(expName, ''); });
            container.innerHTML = html;
            bindCardEvents();
        }

        // ================================================================
        // 5. 弹窗控制（优化习题显示：换行 + 选项整齐）
        // ================================================================

        // 通用弹窗开关：统一处理 active 类、body 滚动锁定、iframe 清理
        function openModal(modal){
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        function closeModal(modal){
            modal.classList.remove('active');
            const iframe = modal.querySelector('iframe');
            if(iframe) iframe.src = '';
            document.body.style.overflow = '';
        }

        function openVideoModal(title,url){
            videoModalTitle.textContent = `🎬 ${title}`;
            videoIframe.src = url;
            openModal(videoModal);
        }
        function closeVideoModal(){
            closeModal(videoModal);
        }

        function openExerciseModal(expName){
            exerciseModalTitle.textContent = `📝 ${expName} 习题`;
            const data = window.exerciseData && window.exerciseData[expName];
            if(data && data.questions && data.questions.length > 0){
                let html = '';
                data.questions.forEach((q, index) => {
                    // 将题目文本中的 \n 替换为 <br> 实现换行
                    let questionHtml = q.questionText.replace(/\n/g, '<br>');
                    // 进一步优化：将选项（A．、B．等）加粗或缩进，但此处已换行，再添加左内边距
                    // 我们通过 CSS 的 white-space: pre-wrap 配合 <br> 即可实现整齐换行。
                    // 为了更美观，可将选项行用 <span class="option-line"> 包裹，但这样需要更复杂的正则，
                    // 简单起见，我们直接使用 <br>，CSS 设置 padding-left 即可。
                    html += `<div class="question-item">`;
                    html += `<div class="question-text"><strong>第${index+1}题.</strong> ${questionHtml}</div>`;
                    // 题目图片：支持 imageMaxHeight 单独控制高度
                    if (q.questionImages && q.questionImages.length > 0) {
                        html += `<div class="question-images">`;
                        q.questionImages.forEach(img => {
                            let imgStyle = '';
                            if (q.imageMaxHeight) {
                                imgStyle = ` style="max-height: ${q.imageMaxHeight};"`;
                            }
                            html += `<img src="${img}" alt="题目图片" loading="lazy"${imgStyle}>`;
                        });
                        html += `</div>`;
                    }
                    // 答案和解析部分（使用 answerText 字段）
                    if (q.answerText) {
                        html += `<button class="toggle-answer-btn" data-qidx="${index}">查看答案和解析</button>`;
                        html += `<div class="answer-section" id="answerSection_${index}">`;
                        let answerHtml = q.answerText.replace(/\n/g, '<br>');
                        html += `<div>${answerHtml}</div>`;
                        html += `</div>`;
                    } else if (q.answerImg) {
                        // 兼容旧格式（图片答案）
                        html += `<button class="toggle-answer-btn" data-qidx="${index}">查看答案和解析</button>`;
                        html += `<div class="answer-section" id="answerSection_${index}">`;
                        let imgStyle = '';
                        if (q.answerImgMaxHeight) {
                            imgStyle = ` style="max-height: ${q.answerImgMaxHeight};"`;
                        }
                        html += `<img src="${q.answerImg}" alt="答案图片" loading="lazy"${imgStyle}>`;
                        html += `</div>`;
                    } else {
                        html += `<p style="color:#999; margin-top:10px;">暂无答案和解析</p>`;
                    }
                    html += `</div>`;
                });
                exerciseContent.innerHTML = html;

                // 绑定每个题目的答案切换按钮
                exerciseContent.querySelectorAll('.toggle-answer-btn').forEach(btn => {
                    btn.addEventListener('click', function(){
                        const idx = this.dataset.qidx;
                        const section = document.getElementById(`answerSection_${idx}`);
                        if(section.classList.contains('show')){
                            section.classList.remove('show');
                            this.textContent = '查看答案和解析';
                        }else{
                            section.classList.add('show');
                            this.textContent = '隐藏答案和解析';
                        }
                    });
                });
            }else{
                exerciseContent.innerHTML = '<p style="color:#666;">该实验暂无习题资源</p>';
            }
            if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise().catch(function(err) {
        console.log('MathJax渲染出错:', err);
    });
}
            openModal(exerciseModal);
        }
        function closeExerciseModal(){
            closeModal(exerciseModal);
        }

        // 关闭按钮
        videoModalClose.onclick = closeVideoModal;
        exerciseModalClose.onclick = closeExerciseModal;

        // 点击背景关闭
        document.querySelectorAll('.modal').forEach(modal=>{
            modal.addEventListener('click',e=>{
                if(e.target === modal){
                    closeModal(modal);
                }
            })
        })

        // ESC键关闭
        document.addEventListener('keydown',e=>{
            if(e.key === 'Escape'){
                closeVideoModal();
                closeExerciseModal();
            }
        })

        // 搜索过滤：实时过滤当前章节实验
        searchInput.addEventListener('input', ()=>{
            searchKeyword = searchInput.value.trim();
            renderExperiments();
        });

        // ================================================================
        // 6. 初始化
        // ================================================================

        function init(){
            restoreSelection();
            renderBookButtons();
            renderChapterButtons();
            renderExperiments();
        }
        init();
    </script>
</body>
</html>
