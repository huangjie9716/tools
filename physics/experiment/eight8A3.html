    <!-- Widget Config -->
    <script type="application/json" id="widget-config">
    {
      "type": "simulation",
      "concept": "friction_factors",
      "description": "探究接触面粗糙程度和压力大小对滑动摩擦力的影响",
      "variables": [
        { "name": "weights_count", "label": "砝码数量", "min": 0, "max": 4, "default": 0, "unit": "个" },
        { "name": "floor_texture", "label": "接触面材质", "options": ["木板", "棉布", "毛巾"], "default": "木板" }
      ],
      "presets": [
        { "name": "研究压力影响", "variables": { "weights_count": 3, "floor_texture": "木板" } },
        { "name": "研究粗糙度影响", "variables": { "weights_count": 0, "floor_texture": "毛巾" } }

                <div class="text-2xl font-mono font-bold text-blue-600" id="force-display">0.00 N</div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const weightSlider = document.getElementById('weights_count-slider');
        const weightDisplay = document.getElementById('weights-display');
        const forceDisplay = document.getElementById('force-display');
        const statusDisplay = document.getElementById('status-display');
        const mainBtn = document.getElementById('main-btn');
        const hintBox = document.getElementById('hint-box');

        // Simulation State
        let state = {
            running: false,
            ended: false,
            paused: false,
            time: 0,
            x: 100,
            weights: 0,
            textureIdx: 0, // 0: Wood, 1: Cloth, 2: Towel
            mu: [0.25, 0.45, 0.70],
            v: 2, // Pulling velocity
            lastTs: 0
        };

        function setTexture(idx) {
            state.textureIdx = idx;
            document.querySelectorAll('.texture-btn').forEach((btn, i) => {
                if(i === idx) {
                    btn.classList.add('border-blue-500', 'bg-blue-50', 'text-blue-700');
                    btn.classList.remove('border-transparent', 'bg-white', 'text-slate-600');
                } else {
                    btn.classList.remove('border-blue-500', 'bg-blue-50', 'text-blue-700');
                    btn.classList.add('border-transparent', 'bg-white', 'text-slate-600');
                }
            });
            calculateFriction();
            if(!state.running) draw();
        }

        function calculateFriction() {
            const baseMass = 2.0;
            const weightMass = 1.0;
            const totalMass = baseMass + (state.weights * weightMass);
            const friction = state.mu[state.textureIdx] * totalMass * 9.8;
            state.frictionValue = friction;
            return friction;
        }

        function init() {
            resize();
            window.addEventListener('resize', resize);
            weightSlider.addEventListener('input', (e) => {
                state.weights = parseInt(e.target.value);
                weightDisplay.innerText = state.weights + ' 个';
                calculateFriction();
                if(!state.running) draw();
            });
            
            // Key controls
            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space') toggleSim();
                if (e.code === 'KeyR') resetSim();
            });

            resetSim();
            requestAnimationFrame(loop);
        }

        function resize() {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            draw();
        }

        function toggleSim() {
            if (state.ended) {
                resetSim();
                startSim();
            } else if (state.running) {
                pauseSim();
            } else {
                startSim();
            }
        }

        function startSim() {
            state.running = true;
            state.paused = false;
            state.ended = false;
            mainBtn.innerText = '暂停实验';
            statusDisplay.innerText = '正在匀速拉动...';
            statusDisplay.classList.add('text-blue-600');
            hintBox.style.opacity = '1';
        }

        function pauseSim() {
            state.running = false;
            state.paused = true;
            mainBtn.innerText = '继续实验';
            statusDisplay.innerText = '已暂停';
            statusDisplay.classList.remove('text-blue-600');
        }

        function resetSim() {
            state.running = false;
            state.paused = false;
            state.ended = false;
            state.x = 100;
            state.time = 0;
            mainBtn.innerText = '启动实验';
            statusDisplay.innerText = '准备就绪';
            statusDisplay.classList.remove('text-blue-600', 'text-green-600');
            forceDisplay.innerText = '0.00 N';
            hintBox.style.opacity = '0';
            calculateFriction();
            draw();
        }

        function applyPreset(idx) {
            const config = JSON.parse(document.getElementById('widget-config').textContent);
            const preset = config.presets[idx];
            
            weightSlider.value = preset.variables.weights_count;
            state.weights = preset.variables.weights_count;
            weightDisplay.innerText = state.weights + ' 个';
            
            const texMap = {"木板": 0, "棉布": 1, "毛巾": 2};
            setTexture(texMap[preset.variables.floor_texture]);
            
            resetSim();
        }

        function loop(ts) {
            const dt = ts - state.lastTs;
            state.lastTs = ts;

            if (state.running && !state.paused) {
                state.x += state.v;
                
                // Spring scale value updates
                const targetF = state.frictionValue;
                forceDisplay.innerText = targetF.toFixed(2) + ' N';

                const limit = canvas.width / (window.devicePixelRatio || 1) - 350;
                if (state.x > limit) {
                    state.running = false;
                    state.ended = true;
                    mainBtn.innerText = '重新开始';
                    statusDisplay.innerText = '实验完成';
                    statusDisplay.classList.add('text-green-600');
                }
            }
            
            draw();
            requestAnimationFrame(loop);
        }

        function draw() {
            const w = canvas.width / (window.devicePixelRatio || 1);
            const h = canvas.height / (window.devicePixelRatio || 1);
            ctx.clearRect(0, 0, w, h);

            const floorY = h * 0.7;
            
            // 1. Draw Floor
            drawFloor(ctx, 50, floorY, w - 100, 40, state.textureIdx);

            // 2. Draw Wooden Block
            const blockW = 120;
            const blockH = 60;
            const blockX = state.x;
            const blockY = floorY - blockH;

            // Block Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.fillRect(blockX + 5, blockY + blockH - 5, blockW, 10);

            // Wooden texture block
            ctx.fillStyle = '#d97706';
            ctx.fillRect(blockX, blockY, blockW, blockH);
            ctx.strokeStyle = '#92400e';
            ctx.lineWidth = 2;
            ctx.strokeRect(blockX, blockY, blockW, blockH);
            
            // Wood Grain
            ctx.beginPath();
            ctx.strokeStyle = '#b45309';
            ctx.lineWidth = 1;
            for(let i=1; i<4; i++){
                ctx.moveTo(blockX + 10, blockY + i*15);
                ctx.lineTo(blockX + blockW - 10, blockY + i*15);
            }
            ctx.stroke();

            // 3. Draw Weights
            for (let i = 0; i < state.weights; i++) {
                const ww = 80;
                const wh = 25;
                const wx = blockX + (blockW - ww) / 2;
                const wy = blockY - (i + 1) * wh;
                
                ctx.fillStyle = '#64748b';
                ctx.beginPath();
                ctx.roundRect(wx, wy, ww, wh, 4);
                ctx.fill();
                ctx.strokeStyle = '#334155';
                ctx.stroke();
                
                // Weight text
                ctx.fillStyle = 'white';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('1kg', wx + ww/2, wy + wh/1.5);
            }

            // 4. Draw Spring Scale
            const scaleX = blockX + blockW;
            const scaleY = blockY + blockH / 2;
            const scaleLength = 180;
            const scaleHeight = 30;
            
            // String connecting block to scale
            ctx.beginPath();
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 2;
            ctx.moveTo(blockX + blockW, scaleY);
            ctx.lineTo(scaleX + 20, scaleY);
            ctx.stroke();

            // Scale Body
            ctx.fillStyle = '#f1f5f9';
            ctx.strokeStyle = '#94a3b8';
            ctx.beginPath();
            ctx.roundRect(scaleX + 20, scaleY - scaleHeight/2, scaleLength, scaleHeight, 4);
            ctx.fill();
            ctx.stroke();

            // Spring inside
            const stretch = state.running || state.paused ? (state.frictionValue * 4) : 0;
            ctx.beginPath();
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 1.5;
            let startSx = scaleX + 30;
            ctx.moveTo(startSx, scaleY);
            for(let i=0; i<15; i++) {
                ctx.lineTo(startSx + (i*8), scaleY + (i%2 === 0 ? -8 : 8));
            }
            ctx.stroke();

            // Pointer/Indicator
            const pointerX = scaleX + 30 + stretch;
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.moveTo(pointerX, scaleY - 12);
            ctx.lineTo(pointerX - 4, scaleY - 18);
            ctx.lineTo(pointerX + 4, scaleY - 18);
            ctx.fill();

            // Scale Markings
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 1;
            for(let i=0; i<=10; i++) {
                const mx = scaleX + 30 + (i * 14);
                ctx.moveTo(mx, scaleY + 8);
                ctx.lineTo(mx, scaleY + 14);
            }
            ctx.stroke();

            // 5. "Hand" or "Hook" pulling
            const hookX = scaleX + 20 + scaleLength + 20;
            ctx.beginPath();
            ctx.arc(hookX, scaleY, 10, 0, Math.PI * 2);
            ctx.fillStyle = '#334155';
            ctx.fill();
            
            // Motion lines if running
            if(state.running) {
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(59, 130, 246, 0.5)';
                ctx.lineWidth = 3;
                ctx.moveTo(hookX + 20, scaleY - 10); ctx.lineTo(hookX + 40, scaleY - 10);
                ctx.moveTo(hookX + 25, scaleY); ctx.lineTo(hookX + 45, scaleY);
                ctx.moveTo(hookX + 20, scaleY + 10); ctx.lineTo(hookX + 40, scaleY + 10);
                ctx.stroke();
            }
        }

        function drawFloor(ctx, x, y, w, h, type) {
            ctx.save();
            // Floor Base
            if (type === 0) { // Wood
                ctx.fillStyle = '#fed7aa';
                ctx.fillRect(x, y, w, h);
                ctx.strokeStyle = '#ea580c';
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, w, h);
            } else if (type === 1) { // Cotton
                ctx.fillStyle = '#e2e8f0';
                ctx.fillRect(x, y, w, h);
                // Cotton pattern
                ctx.strokeStyle = '#94a3b8';
                ctx.setLineDash([5, 5]);
                for(let i=1; i<4; i++) {
                    ctx.beginPath();
                    ctx.moveTo(x, y + i*10);
                    ctx.lineTo(x + w, y + i*10);
                    ctx.stroke();
                }
            } else { // Towel
                ctx.fillStyle = '#cbd5e1';
                ctx.fillRect(x, y, w, h);
                // Rough pattern
                ctx.fillStyle = '#94a3b8';
                for(let i=0; i<w; i+=10) {
                    for(let j=0; j<h; j+=10) {
                        ctx.beginPath();
                        ctx.arc(x + i + Math.random()*5, y + j + Math.random()*5, 2, 0, 2*Math.PI);
                        ctx.fill();
                    }
                }
            }
            ctx.restore();
        }

        // --- Teacher Action Listeners ---
        window.addEventListener('message', function(event) {
            const { type, target, state: newState, content } = event.data;

            switch (type) {
                case 'SET_WIDGET_STATE':
                    if (newState) {
                        if (newState.weights_count !== undefined) {
                            weightSlider.value = newState.weights_count;
                            weightSlider.dispatchEvent(new Event('input'));
                        }
                        if (newState.floor_texture !== undefined) {
                            const texMap = {"木板": 0, "棉布": 1, "毛巾": 2};
                            setTexture(texMap[newState.floor_texture] || 0);
                        }
                    }
                    break;

                case 'HIGHLIGHT_ELEMENT':
                    const highlightEl = document.querySelector(target) || document.getElementById(target.replace('#',''));
                    if (highlightEl) {
                        highlightEl.style.outline = '4px solid rgba(59, 130, 246, 0.8)';
                        highlightEl.style.outlineOffset = '4px';
                        highlightEl.style.animation = 'pulse-highlight 2s infinite';
                        setTimeout(() => {
                            highlightEl.style.outline = '';
                            highlightEl.style.animation = '';
                        }, 4000);
                    }
                    break;

                case 'ANNOTATE_ELEMENT':
                    const annotateEl = document.querySelector(target) || document.getElementById(target.replace('#',''));
                    if (annotateEl && content) {
                        const rect = annotateEl.getBoundingClientRect();
                        const tooltip = document.createElement('div');
                        tooltip.className = 'teacher-annotation';
                        tooltip.style.cssText = `position:fixed; top:${rect.top - 50}px; left:${rect.left}px; background:rgba(30,41,59,0.9); color:white; padding:8px 16px; border-radius:8px; font-size:14px; z-index:1000; animation:fadeIn 0.3s; pointer-events:none; white-space:nowrap;`;
                        tooltip.textContent = content;
                        document.body.appendChild(tooltip);
                        setTimeout(() => tooltip.remove(), 4000);
                    }
                    break;
            }
        });

        // Start
        init();
    </script>

</body></html>
