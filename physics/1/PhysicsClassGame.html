<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>初中物理课堂知识PK赛</title>

  <!--
    ===================================================================
    项目结构（拆分后）
    -------------------------------------------------------------------
    PhysicsClassGame.html  ← 本文件：只保留页面结构与模块引用
    css/
      base.css        基础样式（骨架、顶部栏、开始界面、结果界面）
      game.css        双人面板、题干区、答题按钮、单人刷题区
      overlays.css    错题回顾面板、彩带庆祝
      responsive.css  响应式 + 全屏适配（必须最后加载）
      effects.css     拖动手势、图片放大、左滑提示
    data/
      questions.js    题库（新增题目改这里）
      chapter-names.js 小节显示名
      grade-structure.js 年级 → 章 → 节
      tag-map.js      章节知识点标签
    js/
      config.js       全局配置 CONFIG + DOM 工具 $()
      question-text.js 物理符号规范化 + 题干渲染
      sound.js        音效
      state.js        游戏状态 + 洗牌
      start-screen.js 开始界面（下拉框、题量、标签、记忆）
      game-flow.js    开始 / 返回 / 重开 / 计时 / 下一题
      game-pk.js      双人 PK 模式
      game-single.js  单人刷题模式
      results.js      结果界面 + 错题回顾 + 彩带
      ui-*.js         全屏、图片放大、拖动滚动、左滑下一题、键盘快捷键、字号放大
      main.js         入口（最后加载）
    ===================================================================
  -->

  <!-- ============ 样式（顺序不可调整） ============ -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/game.css" />
  <link rel="stylesheet" href="css/overlays.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="css/effects.css" />

  <!-- 添加公式解析（MathJax SVG 输出，仅加载一个输出处理器） -->
  <script>
  MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\(', '\)']],
      displayMath: [['$$', '$$'], ['\[', '\]']],
      processEscapes: true
    },
    svg: {
      fontCache: 'global'
    }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async defer></script>
</head>
<body>

  <!-- ============ 开始界面 ============ -->
  <div class="start-screen" id="startScreen">
    <div class="start-card">
      <button class="result-home-btn fs-btn" onclick="toggleFullscreen()" title="全屏 / 退出全屏（快捷键 F）">⛶ 全屏</button>
      <h1>🎮 初中物理课堂知识PK赛</h1>
      <p>双人同时作答 · 每题各答一次，答对 +10 分，答错 -10 分</p>
      <p>选择年级、章、节后，系统自动加载对应题库，题量动态适配</p>
      <p>答题结束后：左滑屏幕 → 进入下一题（也可点击“下一题”或按回车）</p>
      <div class="chapter-select-area">
        <div class="select-group">
          <label for="gradeSelect">📚 年级</label>
          <select id="gradeSelect"></select>
        </div>
        <div class="select-group">
          <label for="chapterSelect">📖 章</label>
          <select id="chapterSelect"></select>
        </div>
        <div class="select-group" id="sectionGroup">
          <label for="sectionSelect">📝 节</label>
          <select id="sectionSelect"></select>
        </div>
      </div>
      <div id="questionCountHint">当前题库共 0 题</div>
      <div class="tag-list" id="tagList">
        <span class="tag">长度测量</span>
        <span class="tag">单位换算</span>
        <span class="tag">刻度尺读数</span>
        <span class="tag">停表读数</span>
      </div>
      <div class="start-btns">
        <button class="start-btn" id="startBtn" onclick="startGame()">开始 PK</button>
        <button class="start-btn secondary" id="singleBtn" onclick="startSingle()">单人刷题</button>
      </div>
    </div>
  </div>

  <!-- ============ 游戏主界面 ============ -->
  <div class="game-container" id="gameContainer">
    <div class="top-bar">
      <button class="top-btn" onclick="restartGame()">重新开始</button>
      <div class="top-info">
        <div class="timer-box">⏱ <span id="timerDisplay">00:00</span></div>
        <div class="question-progress" id="questionProgress">第 1 / 0 题</div>
        <div class="topic-badge" id="topicBadge">知识点：—</div>
        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">下一题 ▶</button>
      </div>
      <div style="display:flex;gap:10px;">
        <button class="top-btn fs-btn" onclick="toggleFullscreen()" title="全屏 / 退出全屏（快捷键 F）">⛶ 全屏</button>
        <button class="top-btn" onclick="goHome()">返回主界面</button>
      </div>
    </div>
    <div class="main-area" id="mainArea">
      <!-- 参赛者 A -->
      <div class="player-panel player-a" id="panelA">
        <div class="player-head">
          <div class="player-info-left">
            <div class="avatar">A</div>
            <div class="player-name">参赛者</div>
          </div>
          <div class="player-score-right">
            <div class="score-label">当前得分</div>
            <div class="score-num" id="scoreA">0</div>
          </div>
        </div>
        <div class="player-status" id="statusA">等待本题作答</div>
        <div class="answer-area" id="answerAreaA"></div>
        <div class="zoom-row">
          <button class="zoom-btn zoom-options-down-btn" onclick="zoomOptionsFont(-1)" title="缩小选项字号（左右两侧同步）">－</button>
          <button class="zoom-btn zoom-options-btn" id="zoomOptionsA" onclick="zoomOptionsFont(1)" title="放大选项字号（左右两侧同步）">＋</button>
        </div>
        <div class="record-wrap">
          <div class="record-title">答题记录</div>
          <div class="record-dots" id="recordA"></div>
        </div>
      </div>

      <!-- 中间区域 -->
      <div class="question-area">
        <div class="q-dots" id="qDots"></div>
        <div class="mid-hint" id="midHint"></div>
        <div class="question-text" id="questionText">点击“开始 PK”后显示题目</div>
        <div class="result-msg" id="resultMsg"></div>
        <div class="zoom-row">
          <button class="zoom-btn" id="zoomQuestionDownBtn" onclick="zoomQuestionText(-1)" title="缩小题干字号">－</button>
          <button class="zoom-btn" id="zoomQuestionBtn" onclick="zoomQuestionText(1)" title="放大题干字号">＋</button>
        </div>
      </div>

      <!-- 参赛者 B -->
      <div class="player-panel player-b" id="panelB">
        <div class="player-head">
          <div class="player-info-left">
            <div class="avatar">B</div>
            <div class="player-name">参赛者</div>
          </div>
          <div class="player-score-right">
            <div class="score-label">当前得分</div>
            <div class="score-num" id="scoreB">0</div>
          </div>
        </div>
        <div class="player-status" id="statusB">等待本题作答</div>
        <div class="answer-area" id="answerAreaB"></div>
        <div class="zoom-row">
          <button class="zoom-btn zoom-options-down-btn" onclick="zoomOptionsFont(-1)" title="缩小选项字号（左右两侧同步）">－</button>
          <button class="zoom-btn zoom-options-btn" id="zoomOptionsB" onclick="zoomOptionsFont(1)" title="放大选项字号（左右两侧同步）">＋</button>
        </div>
        <div class="record-wrap">
          <div class="record-title">答题记录</div>
          <div class="record-dots" id="recordB"></div>
        </div>
      </div>
    </div>

    <!-- 单人刷题模式 -->
    <div class="single-area" id="singleArea" style="display:none;">
      <div class="s-q-dots" id="sQdots"></div>
      <div class="s-question-text" id="sQuestionText">点击“单人刷题”后显示题目</div>
      <div class="s-answer-area" id="sAnswerArea"></div>
      <div class="s-result-msg" id="sResultMsg"></div>
      <div class="s-track" id="sTrack">答对 <b id="sCorrect">0</b> 题 ｜ 答错 <b id="sWrong">0</b> 题 ｜ 得分 <b id="sScore">0</b></div>
      <div class="zoom-row">
        <button class="zoom-btn zoom-options-down-btn" onclick="zoomOptionsFont(-1)" title="缩小选项字号">－</button>
        <button class="zoom-btn zoom-options-btn" id="zoomOptionsS" onclick="zoomOptionsFont(1)" title="放大选项字号">＋</button>
      </div>
    </div>
  </div>

  <!-- ============ 结果界面 ============ -->
  <div class="result-screen" id="resultScreen">
    <div class="result-card">
      <div class="result-top-actions">
        <button class="result-home-btn fs-btn" onclick="toggleFullscreen()" title="全屏 / 退出全屏（快捷键 F）">⛶ 全屏</button>
        <button class="result-home-btn" onclick="goHome()">返回主界面</button>
      </div>
      <div id="resultEmoji"></div>
      <div class="result-title" id="resultTitle"></div>
      <div class="score-summary" id="scoreSummary"></div>
      <div class="result-stats" id="resultStats"></div>
      <div class="result-buttons">
        <button class="restart-btn" onclick="restartGame()">再来一局</button>
        <button class="restart-btn ghost" id="redoBtn" onclick="redoMistakes()" style="display:none;">重做错题</button>
        <button class="restart-btn ghost" id="viewBtn" onclick="toggleMistakes()">查看错题</button>
      </div>
    </div>
  </div>

  <!-- 错题全屏面板 -->
  <div class="mistakes-overlay" id="mistakesOverlay">
    <div class="mistakes-panel">
      <div class="mistakes-header">
        <h2>📋 错题回顾</h2>
        <div class="mistakes-toggle" id="mistakesToggle" style="display:none;">
          <button class="mistakes-tab" id="tabAll" onclick="setMistakesView('all')">全部题目</button>
          <button class="mistakes-tab" id="tabWrong" onclick="setMistakesView('wrong')">仅错题</button>
        </div>
        <div style="display:flex;gap:10px;">
          <button class="mistakes-close fs-btn" onclick="toggleFullscreen()" title="全屏 / 退出全屏（快捷键 F）">⛶ 全屏</button>
          <button class="mistakes-close" onclick="closeMistakes()">✕ 关闭</button>
        </div>
      </div>
      <div class="mistakes-list" id="mistakesList"></div>
    </div>
  </div>

  <!-- 彩带容器 -->
  <div class="confetti-container" id="confettiContainer"></div>

  <!-- 图片放大查看器 -->
  <div class="img-viewer" id="imgViewer" onclick="onViewerBackdropClick(event)">
    <img id="imgViewerImg" src="" alt="" draggable="false" />
    <button class="img-viewer-close" onclick="closeImageViewer()" title="关闭（Esc）">✕</button>
  </div>

  <!-- 左滑下一题提示（仅在手势进行中显示） -->
  <div class="swipe-hint" id="swipeHint"><span>下一题</span><span class="arrow">▶</span></div>

  <!-- ===================================================================
       脚本：按依赖顺序加载（本地 file:// 直接双击打开也能正常运行）
       =================================================================== -->

  <!-- 数据层：题库与章节结构 -->
  <script src="data/questions.js"></script>
  <script src="data/chapter-names.js"></script>
  <script src="data/grade-structure.js"></script>
  <script src="data/tag-map.js"></script>

  <!-- 核心层：配置、文本渲染、音效、状态 -->
  <script src="js/config.js"></script>
  <script src="js/question-text.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/state.js"></script>

  <!-- 界面交互层：全屏、图片放大、拖动滚动、左滑下一题、键盘、字号放大 -->
  <script src="js/ui-fullscreen.js"></script>
  <script src="js/ui-image-viewer.js"></script>
  <script src="js/ui-drag-scroll.js"></script>
  <script src="js/ui-swipe-next.js"></script>
  <script src="js/ui-keyboard.js"></script>
  <script src="js/ui-zoom.js"></script>

  <!-- 业务层：开始界面、流程控制、双人 / 单人、结果与错题 -->
  <script src="js/start-screen.js"></script>
  <script src="js/game-flow.js"></script>
  <script src="js/game-pk.js"></script>
  <script src="js/game-single.js"></script>
  <script src="js/results.js"></script>

  <!-- 入口 -->
  <script src="js/main.js"></script>
</body>
</html>
