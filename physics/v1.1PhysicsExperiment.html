<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>初中物理实验资源库</title>
    <style>
        /* ====================== 全局基础样式 ====================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Noto Sans SC', Roboto, 'Helvetica Neue', sans-serif;
            background: #f8fafc;
            color: #1e2a3a;
            line-height: 1.6;
            padding: 0;
        }

        /* ====================== 顶部标题区域 ====================== */
        .header-wrap {
            background: #ffffff;
            padding: 16px 24px;
            position: relative;
        }

        .main-title {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 1px;
            text-align: center;
            position: relative;
            z-index: 2;
        }
        .main-title span {
            color: #2576D9;
        }
        .header-divider {
            width: 100%;
            height: 2px;
            margin-top:14px;
            background: linear-gradient(90deg, transparent, #94bce8, transparent);
        }

        /* ====================== 筛选控件区域 ====================== */
        .filter-wrap {
            max-width: 1260px;
            margin: 32px auto;
            padding: 0 24px;
        }
        .filter-row {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-label {
            font-size: 18px;
            font-weight: 600;
            color: #334155;
            min-width: 110px;
            flex-shrink: 0;
        }
        .btn-group-select {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .select-btn {
            padding: 9px 18px;
            border-radius: 7px;
            border: 1.5px solid #cbd5e1;
            background: #ffffff;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .select-btn.active {
            background-color: #2576D9;
            color: white;
            border-color: #2576D9;
        }
        .select-btn:hover:not(.active) {
            border-color: #2576D9;
            background: #f0f7ff;
        }

        /* ====================== 实验卡片列表区域 ====================== */
        .experiment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
            gap: 28px;
            max-width: 1260px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .experiment-grid.empty-state-mode {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 240px);
        }

        .experiment-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            border: 1px solid #edf2f9;
            transition: transform 0.2s, box-shadow 0.25s;
            overflow: hidden;
        }
        .experiment-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 26px rgba(26, 111, 181, 0.07);
            border-color: #c7ddf5;
        }

        .exp-cover {
            width: 100%;
            height: 180px;
            background: #e9edf3;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8892a0;
            font-size: 18px;
        }
        .exp-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .exp-card-body {
            padding: 20px;
        }
        .experiment-name {
            font-size: 19px;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px dashed #e2e8f0;
            text-align: center;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn {
            flex: 1 0 auto;
            padding: 10px 4px;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            min-width: 75px;
            letter-spacing: 0.2px;
        }

        .btn:hover:not(:disabled) {
            transform: scale(1.02);
        }
        .btn:active:not(:disabled) {
            transform: scale(0.97);
        }
        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        .btn-video {
            background: #e3f0ff;
            color: #1a6fb5;
        }
        .btn-video:hover:not(:disabled) {
            background: #cde2fe;
        }

        .btn-sim {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .btn-sim:hover:not(:disabled) {
            background: #d4edda;
        }

        .btn-exercise {
            background: #fff3e0;
            color: #bf6f00;
        }
        .btn-exercise:hover:not(:disabled) {
            background: #ffe4b5;
        }

        /* ====================== 弹窗通用样式 ====================== */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(3px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal.active {
            display: flex;
        }
        .video-modal-content {
            background: #ffffff;
            border-radius: 16px;
            width: 96%;
            height: 92vh;
            padding: 22px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.25);
            animation: fadeUp 0.25s ease;
            display: flex;
            flex-direction: column;
        }
        .modal-content {
            background: #ffffff;
            border-radius: 16px;
            width: 100%;
            max-width: 900px;
            padding: 28px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.25);
            animation: fadeUp 0.25s ease;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h3 {
            font-size: 22px;
            font-weight: 600;
            color: #0f172a;
        }
        .modal-close {
            background: transparent;
            border: none;
            font-size: 34px;
            line-height: 1;
            cursor: pointer;
            color: #64748b;
        }
        .modal-close:hover {
            color: #0f172a;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .video-wrapper {
            flex: 1;
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 10px;
            background: #0f172a;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .sim-wrapper {
            min-height: 460px;
            border-radius: 10px;
            border:1px solid #e2e8f0;
            overflow:hidden;
        }
        .sim-wrapper iframe {
            width:100%;
            height:460px;
            border:0;
        }

        .exercise-body {
            max-height: 60vh;
            overflow-y: auto;
            padding: 4px;
            font-size:17px;
        }
        .answer-block {
            margin-top: 20px;
            display: none;
        }
        .answer-block.show {
            display:block;
        }
        .answer-block img {
            max-width:100%;
            border-radius:8px;
            border:1px solid #e2e8f0;
        }
        .toggle-answer-btn {
            margin-top:18px;
            padding:12px 24px;
            border-radius:8px;
            border:none;
            background:#2576D9;
            color:white;
            cursor:pointer;
            font-size:16px;
        }

        /* ====================== 空状态内部样式 ====================== */
        .empty-state {
            text-align: center;
            color: #8892a0;
            font-size: 20px;
        }
        .empty-state .icon {
            font-size: 64px;
            display: block;
            margin-bottom: 16px;
        }

        /* ====================== 移动端自适应 ====================== */
        @media (max-width: 900px) {
            .filter-row {
                flex-direction: column;
                align-items: flex-start;
            }
            .filter-label {
                min-width: unset;
                margin-bottom:8px;
            }
        }
        @media (max-width: 768px) {
            .main-title {
                font-size: 30px;
            }
            .experiment-grid {
                grid-template-columns: 1fr;
            }
            .video-modal-content {
                width: 100%;
                height: 94vh;
                padding:14px;
            }
            .experiment-grid.empty-state-mode {
                min-height: calc(100vh - 200px);
            }
        }
        @media (max-width: 480px) {
            .main-title {
                font-size: 26px;
            }
            .select-btn {
                font-size:15px;
                padding:8px 14px;
            }
        }
    </style>
</head>
<body>
    <!-- ====================== 顶部标题区域 ====================== -->

    <!-- ====================== 习题弹窗 ====================== -->

            <button class="toggle-answer-btn" id="toggleAnswerBtn">显示答案</button>
            <div class="answer-block" id="answerBox">
                <img id="answerImg" src="" alt="参考答案">
            </div>

    // 提取所有实验名称（按顺序，只取八年级上册和下册，共64个）
    function getAllExperimentNames() {
        const names = [];
        // 只取前两册（八年级上册和下册）
        for (let i = 0; i < 2; i++) {
            const book = bookData[i];
            for (const ch of book.chapters) {
                for (const exp of ch.experiments) {
                    names.push(exp);
                }
            }
        }
        return names;
    }

    const allExpNames = getAllExperimentNames(); // 长度应为 37+27=64

    // 构建 videoLinks 对象
    const videoLinks = {};
    for (let i = 0; i < allExpNames.length; i++) {
        const url = videoUrlList[i];
        // 提取 BV 号（匹配 BV1... 或 BV...）
        const match = url.match(/BV[a-zA-Z0-9]+/);
        if (match) {
            const bvid = match[0];
            videoLinks[allExpNames[i]] = `https://player.bilibili.com/player.html?bvid=${bvid}&autoplay=1`;
        } else {
            videoLinks[allExpNames[i]] = url; // 若无法提取，直接使用原链接（但通常能提取）
        }
    }

    // 注意：九年级实验暂未提供视频，videoLinks中不包含，按钮将禁用

    // ================================================================
    // 3. 模拟软件、习题、封面映射
    // ================================================================

    const simLinks = {};
    const exerciseData = {};

    // 封面图片自动生成（1~116）
    function buildCoverImages() {
        const coverImages = {};
        let index = 1;
        const baseUrl = 'https://pub-3827e3697a0b44428ab555d41c8d38f3.r2.dev/experiment/';
        for (const book of bookData) {
            for (const chapter of book.chapters) {
                for (const exp of chapter.experiments) {
                    coverImages[exp] = baseUrl + index + '.webp';
                    index++;
                }
            }
        }
        return coverImages;
    }
    const coverImages = buildCoverImages();

    // ================================================================
    // 4. DOM 引用 & 状态
    // ================================================================

    const bookBtnBox = document.getElementById('bookBtnBox');
    const chapterBtnBox = document.getElementById('chapterBtnBox');
    const container = document.getElementById('experimentContainer');

    const videoModal = document.getElementById('videoModal');
    const videoIframe = document.getElementById('videoIframe');
    const videoModalTitle = document.getElementById('videoModalTitle');
    const videoModalClose = document.getElementById('videoModalClose');

    const simModal = document.getElementById('simModal');
    const simIframe = document.getElementById('simIframe');
    const simModalTitle = document.getElementById('simModalTitle');
    const simModalClose = document.getElementById('simModalClose');

    const exerciseModal = document.getElementById('exerciseModal');
    const exerciseModalTitle = document.getElementById('exerciseModalTitle');
    const exerciseModalClose = document.getElementById('exerciseModalClose');
    const exerciseContent = document.getElementById('exerciseContent');
    const answerBox = document.getElementById('answerBox');
    const answerImg = document.getElementById('answerImg');
    const toggleAnswerBtn = document.getElementById('toggleAnswerBtn');

    let selectedBookId = null;
    let selectedChapterId = null;

    // ================================================================
    // 5. 渲染函数（空状态居中）
    // ================================================================

    function renderBookButtons() {
        bookBtnBox.innerHTML = '';
        bookData.forEach(book => {
            const btn = document.createElement('button');
            btn.className = 'select-btn';
            if(selectedBookId === book.id) btn.classList.add('active');
            btn.textContent = book.name;
            btn.dataset.bookid = book.id;
            btn.addEventListener('click',()=>{
                if(selectedBookId === book.id){
                    selectedBookId = null;
                    selectedChapterId = null;
                }else{
                    selectedBookId = book.id;
                    selectedChapterId = null;
                }
                renderBookButtons();
                renderChapterButtons();
                renderExperiments();
            })
            bookBtnBox.appendChild(btn);
        })
    }

    function renderChapterButtons() {
        chapterBtnBox.innerHTML = '';
        if(!selectedBookId) return;
        const book = bookData.find(b => b.id === selectedBookId);
        book.chapters.forEach(ch=>{
            const btn = document.createElement('button');
            btn.className = 'select-btn';
            if(selectedChapterId === ch.id) btn.classList.add('active');
            btn.textContent = ch.name;
            btn.dataset.chapid = ch.id;
            btn.addEventListener('click',()=>{
                if(selectedChapterId === ch.id){
                    selectedChapterId = null;
                }else{
                    selectedChapterId = ch.id;
                }
                renderChapterButtons();
                renderExperiments();
            })
            chapterBtnBox.appendChild(btn);
        })
    }

    function renderExperiments() {
        if(!selectedBookId || !selectedChapterId){
            container.className = 'experiment-grid empty-state-mode';
            container.innerHTML = `
                <div class="empty-state">
                    <span class="icon">🔍</span>
                    请先选择【书册】与【章节】，查看对应实验
                </div>
            `;
            return;
        }

        container.className = 'experiment-grid';
        const book = bookData.find(b => b.id === selectedBookId);
        const chapter = book.chapters.find(ch => ch.id === selectedChapterId);
        const experiments = chapter.experiments;

        let html = '';
        experiments.forEach(expName => {
            const hasVideo = !!videoLinks[expName];
            const hasSim = !!simLinks[expName];
            const hasExercise = !!exerciseData[expName];
            const coverUrl = coverImages[expName] || '';

            let coverHtml = '';
            if(coverUrl){
                coverHtml = `<div class="exp-cover"><img src="${coverUrl}" alt="${expName}" loading="lazy"></div>`;
            }else{
                coverHtml = `<div class="exp-cover">📷 实验封面待上传</div>`;
            }

            html += `
                <div class="experiment-card">
                    ${coverHtml}
                    <div class="exp-card-body">
                        <div class="experiment-name">${expName}</div>
                        <div class="btn-group">
                            <button class="btn btn-video" data-exp="${expName}" ${!hasVideo ? 'disabled' : ''}>
                                🎬 视频资源
                            </button>
                            <button class="btn btn-sim" data-exp="${expName}" ${!hasSim ? 'disabled' : ''}>
                                🖥️ 模拟软件
                            </button>
                            <button class="btn btn-exercise" data-exp="${expName}" ${!hasExercise ? 'disabled' : ''}>
                                📝 习题资源
                            </button>
                        </div>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;

        // 绑定事件
        container.querySelectorAll('.btn-video:not([disabled])').forEach(btn=>{
            btn.onclick = ()=>{
                const name = btn.dataset.exp;
                openVideoModal(name, videoLinks[name]);
            }
        })
        container.querySelectorAll('.btn-sim:not([disabled])').forEach(btn=>{
            btn.onclick = ()=>{
                const name = btn.dataset.exp;
                openSimModal(name, simLinks[name]);
            }
        })
        container.querySelectorAll('.btn-exercise:not([disabled])').forEach(btn=>{
            btn.onclick = ()=>{
                const name = btn.dataset.exp;
                openExerciseModal(name);
            }
        })
        container.querySelectorAll('.btn[disabled]').forEach(btn=>{
            btn.onclick = ()=>{
                alert(`【${btn.dataset.exp}】该资源暂未上传，敬请期待！`)
            }
        })
    }

    // ================================================================
    // 6. 弹窗控制
    // ================================================================

    function openVideoModal(title,url){
        videoModalTitle.textContent = `🎬 ${title}`;
        videoIframe.src = url;
        videoModal.classList.add('active');
        document.body.style.overflow='hidden';
    }
    function closeVideoModal(){
        videoModal.classList.remove('active');
        videoIframe.src = '';
        document.body.style.overflow='';
    }

    function openSimModal(title,url){
        simModalTitle.textContent = `🖥️ ${title}`;
        simIframe.src = url;
        simModal.classList.add('active');
        document.body.style.overflow='hidden';
    }
    function closeSimModal(){
        simModal.classList.remove('active');
        simIframe.src = '';
        document.body.style.overflow='';
    }

    function openExerciseModal(expName){
        exerciseModalTitle.textContent = `📝 ${expName} 习题`;
        const data = exerciseData[expName];
        if(data){
            exerciseContent.innerHTML = data.question;
            answerImg.src = data.answerImg;
        }else{
            exerciseContent.innerHTML = '<p style="color:#666;">习题正在录入中...</p>';
        }
        answerBox.classList.remove('show');
        toggleAnswerBtn.textContent = "显示答案";
        exerciseModal.classList.add('active');
        document.body.style.overflow='hidden';
    }
    function closeExerciseModal(){
        exerciseModal.classList.remove('active');
        document.body.style.overflow='';
    }

    toggleAnswerBtn.addEventListener('click',()=>{
        if(answerBox.classList.contains('show')){
            answerBox.classList.remove('show');
            toggleAnswerBtn.textContent = "显示答案";
        }else{
            answerBox.classList.add('show');
            toggleAnswerBtn.textContent = "隐藏答案";
        }
    })

    videoModalClose.onclick = closeVideoModal;
    simModalClose.onclick = closeSimModal;
    exerciseModalClose.onclick = closeExerciseModal;

    document.querySelectorAll('.modal').forEach(modal=>{
        modal.addEventListener('click',e=>{
            if(e.target === modal){
                modal.classList.remove('active');
                const iframe = modal.querySelector('iframe');
                if(iframe) iframe.src='';
                document.body.style.overflow='';
            }
        })
    })

    document.addEventListener('keydown',e=>{
        if(e.key === 'Escape'){
            closeVideoModal();
            closeSimModal();
            closeExerciseModal();
        }
    })

    // ================================================================
    // 7. 初始化
    // ================================================================

    function init(){
        renderBookButtons();
        renderChapterButtons();
        renderExperiments();
    }
    init();
</script>
