<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#070b12" />
<title>公開課智慧平台</title>
<style>
    * { box-sizing: border-box; }

    :root {
        color-scheme: dark;
        --panel: rgba(18, 26, 38, 0.94);
        --line: rgba(120, 160, 255, 0.16);
        --text: #e6edf7;
        --muted: #8fa3bd;
        --cyan: #4dd0ff;
    }

    body {
        min-height: 100vh;
        margin: 0;
        padding: 48px 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        background:
            radial-gradient(900px 520px at 8% 0%, rgba(77, 208, 255, 0.14), transparent 60%),
            radial-gradient(760px 480px at 100% 20%, rgba(124, 140, 255, 0.13), transparent 58%),
            linear-gradient(155deg, #070b12 0%, #0b1220 55%, #070b12 100%);
        background-attachment: fixed;
    }

    .container {
        width: min(100%, 1120px);
        padding: 40px;
        border: 1px solid var(--line);
        border-radius: 26px;
        background: linear-gradient(180deg, var(--panel), rgba(13, 20, 31, 0.97));
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.48);
    }

    .header {
        display: flex;
        align-items: center;
        gap: 18px;
        padding-bottom: 30px;
        border-bottom: 1px solid var(--line);
    }

    .logo {
        width: 56px;
        height: 56px;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        border: 1px solid rgba(77, 208, 255, 0.3);
        border-radius: 16px;
        background: radial-gradient(120% 120% at 20% 0%, rgba(77, 208, 255, 0.28), rgba(77, 208, 255, 0.04));
        color: var(--cyan);
        filter: drop-shadow(0 0 14px rgba(77, 208, 255, 0.25));
    }

    h1 {
        margin: 0;
        font-size: clamp(24px, 4vw, 34px);
        letter-spacing: 2px;
        font-weight: 600;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 16px;
        padding-top: 30px;
    }

    .card {
        grid-column: span 2;
    }

    .card:nth-child(4),
    .card:nth-child(5) {
        grid-column: span 3;
    }

    .card {
        --accent: var(--cyan);
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 34px;
        min-height: 176px;
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 18px;
        text-decoration: none;
        color: inherit;
        overflow: hidden;
        background: linear-gradient(145deg, rgba(22, 33, 49, 0.96), rgba(13, 21, 33, 0.96));
        background:
            radial-gradient(220px 130px at 100% 0%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 72%),
            linear-gradient(145deg, rgba(22, 33, 49, 0.96), rgba(13, 21, 33, 0.96));
        transition: transform 200ms ease, border-color 200ms ease, box-shadow 200ms ease;
    }

    .card::after {
        content: "";
        position: absolute;
        inset: auto 0 0 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        opacity: 0;
        transition: opacity 200ms ease;
    }

    .card:hover,
    .card:focus-visible {
        transform: translateY(-4px);
        border-color: rgba(120, 170, 255, 0.46);
        border-color: color-mix(in srgb, var(--accent) 46%, transparent);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px color-mix(in srgb, var(--accent) 16%, transparent);
        outline: none;
    }

    .card:hover::after,
    .card:focus-visible::after { opacity: 1; }

    .card .icon {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border-radius: 13px;
        color: var(--accent);
        background: rgba(77, 208, 255, 0.12);
        background: color-mix(in srgb, var(--accent) 12%, transparent);
        border: 1px solid rgba(77, 208, 255, 0.26);
        border: 1px solid color-mix(in srgb, var(--accent) 26%, transparent);
    }

    .card .icon svg {
        width: 24px;
        height: 24px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .card .name {
        display: block;
        margin: 0;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 3px;
    }

    .card .hint {
        display: block;
        margin: 8px 0 0;
        font-size: 13px;
        letter-spacing: 1px;
        color: var(--muted);
    }

    .card .index {
        position: absolute;
        top: 20px;
        right: 22px;
        font-size: 13px;
        letter-spacing: 1px;
        color: rgba(143, 163, 189, 0.5);
        font-variant-numeric: tabular-nums;
    }

    @media (max-width: 900px) {
        .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .card,
        .card:nth-child(4),
        .card:nth-child(5) { grid-column: auto; }
        .card:nth-child(5) { grid-column: span 2; }
    }

    @media (max-width: 560px) {
        body { padding: 20px 14px; }
        .container { padding: 24px; border-radius: 20px; }
        .header { gap: 14px; padding-bottom: 22px; }
        .logo { width: 46px; height: 46px; border-radius: 13px; }
        .grid { grid-template-columns: 1fr; }
        .card,
        .card:nth-child(5) { grid-column: auto; min-height: 132px; gap: 22px; padding: 20px; }
        .card .name { font-size: 21px; }
    }

    @media (prefers-reduced-motion: reduce) {
        .card, .card::after { transition: none; }
        .card:hover, .card:focus-visible { transform: none; }
    }
</style>
</head>
<body>
<main class="container">
    <header class="header">
        <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3 3 8l9 5 9-5-9-5Z" />
                <path d="M3 13l9 5 9-5" />
            </svg>
        </div>
        <h1>公開課智慧平台</h1>
    </header>

    <nav class="grid">
        <a class="card" href="group-cooperation.html" style="--accent:#4dd0ff">
            <span class="index">01</span>
            <span class="icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 3.5l2.6 5.3 5.9.8-4.3 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8L3.5 9.6l5.9-.8L12 3.5Z" />
                </svg>
            </span>
            <span>
                <span class="name">積分</span>
                <span class="hint">小組積分榜</span>
            </span>
        </a>

        <a class="card" href="roll-call.html" style="--accent:#ffc15e">
            <span class="index">02</span>
            <span class="icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3.5" y="3.5" width="17" height="17" rx="4" />
                    <circle cx="8.6" cy="8.6" r="1.3" />
                    <circle cx="15.4" cy="15.4" r="1.3" />
                    <circle cx="12" cy="12" r="1.3" />
                </svg>
            </span>
            <span>
                <span class="name">抽籤</span>
                <span class="hint">隨機點名</span>
            </span>
        </a>

        <a class="card" href="light-refraction.html" style="--accent:#5de0a1">
            <span class="index">03</span>
            <span class="icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M9.5 3h5" />
                    <path d="M10 3v5.2L5.9 17a3 3 0 0 0 2.7 4.3h6.8A3 3 0 0 0 18.1 17L14 8.2V3" />
                    <path d="M7.4 14h9.2" />
                </svg>
            </span>
            <span>
                <span class="name">模擬實驗</span>
                <span class="hint">光的折射</span>
            </span>
        </a>

        <a class="card" href="class-pk.html" style="--accent:#9b8cff">
            <span class="index">04</span>
            <span class="icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="8.5" />
                    <path d="M9.6 9.4a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2-2.4 3.6" />
                    <path d="M12 17.3h.01" />
                </svg>
            </span>
            <span>
                <span class="name">答題</span>
                <span class="hint">課堂知識PK</span>
            </span>
        </a>

        <a class="card" href="fish-game.html" style="--accent:#ff8a5c">
            <span class="index">05</span>
            <span class="icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M15.5 6.5c2.6 1.1 4.4 3.4 4.4 5.5s-1.8 4.4-4.4 5.5c-2.3 1-5 .8-7.4-.6L3.2 19l1.4-4a7 7 0 0 1 0-6L3.2 5l4.9 1.9c2.4-1.4 5.1-1.6 7.4-.4Z" />
                    <path d="M8.6 11h.01" />
                    <path d="M18.5 4.2 21 2" />
                </svg>
            </span>
            <span>
                <span class="name">叉魚</span>
                <span class="hint">折射挑戰</span>
            </span>
        </a>
    </nav>
</main>
</body>
</html>
