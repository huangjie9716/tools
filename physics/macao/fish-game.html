<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>光的折射 · 叉魚挑戰</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='18' r='9' fill='%23f97316'/%3E%3Cpath d='M6 16 L2 22 L6 22 Z' fill='%23f97316'/%3E%3Cpath d='M26 16 L30 22 L26 22 Z' fill='%23f97316'/%3E%3Cpath d='M16 4 L15 8 L17 8 Z' fill='%23f43f5e'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#062a33;
    --ink-soft:#0c4452;
    --sky-a:#bfe8f5;
    --sky-b:#e7f7fb;
    --water:#0e7490;
    --water-deep:#134e5c;
    --sand:#e8d7b5;
    --fish:#f97316;
    --fish-deep:#ea580c;
    --good:#16a34a;
    --bad:#dc2626;
    --accent:#0ea5e9;
    --card:rgba(6,42,51,.86);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",-apple-system,Segoe UI,sans-serif;
    overflow:hidden;color:#eafcff;
    background:linear-gradient(180deg,var(--sky-a) 0%,var(--sky-b) 55%,#cfeef6 100%);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;touch-action:manipulation;
    -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  }
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  #scene canvas{display:block;}

  /* ===== 頂部 HUD ===== */
  #hud-top{
    position:fixed;top:0;left:0;right:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;pointer-events:none;
  }
  .brand{display:flex;align-items:baseline;gap:10px;text-shadow:0 1px 6px rgba(6,42,51,.35);}
  .brand .back-link{
    pointer-events:auto; align-self:center; flex:0 0 auto;
    padding:7px 14px; border-radius:999px;
    border:1px solid rgba(6,42,51,.16);
    background:rgba(255,255,255,.66);
    color:var(--ink); font-size:13px; font-weight:700; letter-spacing:.5px;
    text-decoration:none; white-space:nowrap;
    backdrop-filter:blur(6px);
    box-shadow:0 2px 10px rgba(6,42,51,.12);
    transition:background .18s, transform .18s;
  }
  .brand .back-link:hover{background:#fff; transform:translateY(-1px);}
  .brand h1{font-size:19px;font-weight:800;letter-spacing:1px;}
  .stats{display:flex;gap:14px;align-items:center;}
  .pill{
    background:var(--card);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.14);border-radius:999px;
    padding:7px 15px;font-size:13px;font-weight:700;color:#eafcff;
    box-shadow:0 4px 16px rgba(6,42,51,.22);pointer-events:auto;
  }
  .pill b{color:#7dd3fc;}
  .pill.orange b{color:#fdba74;}

  /* ===== 視角切換（左上角，豎排，避免遮擋側面視角裡的漁民） ===== */
  #viewbar{
    position:fixed;top:52px;left:16px;z-index:21;
    display:flex;flex-direction:column;gap:4px;background:var(--card);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:5px;
    box-shadow:0 6px 22px rgba(6,42,51,.28);
  }
  .viewbtn{
    border:0;background:transparent;color:#bdeaf6;cursor:pointer;
    font-family:inherit;font-size:13px;font-weight:700;
    padding:8px 14px;border-radius:10px;transition:.2s;display:flex;align-items:center;gap:6px;
    justify-content:flex-start;white-space:nowrap;
  }
  .viewbtn svg{width:15px;height:15px;}
  .viewbtn.active{background:#0ea5e9;color:#fff;box-shadow:0 2px 10px rgba(14,165,233,.5);}
  .viewbtn:not(.active):hover{background:rgba(255,255,255,.12);}

  /* ===== 底部操作提示 ===== */
  #hint{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:20;
    background:var(--card);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.16);border-radius:14px;
    padding:11px 20px;font-size:14px;color:#d8f4fb;text-align:center;
    box-shadow:0 8px 26px rgba(6,42,51,.3);max-width:min(620px,92vw);
    pointer-events:none;transition:opacity .3s;
  }
  #hint b{color:#fdba74;}

  /* ===== 側面視角說明條（左下角，避開光路主體） ===== */
  #sidenote{
    position:fixed;bottom:16px;left:16px;z-index:19;display:none;
    background:var(--card);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.16);border-radius:12px;
    padding:10px 14px;font-size:12.5px;line-height:1.65;color:#d8f4fb;text-align:left;
    max-width:min(330px,44vw);box-shadow:0 8px 26px rgba(6,42,51,.3);
    pointer-events:none;
  }
  #sidenote.on{display:block;}
  #sidenote b{color:#fde68a;}
  #sidenote .eq{color:#a5f3fc;font-family:"Cambria Math",Cambria,Georgia,serif;font-size:14px;}

  /* ===== 準星 ===== */
  #crosshair{
    position:fixed;z-index:15;width:34px;height:34px;left:50%;top:50%;
    transform:translate(-50%,-50%);
    pointer-events:none;opacity:0;transition:opacity .2s;
  }
  #crosshair .ring{position:absolute;inset:0;border:2px solid rgba(255,255,255,.85);border-radius:50%;box-shadow:0 0 0 1px rgba(6,42,51,.25),0 0 12px rgba(14,165,233,.6);}
  #crosshair .dot{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;background:#fff;border-radius:50%;}

  /* ===== 側面視角：光路標註 ===== */
  #labels{position:fixed;inset:0;z-index:14;pointer-events:none;display:none;}
  #labels.on{display:block;}
  .lb{
    position:absolute;left:0;top:0;transform:translate(-50%,-50%);
    font-size:12.5px;font-weight:700;color:#eafcff;white-space:nowrap;line-height:1.2;
    padding:3px 9px;border-radius:8px;letter-spacing:.4px;
    background:rgba(5,34,42,.78);border:1px solid rgba(255,255,255,.2);
    box-shadow:0 4px 14px rgba(3,20,25,.3);transition:opacity .2s;
  }
  .lb.gold{color:#ffe8a3;border-color:rgba(253,224,71,.55);}
  .lb.pale{color:#f2e8ff;border-color:rgba(216,180,254,.65);}
  .lb.red{color:#ffd9df;border-color:rgba(251,113,133,.7);}
  .lb.math{font-family:"Cambria Math",Cambria,Georgia,serif;font-size:14px;padding:2px 8px;}

  /* ===== 開場面板 ===== */
  .panel{
    position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    background:rgba(4,28,34,.5);backdrop-filter:blur(6px);padding:24px;
  }
  .panel .box{
    width:min(760px,92vw);background:linear-gradient(160deg,#0b3b47,#06323d);
    border:1px solid rgba(255,255,255,.18);border-radius:28px;
    padding:52px 52px 46px;box-shadow:0 30px 80px rgba(3,20,25,.55);color:#eafcff;
    max-height:94vh;overflow:auto;text-align:center;
  }
  .panel .box h2{font-size:clamp(30px,4.4vw,46px);font-weight:800;letter-spacing:2px;display:flex;align-items:center;justify-content:center;gap:16px;}
  .panel .box h2 .ic{width:clamp(34px,4.6vw,52px);height:auto;}
  .panel .sub{color:#9fdbea;font-size:15px;margin-top:10px;}
  .panel .rule{margin:22px 0 4px;background:rgba(255,255,255,.05);border-left:3px solid #0ea5e9;border-radius:8px;padding:16px 18px;font-size:16px;line-height:1.85;color:#e7f9fd;text-align:left;}
  .panel .rule b{color:#fdba74;}
  .panel .tips{font-size:clamp(16px,1.9vw,21px);color:#bfe6f2;line-height:1.95;margin-top:22px;}
  .panel .cta{display:flex;gap:14px;margin-top:34px;flex-wrap:wrap;}
  .btn{
    font-family:inherit;font-size:clamp(17px,1.9vw,22px);font-weight:800;border:0;cursor:pointer;
    border-radius:16px;padding:18px 32px;transition:.18s;letter-spacing:1px;
  }
  .btn.primary{background:linear-gradient(135deg,#0ea5e9,#0891b2);color:#fff;box-shadow:0 10px 28px rgba(14,165,233,.45);flex:1;min-width:220px;}
  .btn.primary:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(14,165,233,.55);}
  .btn.primary:active{transform:translateY(0) scale(.99);}
  .btn.ghost{background:rgba(255,255,255,.1);color:#e7f9fd;border:1px solid rgba(255,255,255,.2);}
  .btn.ghost:hover{background:rgba(255,255,255,.18);}

  /* ===== 反饋：左下角卡片，避免遮擋光路 ===== */
  #feedback{
    position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:flex-start;
    padding:0 16px 16px;pointer-events:none;
  }
  #feedback .box{
    width:min(400px,46vw);max-height:min(52vh,380px);overflow:auto;pointer-events:auto;
    border-radius:18px;padding:14px 18px;color:#062a33;box-shadow:0 20px 50px rgba(3,20,25,.45);
  }
  #feedback .box.win{background:linear-gradient(160deg,#d1fae5,#e7fbf0);border:1px solid #86efac;}
  #feedback .box.lose{background:linear-gradient(160deg,#fee2e2,#fff1f1);border:1px solid #fca5a5;}
  #feedback .f-title{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px;}
  #feedback .f-title .em{font-size:20px;display:flex;}
  #feedback .f-score{font-size:20px;font-weight:900;margin:4px 0 2px;}
  #feedback .f-desc{font-size:12.5px;line-height:1.65;color:#14532d;opacity:.92;}
  #feedback .box.lose .f-desc{color:#7f1d1d;}
  #feedback .f-phy{margin-top:8px;font-size:11.5px;line-height:1.6;background:rgba(255,255,255,.55);border-left:3px solid #0ea5e9;border-radius:6px;padding:8px 10px;color:#0c4452;}
  #feedback .f-phy .eq{font-family:"Cambria Math",Cambria,Georgia,serif;font-size:12px;font-weight:700;color:#0369a1;}
  #feedback .f-cta{display:flex;gap:8px;margin-top:12px;}
  #feedback .btn{flex:1;padding:9px 12px;font-size:13.5px;}
  #feedback .btn.ghost{background:rgba(6,42,51,.07);color:#0c4452;border:1px solid rgba(6,42,51,.22);}
  #feedback .btn.ghost:hover{background:rgba(6,42,51,.14);}

  #mute{position:fixed;right:16px;top:64px;z-index:20;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:var(--card);color:#d8f4fb;cursor:pointer;font-size:16px;backdrop-filter:blur(8px);}

  /* ===== 平板 / 觸屏（學生用平板玩）：放大可點區域與字號 ===== */
  @media (pointer:coarse){
    .viewbtn{padding:12px 16px;font-size:15px;gap:8px;}
    .viewbtn svg{width:18px;height:18px;}
    #hint{font-size:15px;padding:13px 20px;}
    .lb{font-size:13.5px;padding:4px 10px;}
    #sidenote{font-size:13px;max-width:min(360px,46vw);}
    #feedback .box{width:min(460px,52vw);padding:16px 20px;}
    #feedback .f-title{font-size:20px;}
    #feedback .f-score{font-size:22px;}
    #feedback .f-desc{font-size:14px;}
    #feedback .f-phy{font-size:13px;}
    #feedback .btn{padding:12px 14px;font-size:16px;}
    #mute{width:46px;height:46px;}
  }
  /* 平板橫屏/豎屏：頂欄與按鈕加大一點 */
  @media (min-width:641px) and (max-width:1280px){
    .brand h1{font-size:22px;}
    .pill{font-size:14px;padding:8px 16px;}
    #viewbar{top:58px;}
  }

  @media (max-width:640px){
    .panel{padding:14px;}
    .panel .box{padding:26px 22px 24px;border-radius:20px;}
    .panel .box h2{font-size:26px;gap:10px;}
    .panel .box h2 .ic{width:28px;}
    .panel .tips{font-size:15px;line-height:1.8;margin-top:16px;}
    .btn{font-size:17px;padding:15px 20px;border-radius:14px;}
    .panel .cta{margin-top:24px;}
    .stats{gap:8px;}
    .pill{font-size:12px;padding:6px 11px;}
    #viewbar{top:46px;left:10px;gap:3px;padding:4px;}
    .viewbtn{padding:8px 10px;font-size:12.5px;}
    #hint{font-size:13px;padding:10px 14px;bottom:14px;}
    #sidenote{bottom:10px;left:10px;font-size:11px;padding:8px 10px;max-width:52vw;}
    .lb{font-size:11px;padding:2px 6px;}
    #feedback{padding:0 10px 10px;justify-content:center;}
    #feedback .box{width:min(440px,94vw);padding:12px 14px;max-height:56vh;}
  }
  /* 橫屏手機 / 矮屏：壓縮封面，避免按鈕被擠出屏幕 */
  @media (max-height:560px){
    .panel{padding:12px;}
    .panel .box{padding:20px 26px;max-height:96vh;}
    .panel .box h2{font-size:24px;gap:10px;}
    .panel .box h2 .ic{width:26px;}
    .panel .tips{font-size:14px;line-height:1.75;margin-top:12px;}
    .panel .cta{margin-top:16px;}
    .btn{padding:12px 22px;font-size:16px;}
  }

  /* iOS 毛玻璃前綴 & 觸屏細節 */
  .pill,#viewbar,#hint,#sidenote,#mute,.panel,#feedback .box{-webkit-backdrop-filter:blur(8px);}
  body,button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<!-- 側面視角的光路標註 -->
<div id="labels"></div>

<!-- 準星 -->
<div id="crosshair"><div class="ring"></div><div class="dot"></div></div>

<!-- 頂部 -->
<div id="hud-top">
  <div class="brand">
    <a class="back-link" href="macao-class.html">← 返回</a>
    <h1>光的折射 · 叉魚挑戰</h1>
  </div>
  <div class="stats">
    <div class="pill orange">第 <b id="level">1</b> / <span id="maxlevel">6</span> 關</div>
    <div class="pill">得分 <b id="score">0</b></div>
  </div>
</div>

<!-- 視角切換 -->
<div id="viewbar">
  <button class="viewbtn active" data-view="person">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.2-4 4-6 7-6s5.8 2 7 6"/></svg>人眼視角
  </button>
  <button class="viewbtn" data-view="side">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 13h20"/><circle cx="16" cy="6.6" r="2.2"/><path d="M16 8.8V13"/><path d="M4 18c3.4 0 4.4-3 7-3"/></svg>側面視角
  </button>
</div>

<button id="mute" title="音效開關">
  <svg id="icSoundOn" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
  <svg id="icSoundOff" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M23 9l-6 6"/><path d="M17 9l6 6"/></svg>
</button>

<!-- 側面視角說明 -->
<div id="sidenote">
  <div class="eq">n<sub>水</sub>·sinθ₁ = sinθ₂　　視深 = 實深 ÷ 1.333</div>
  <div id="sdepth" style="margin-top:4px;color:#9fdbea"></div>
</div>

<!-- 底部提示 -->
<div id="hint">
  <b>點擊水面投叉</b> —— 瞄準你看到的那條魚，試試能不能叉中。
</div>

<!-- 開場 -->
<div id="intro" class="panel">
  <div class="box">
    <h2><svg class="ic" viewBox="0 0 32 32" fill="none"><circle cx="16" cy="18" r="8" fill="#f97316"/><path d="M6 15 L2 21 L6 21 Z" fill="#f97316"/><path d="M26 15 L30 21 L26 21 Z" fill="#f97316"/><path d="M16 3 L15 7 L17 7 Z" fill="#f43f5e"/></svg>折射叉魚 · 挑戰</h2>
    <div class="tips">
      點擊水面投叉，試試能不能叉中水裡的魚。<br>
      投出後會自動切到側面視角，看看真實的位置到底在哪。
    </div>
    <div class="cta">
      <button class="btn primary" id="startBtn">開始挑戰</button>
    </div>
  </div>
</div>

<!-- 反饋 -->
<div id="feedback"></div>

<script src="assets/three.min.js"></script>
<script>
// 若本地 three.js 缺失，回退到 CDN（聯網時可用）
if(typeof THREE === 'undefined'){
  document.write('<script src="https://unpkg.com/three@0.149.0/build/three.min.js"><\/script>');
}
</script>
<script>
/* =========================================================
   光的折射 · 叉魚挑戰（three.js）
   ---------------------------------------------------------
   物理模型
     · 魚在深度 d 處發光，光射到水面 O 點進入空氣
     · 斯涅爾定律：n1·sinθ1 = n2·sinθ2 ，n1 = 1.333(水)，n2 ≈ 1(空氣)
       → 由水射向空氣時 θ2 > θ1（折射角大於入射角，光線遠離法線）
     · 人眼沿折射光線的反向延長線看，看到的是更淺的“虛像”
       近垂直觀察時：視深 = 實深 ÷ 1.333
   玩法
     · 人眼視角：點擊水面投叉（魚叉沿直線運動，不會拐彎）
     · 側面視角：顯示漁民、真實魚、淺色虛像、法線、θ1/θ2 與折射光路
========================================================= */
(() => {
'use strict';
if(THREE.ColorManagement) THREE.ColorManagement.legacyMode = false;
const $ = (id) => document.getElementById(id);
const UP  = new THREE.Vector3(0, 1, 0);
const FWD = new THREE.Vector3(0, 0, 1);
const DOWN = new THREE.Vector3(0, -1, 0);

const WATER_Y   = 0;                                 // 水面高度
const N_WATER   = 1.333;                             // 水的折射率
const HIT_R     = 1.0;    // 命中判定（魚所在深度處的歸一化水平偏差，<1 表示進入魚體範圍）
const PERFECT_R = 0.5;
const MAX_LEVEL = 3;
const EYE_CAM = new THREE.Vector3(0, 1.70, 4.32);    // 人眼視角相機位置
const EYE_PT  = new THREE.Vector3(0, 1.705, 4.20);   // 眼睛（光路終點）
const SIDE_LOOK  = new THREE.Vector3(0, -0.50, 2.30);
const SIDE_FRAME = {w: 6.4, h: 5.0};

let scene, renderer, raycaster;
let cameraPerson, cameraSide, activeCamera;
let waterMesh, waterVerts = [], underwaterDecor, sideGroup, pathGroup, personGroup;
let fishReal, fishGhost, fishSeen, heldSpear;
let level = 1, score = 0;
let throwing = false, revealed = false, peeked = false;
let activeView = 'person';
let muted = false, audioCtx = null;
let lastAim = null;
const IS_TOUCH = !!(window.matchMedia && window.matchMedia('(pointer:coarse)').matches);

/* ---------------------------------------------------------
   小工具
--------------------------------------------------------- */
function makeRod(mat, seg = 12){
  return new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1, seg), mat);
}
function setRod(m, a, b, r){
  const d = new THREE.Vector3().subVectors(b, a);
  const len = d.length();
  if(len < 1e-4){ m.visible = false; return; }
  m.visible = true;
  m.position.copy(a).addScaledVector(d, 0.5);
  m.quaternion.setFromUnitVectors(UP, d.clone().normalize());
  m.scale.set(r, len, r);
}
function rodMesh(a, b, r, mat, seg = 12){
  const m = makeRod(mat, seg);
  setRod(m, a, b, r);
  return m;
}
function makeLine(n, color, opacity = 1){
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  const l = new THREE.Line(geo, new THREE.LineBasicMaterial({color, transparent: opacity < 1, opacity}));
  l.frustumCulled = false;
  return l;
}
function setLinePts(line, pts){
  const arr = line.geometry.attributes.position.array;
  for(let i = 0; i < pts.length; i++){
    arr[i*3] = pts[i].x; arr[i*3+1] = pts[i].y; arr[i*3+2] = pts[i].z;
  }
  line.geometry.setDrawRange(0, pts.length);
  line.geometry.attributes.position.needsUpdate = true;
  line.geometry.computeBoundingSphere();
}
function makeDashed(n, color, dashSize = .16, gapSize = .12, opacity = 1){
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  const l = new THREE.Line(geo, new THREE.LineDashedMaterial({color, dashSize, gapSize, transparent:true, opacity}));
  l.frustumCulled = false;
  return l;
}
function setDashed(line, pts){
  setLinePts(line, pts);
  line.computeLineDistances();
}
function setCone(m, pos, dir, r, h){
  m.position.copy(pos);
  m.quaternion.setFromUnitVectors(UP, dir.clone().normalize());
  m.scale.set(r, h, r);
}
function gradientTex(c1, c2){
  const c = document.createElement('canvas');
  c.width = 4; c.height = 128;
  const ctx = c.getContext('2d');
  const grd = ctx.createLinearGradient(0, 0, 0, 128);
  grd.addColorStop(0, c1);
  grd.addColorStop(1, c2);
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, 4, 128);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  return t;
}

/* ---------------------------------------------------------
   魚：流線型魚體（頂點漸變）+ 三組魚鰭 + 眼睛 + 鰓蓋
--------------------------------------------------------- */
let fishBodyGeo = null, tailGeo = null, dorsalGeo = null, analGeo = null, pecGeo = null;

function shapeGeo(pts){
  const s = new THREE.Shape();
  s.moveTo(pts[0][0], pts[0][1]);
  for(let i = 1; i < pts.length; i++) s.lineTo(pts[i][0], pts[i][1]);
  s.closePath();
  return new THREE.ShapeGeometry(s, 14);
}

function weldNormals(geo){
  const pos = geo.attributes.position, nor = geo.attributes.normal;
  const map = new Map();
  const key = (i) => Math.round(pos.getX(i)*1e4) + '_' + Math.round(pos.getY(i)*1e4) + '_' + Math.round(pos.getZ(i)*1e4);
  for(let i = 0; i < pos.count; i++){
    const k = key(i);
    let rec = map.get(k);
    if(!rec){ rec = {n: new THREE.Vector3(), idx: []}; map.set(k, rec); }
    rec.n.add(new THREE.Vector3().fromBufferAttribute(nor, i));
    rec.idx.push(i);
  }
  map.forEach(rec => {
    if(rec.idx.length > 1){
      rec.n.normalize();
      rec.idx.forEach(i => nor.setXYZ(i, rec.n.x, rec.n.y, rec.n.z));
    }
  });
  nor.needsUpdate = true;
}

function buildFishBodyGeo(){
  const geo = new THREE.SphereGeometry(1, 48, 26);
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  const cBack  = new THREE.Color(0xb4400c);
  const cMid   = new THREE.Color(0xf97316);
  const cBelly = new THREE.Color(0xfff0d8);
  const colors = new Float32Array(pos.count * 3);
  for(let i = 0; i < pos.count; i++){
    v.fromBufferAttribute(pos, i);
    const s = THREE.MathUtils.clamp(v.x, -1, 1);
    const r = Math.hypot(v.y, v.z);
    // 魚體輪廓：中部肥厚、頭端略鈍、尾柄收細
    const prof = Math.pow(Math.max(0, 1 - s*s), 0.42) * (1 + 0.09*s);
    let y = 0, z = 0;
    if(r > 1e-5){
      y = v.y / r * prof * 0.46;
      z = v.z / r * prof * 0.27;
    }
    pos.setXYZ(i, s * (s < 0 ? 1.01 : 0.97) * 0.95, y, z);
    const t = THREE.MathUtils.clamp((y + 0.46) / 0.92, 0, 1);
    const c = t > 0.5
      ? cMid.clone().lerp(cBack, (t - 0.5) * 2)
      : cBelly.clone().lerp(cMid, t * 2);
    colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  weldNormals(geo);
  return geo;
}

function buildFish(ghost){
  if(!fishBodyGeo){
    fishBodyGeo = buildFishBodyGeo();
    tailGeo   = shapeGeo([[0,0],[-0.30,0.38],[-0.17,0.02],[-0.30,-0.38],[-0.02,-0.06]]);
    dorsalGeo = shapeGeo([[-0.46,0],[-0.26,0.26],[0.02,0.22],[0.16,-0.02]]);
    analGeo   = shapeGeo([[-0.34,0],[-0.14,-0.22],[0.10,-0.02]]);
    pecGeo    = shapeGeo([[0,0],[-0.18,0.12],[-0.24,-0.02],[-0.10,-0.08]]);
  }
  const g = new THREE.Group();

  const bodyMat = ghost
    ? new THREE.MeshStandardMaterial({
        color:0xe4f6ff, transparent:true, opacity:0.42, roughness:.35, metalness:.1,
        emissive:0x8fdcff, emissiveIntensity:.55, depthWrite:false, depthTest:false
      })
    : new THREE.MeshStandardMaterial({vertexColors:true, roughness:.52, metalness:.06});
  const finMat = ghost
    ? new THREE.MeshStandardMaterial({
        color:0xeaf9ff, transparent:true, opacity:0.18, side:THREE.DoubleSide,
        emissive:0x9be3f7, emissiveIntensity:.5, depthWrite:false, depthTest:false
      })
    : new THREE.MeshStandardMaterial({
        color:0xfb923c, transparent:true, opacity:0.92, side:THREE.DoubleSide,
        roughness:.55, metalness:.05
      });

  const body = new THREE.Mesh(fishBodyGeo, bodyMat);
  body.castShadow = !ghost;
  g.add(body);

  const tail = new THREE.Mesh(tailGeo, finMat);
  tail.position.set(-0.86, 0, 0);
  g.add(tail);

  const dorsal = new THREE.Mesh(dorsalGeo, finMat);
  dorsal.position.set(-0.02, 0.36, 0);
  g.add(dorsal);

  const anal = new THREE.Mesh(analGeo, finMat);
  anal.position.set(-0.10, -0.34, 0);
  g.add(anal);

  const pecL = new THREE.Mesh(pecGeo, finMat);
  pecL.position.set(0.20, -0.10, 0.15);
  pecL.rotation.set(-Math.PI/2, 0, -0.45);
  g.add(pecL);
  const pecR = new THREE.Mesh(pecGeo, finMat);
  pecR.position.set(0.20, -0.10, -0.15);
  pecR.rotation.set(-Math.PI/2, 0, 0.45);
  g.add(pecR);

  const eyeWhiteMat = ghost
    ? new THREE.MeshStandardMaterial({color:0xffffff, emissive:0x9be8ff, emissiveIntensity:.35, transparent:true, opacity:.45, depthTest:false})
    : new THREE.MeshStandardMaterial({color:0xf8fdff, roughness:.25});
  const pupilMat = ghost
    ? new THREE.MeshStandardMaterial({color:0x3d7f96, transparent:true, opacity:.35, depthTest:false})
    : new THREE.MeshStandardMaterial({color:0x101820, roughness:.2});
  [-1, 1].forEach(sgn => {
    const w = new THREE.Mesh(new THREE.SphereGeometry(0.085, 14, 12), eyeWhiteMat);
    w.position.set(0.60, 0.07, sgn * 0.155);
    g.add(w);
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.048, 12, 10), pupilMat);
    p.position.set(0.655, 0.075, sgn * 0.185);
    g.add(p);
  });

  if(!ghost){
    const gill = new THREE.Mesh(
      new THREE.TorusGeometry(0.20, 0.012, 6, 18, Math.PI * 1.15),
      new THREE.MeshStandardMaterial({color:0x8c3a10, roughness:.6, transparent:true, opacity:.6})
    );
    gill.position.set(0.36, 0.02, 0);
    gill.rotation.set(0, Math.PI/2, -0.35);
    gill.scale.set(1, 0.72, 1);
    g.add(gill);
  } else {
    // 虛像：始終可見（不被真實魚遮擋），疊在真實魚之上
    g.traverse(o => { o.renderOrder = 6; });
  }
  return g;
}

/* ---------------------------------------------------------
   魚叉（三股鋼叉）
--------------------------------------------------------- */
const matSteel  = new THREE.MeshStandardMaterial({color:0xd5dee9, roughness:.38, metalness:.35});
const matWood   = new THREE.MeshStandardMaterial({color:0xa9743f, roughness:.72, metalness:.05});
const matRope   = new THREE.MeshStandardMaterial({color:0x7a5330, roughness:.95});
const matGlove  = new THREE.MeshStandardMaterial({color:0x22303c, roughness:.9});
const matSleeve = new THREE.MeshStandardMaterial({color:0x1f6f7c, roughness:.9});
const matSkin   = new THREE.MeshStandardMaterial({color:0xe8b48d, roughness:.72});

/* 沿 +Z 方向，原點在叉柄末端 */
function buildTrident(len = 1.95){
  const g = new THREE.Group();
  const shaftLen = Math.max(0.55, len - 0.52);

  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.031, shaftLen, 12), matWood);
  shaft.rotation.x = Math.PI/2;          // 圓柱默認沿 +Y，轉到 +Z
  shaft.position.z = shaftLen/2;
  shaft.castShadow = true;
  g.add(shaft);

  const headZ = shaftLen;
  const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.038, 0.031, 0.13, 12), matSteel);
  collar.rotation.x = Math.PI/2;
  collar.position.z = headZ + 0.03;
  g.add(collar);

  const wrap = new THREE.Mesh(new THREE.TorusGeometry(0.041, 0.012, 8, 18), matRope);
  wrap.position.z = headZ - 0.04;
  g.add(wrap);

  const tipZ = len;
  [-0.062, 0, 0.062].forEach(off => {
    g.add(rodMesh(
      new THREE.Vector3(off * 0.25, 0, headZ + 0.07),
      new THREE.Vector3(off, 0, tipZ - 0.26),
      0.014, matSteel, 8
    ));
    const cone = new THREE.Mesh(new THREE.ConeGeometry(0.024, 0.28, 10), matSteel);
    cone.quaternion.setFromUnitVectors(UP, FWD);
    cone.position.set(off * 1.04, 0, tipZ - 0.14);
    g.add(cone);
  });
  return g;
}

/* 第一人稱：握叉的手 */
function buildHandGrip(zGrip){
  const g = new THREE.Group();
  const palm = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 12), matGlove);
  palm.scale.set(1.0, 1.15, 1.25);
  palm.position.set(0.004, -0.008, zGrip);
  g.add(palm);

  for(let i = 0; i < 4; i++){
    const f = new THREE.Mesh(new THREE.CapsuleGeometry(0.017, 0.07, 3, 8), matGlove);
    f.rotation.set(0, 0, Math.PI/2);            // 手指橫跨叉柄
    f.position.set(0.045, 0.032 - i * 0.011, zGrip - 0.062 + i * 0.043);
    g.add(f);
  }
  const thumb = new THREE.Mesh(new THREE.CapsuleGeometry(0.017, 0.055, 3, 8), matGlove);
  thumb.rotation.set(1.1, 0, 0.35);
  thumb.position.set(-0.048, 0.02, zGrip + 0.05);
  g.add(thumb);
  return g;
}

/* ---------------------------------------------------------
   漁民（側面視角）
--------------------------------------------------------- */
function buildPerson(){
  const g = new THREE.Group();
  const shirt = new THREE.MeshStandardMaterial({color:0x3aa8b5, roughness:.88});
  const vestM = new THREE.MeshStandardMaterial({color:0xd99a45, roughness:.9});
  const pants = new THREE.MeshStandardMaterial({color:0x4a5f74, roughness:.92});
  const boot  = new THREE.MeshStandardMaterial({color:0x333f4a, roughness:.95});
  const hairM = new THREE.MeshStandardMaterial({color:0x241c17, roughness:.95});
  const P = (x, y, z) => new THREE.Vector3(x, y, z);
  const add = (m) => { m.castShadow = true; m.receiveShadow = true; g.add(m); return m; };

  // 靴子
  [1, -1].forEach(s => {
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.11, 0.30), boot);
    b.position.set(s * 0.105, 0.055, -0.04);
    add(b);
    const t = new THREE.Mesh(new THREE.SphereGeometry(0.085, 14, 10), boot);
    t.scale.set(0.95, 0.7, 1.15);
    t.position.set(s * 0.105, 0.06, -0.15);
    add(t);
  });

  // 腿
  add(rodMesh(P(0.118, 0.10, 0.0), P(0.112, 0.86, 0.02), 0.074, pants));
  add(rodMesh(P(-0.118, 0.10, 0.0), P(-0.112, 0.86, 0.02), 0.074, pants));
  const hip = new THREE.Mesh(new THREE.SphereGeometry(0.19, 18, 14), pants);
  hip.scale.set(1, 0.72, 0.68);
  hip.position.set(0, 0.88, 0.01);
  add(hip);

  // 軀幹
  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.175, 0.36, 6, 16), shirt);
  torso.scale.set(1, 1, 0.72);
  torso.position.set(0, 1.22, 0.01);
  add(torso);

  const vest = new THREE.Mesh(new THREE.CapsuleGeometry(0.185, 0.18, 6, 16), vestM);
  vest.scale.set(1, 1, 0.70);
  vest.position.set(0, 1.28, 0.01);
  add(vest);

  const shoulder = new THREE.Mesh(new THREE.SphereGeometry(0.20, 18, 12), shirt);
  shoulder.scale.set(1.02, 0.60, 0.70);
  shoulder.position.set(0, 1.50, 0.01);
  add(shoulder);

  // 脖子 + 頭
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.058, 0.072, 0.12, 12), matSkin);
  neck.position.set(0, 1.585, 0.01);
  add(neck);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.158, 24, 18), matSkin);
  head.scale.set(0.95, 1.02, 0.99);
  head.position.set(0, 1.715, 0.01);
  add(head);

  const hair = new THREE.Mesh(
    new THREE.SphereGeometry(0.164, 22, 14, 0, Math.PI*2, 0, Math.PI*0.50), hairM
  );
  hair.rotation.x = -0.34;
  hair.position.set(0, 1.722, 0.028);
  add(hair);

  // 五官（面朝 -z）
  [1, -1].forEach(s => {
    const white = new THREE.Mesh(new THREE.SphereGeometry(0.031, 12, 10),
      new THREE.MeshStandardMaterial({color:0xfbfeff, roughness:.3}));
    white.position.set(s * 0.058, 1.716, -0.134);
    g.add(white);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.017, 10, 8),
      new THREE.MeshStandardMaterial({color:0x121a20, roughness:.25}));
    pupil.position.set(s * 0.058, 1.716, -0.158);
    g.add(pupil);
    const brow = new THREE.Mesh(new THREE.BoxGeometry(0.052, 0.013, 0.02), hairM);
    brow.position.set(s * 0.058, 1.762, -0.132);
    brow.rotation.z = s * 0.08;
    g.add(brow);
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 8), matSkin);
    ear.scale.set(0.55, 1.05, 0.8);
    ear.position.set(s * 0.152, 1.700, 0.02);
    g.add(ear);
  });
  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.028, 0.07, 10), matSkin);
  nose.quaternion.setFromUnitVectors(UP, new THREE.Vector3(0, 0, -1));
  nose.position.set(0, 1.692, -0.168);
  g.add(nose);
  const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.012, 0.012),
    new THREE.MeshStandardMaterial({color:0x8f4a44, roughness:.6}));
  mouth.position.set(0, 1.638, -0.150);
  g.add(mouth);

  // 魚叉：叉柄在上後方，叉尖斜指水面
  const butt = P(0.00, 1.58, 0.58);
  const tip  = P(0.12, 0.42, -1.05);
  const H1 = P(0.062, 1.05, -0.20);   // 右手
  const H2 = P(0.050, 0.95, -0.30);   // 左手

  add(rodMesh(P(0.185, 1.49, 0.01), P(0.27, 1.22, 0.08), 0.060, shirt));
  add(rodMesh(P(0.27, 1.22, 0.08), H1, 0.05, matSkin));
  add(rodMesh(P(-0.185, 1.49, 0.01), P(-0.26, 1.20, 0.02), 0.060, shirt));
  add(rodMesh(P(-0.26, 1.20, 0.02), H2, 0.05, matSkin));
  [H1, H2].forEach(p => {
    const h = new THREE.Mesh(new THREE.SphereGeometry(0.056, 12, 10), matSkin);
    h.scale.set(1, 1.1, 1.1);
    h.position.copy(p);
    add(h);
  });

  const spear = buildTrident(butt.distanceTo(tip));
  spear.position.copy(butt);
  spear.quaternion.setFromUnitVectors(FWD, tip.clone().sub(butt).normalize());
  g.add(spear);

  g.position.set(0, 0, 4.32);
  return g;
}

/* ---------------------------------------------------------
   角色裝配
--------------------------------------------------------- */
function buildActors(){
  fishReal = buildFish(false);
  fishReal.visible = false;
  scene.add(fishReal);

  fishGhost = buildFish(true);      // 側面視角：淺色虛像

/* ---------------------------------------------------------
   折射計算：魚 F → 折射點 O → 人眼 E，虛像 V
--------------------------------------------------------- */
const refr = {
  F: new THREE.Vector3(), O: new THREE.Vector3(), V: new THREE.Vector3(),
  dirW: new THREE.Vector3(), dirA: new THREE.Vector3(),
  perp1: new THREE.Vector3(), perp2: new THREE.Vector3(),
  mid1: new THREE.Vector3(), mid2: new THREE.Vector3(),
  th1: 0, th2: 0, depth: 0, apparent: 0
};

function solveRefraction(){
  const F = fishReal.position;
  const E = EYE_PT;
  const d = Math.abs(F.y);                  // 實深
  const h = Math.max(0.4, E.y - WATER_Y);   // 眼睛離水面高度
  const dx = E.x - F.x, dz = E.z - F.z;
  const D = Math.hypot(dx, dz);             // 魚到眼睛的水平距離

  // 斯涅爾定律：n·sinθ1 = sinθ2，二分法求水面折射點位置
  const g = (s) => N_WATER * Math.sin(Math.atan2(s, d)) - Math.sin(Math.atan2(Math.max(0, D - s), h));
  let lo = 0, hi = Math.max(D, 1e-4);
  for(let i = 0; i < 60; i++){
    const mid = (lo + hi) / 2;
    if(g(mid) < 0) lo = mid; else hi = mid;
  }
  const s = (lo + hi) / 2;
  const th1 = Math.atan2(s, d);                 // 入射角（水中，與法線夾角）
  const th2 = Math.atan2(Math.max(0, D - s), h); // 折射角（空氣，與法線夾角）

  const ux = D > 1e-5 ? dx / D : 0;
  const uz = D > 1e-5 ? dz / D : 1;
  const O = new THREE.Vector3(F.x + ux * s, WATER_Y, F.z + uz * s);

  // 視線方向：O → E。虛像在它的反向延長線上，位於視深 d/n 處
  const toE = new THREE.Vector3().subVectors(E, O).normalize();
  const sv = (d / N_WATER) / Math.max(1e-4, toE.y);
  const V = O.clone().addScaledVector(toE, -sv);

  refr.F.copy(F); refr.O.copy(O); refr.V.copy(V);
  refr.depth = d;
  refr.apparent = d / N_WATER;
  refr.th1 = th1; refr.th2 = th2;
  refr.dirW.copy(F).sub(O).normalize();       // O → F（水中光線）
  refr.dirA.copy(E).sub(O).normalize();       // O → E（空氣中光線）

  // 兩條光線的單位方向在法線垂直方向上的分量（用於畫角弧和標註）
  refr.perp1.copy(refr.dirW).addScaledVector(DOWN, refr.dirW.y).normalize();
  refr.perp2.copy(refr.dirA).addScaledVector(UP, -refr.dirA.y).normalize();
  refr.mid1.copy(O).addScaledVector(DOWN, Math.cos(th1/2) * 1.25)
                  .addScaledVector(refr.perp1, Math.sin(th1/2) * 1.25);
  refr.mid2.copy(O).addScaledVector(UP, Math.cos(th2/2) * 1.30)
                  .addScaledVector(refr.perp2, Math.sin(th2/2) * 1.30);
  return refr;
}

/* ---------------------------------------------------------
   光路圖元素
--------------------------------------------------------- */
let pRayW, pRayA, pArrW, pArrA, pNormal, pVirt, pDepthR;
let pArc1, pArc2, pDotO, pAimTip;

function buildPathGroup(){
  pathGroup = new THREE.Group();
  pathGroup.visible = false;
  scene.add(pathGroup);

  const mGold  = new THREE.MeshBasicMaterial({color:0xffd25e, transparent:true, opacity:1});
  const mGold2 = new THREE.MeshBasicMaterial({color:0xfff3b4, transparent:true, opacity:1});

  pRayW = makeRod(mGold);  pathGroup.add(pRayW);
  pRayA = makeRod(mGold2); pathGroup.add(pRayA);
  pArrW = new THREE.Mesh(new THREE.ConeGeometry(1, 1, 12), mGold);  pathGroup.add(pArrW);
  pArrA = new THREE.Mesh(new THREE.ConeGeometry(1, 1, 12), mGold2); pathGroup.add(pArrA);
  [pRayW, pRayA, pArrW, pArrA].forEach(o => { o.renderOrder = 8; });

  pNormal = makeDashed(2, 0xffffff, .16, .13, .6);   pathGroup.add(pNormal);
  pVirt   = makeDashed(2, 0xf0c4ff, .18, .12, .95);  pathGroup.add(pVirt);
  pDepthR = makeDashed(2, 0xffd25e, .11, .10, .45);  pathGroup.add(pDepthR);

  pArc1 = makeLine(26, 0xffd25e, .95);  pathGroup.add(pArc1);
  pArc2 = makeLine(26, 0xfff3b4, .95);  pathGroup.add(pArc2);

  pDotO = new THREE.Mesh(new THREE.SphereGeometry(0.085, 16, 12),
    new THREE.MeshBasicMaterial({color:0xffffff}));
  pathGroup.add(pDotO);

  pAimTip = new THREE.Mesh(new THREE.ConeGeometry(1, 1, 12),
    new THREE.MeshBasicMaterial({color:0xfb7185}));
  pathGroup.add(pAimTip);
}

const arcBuf = [];
for(let i = 0; i < 26; i++) arcBuf.push(new THREE.Vector3());

/* 從 from 方向轉到 to 方向的角弧（真實夾角） */
function arcPoints(O, from, to, R){
  const cosT = THREE.MathUtils.clamp(from.dot(to), -1, 1);
  const a0 = Math.acos(cosT);
  const perp = to.clone().addScaledVector(from, -cosT).normalize();
  const n = arcBuf.length;
  for(let i = 0; i < n; i++){
    const a = a0 * i / (n - 1);
    arcBuf[i].copy(O).addScaledVector(from, Math.cos(a) * R).addScaledVector(perp, Math.sin(a) * R);
  }
  return {pts: arcBuf, a0};
}

function updatePath(){
  const {F, O, V, dirW, dirA, th1, th2} = refr;
  const E = EYE_PT;

  setRod(pRayW, F, O, 0.036);
  setRod(pRayA, O, E, 0.036);

  // 光線方向：魚 → O → 眼睛（箭頭都朝著人）
  const toO = new THREE.Vector3().subVectors(O, F).normalize();
  setCone(pArrW, F.clone().lerp(O, 0.52), toO, 0.085, 0.26);
  setCone(pArrA, O.clone().lerp(E, 0.58), dirA, 0.085, 0.26);

  setDashed(pNormal, [new THREE.Vector3(O.x, -1.6, O.z), new THREE.Vector3(O.x, 1.55, O.z)]);
  setDashed(pVirt, [O.clone(), V.clone()]);
  setDashed(pDepthR, [F.clone(), new THREE.Vector3(F.x, WATER_Y, F.z)]);

  pDotO.position.copy(O);

  setLinePts(pArc1, arcPoints(O, DOWN, dirW, 0.90).pts);
  setLinePts(pArc2, arcPoints(O, UP, dirA, 0.95).pts);
}

function updateAim(){
  if(!lastAim){ pAimTip.visible = false; return; }
  const E = EYE_CAM, d = lastAim.dir;
  if(d.y > -0.08){ pAimTip.visible = false; return; }
  const tF = (refr.F.y - E.y) / d.y;
  const tip = E.clone().addScaledVector(d, tF);
  setCone(pAimTip, tip.clone().addScaledVector(d, -0.15), d, 0.08, 0.30);
  pAimTip.visible = true;
}
function clearAim(){
  lastAim = null;
  if(pAimTip) pAimTip.visible = false;
}

/* ---------------------------------------------------------
   側面視角相機（正交）
--------------------------------------------------------- */
function layoutSideCamera(){
  const aspect = window.innerWidth / window.innerHeight;
  let hw = SIDE_FRAME.w / 2, hh = SIDE_FRAME.h / 2;
  if(hw / hh > aspect) hh = hw / aspect; else hw = hh * aspect;
  cameraSide.left = -hw; cameraSide.right = hw;
  cameraSide.top = hh; cameraSide.bottom = -hh;
  cameraSide.updateProjectionMatrix();
  cameraSide.position.set(60, SIDE_LOOK.y, SIDE_LOOK.z);
  cameraSide.lookAt(SIDE_LOOK);
  cameraSide.updateMatrixWorld(true);
}

   光路標註（HTML 疊加層）
--------------------------------------------------------- */
const labelEls = {};
function initLabels(){
  const wrap = $('labels');
  const defs = [
    {k:'eye',   t:'人眼 E',                  c:'lb'},
    {k:'real',  t:'真實魚（實際位置）',        c:'lb gold'},
    {k:'virt',  t:'虛像（眼睛看到的位置）',    c:'lb pale'},
    {k:'O',     t:'折射點 O',                c:'lb'},
    {k:'N',     t:'法線',                    c:'lb'},
    {k:'th1',   t:'入射角 θ₁',               c:'lb gold'},
    {k:'th2',   t:'折射角 θ₂',               c:'lb'},
    {k:'shift', t:'虛像更淺',                 c:'lb pale'},
    {k:'aim',   t:'你的叉落點',               c:'lb red'}
  ];
  defs.forEach(d => {
    const el = document.createElement('div');
    el.className = d.c;
    el.textContent = d.t;
    el.style.opacity = '0';
    wrap.appendChild(el);
    labelEls[d.k] = el;
  });
}

const _pv = new THREE.Vector3();
function placeLabel(k, pos, dx = 0, dy = 0){
  const el = labelEls[k];
  if(!el) return;
  if(!el._w) { el._w = el.offsetWidth || 70; el._h = el.offsetHeight || 26; }
  _pv.copy(pos).project(cameraSide);
  const x = (_pv.x * 0.5 + 0.5) * window.innerWidth + dx;
  const y = (-_pv.y * 0.5 + 0.5) * window.innerHeight + dy;
  const hw = el._w / 2 + 6, hh = el._h / 2 + 4;
  el.style.left = Math.max(hw, Math.min(window.innerWidth - hw, x)) + 'px';
  el.style.top  = Math.max(hh, Math.min(window.innerHeight - hh, y)) + 'px';
  el.style.opacity = '1';
}
function hideLabels(){
  Object.keys(labelEls).forEach(k => { labelEls[k].style.opacity = '0'; });
}
function updateLabels(){
  const {F, O, V} = refr;
  placeLabel('eye', EYE_PT, 64, 20);
  placeLabel('real', F, 0, 76);
  placeLabel('virt', V, -4, -84);
  placeLabel('O', O, 14, -26);
  placeLabel('N', new THREE.Vector3(O.x, 1.42, O.z), 30, -12);
  placeLabel('th1', refr.mid1, 86, 12);
  placeLabel('th2', refr.mid2, 58, 34);
  const dv = Math.max(0, refr.depth - refr.apparent);
  const shiftTxt = '虛像更淺 ' + dv.toFixed(2) + ' m';
  if(labelEls.shift.textContent !== shiftTxt){
    labelEls.shift.textContent = shiftTxt;
    labelEls.shift._w = 0;                     // 文本變化後重新測量寬度
  }
  placeLabel('shift', new THREE.Vector3(V.x, (V.y + F.y) / 2, (V.z + F.z) / 2), 152, 6);
  if(lastAim && pAimTip.visible){
    const E = EYE_CAM, d = lastAim.dir;
    const tF = (refr.F.y - E.y) / d.y;
    placeLabel('aim', E.clone().addScaledVector(d, tF), 6, 44);
  } else {
    labelEls.aim.style.opacity = '0';
  }
}

/* ---------------------------------------------------------
   關卡
--------------------------------------------------------- */
function spawnLevel(){
  clearAim();
  if(!fishReal) return;
  // 每關魚的位置都不同：深度、離岸距離、左右位置、朝向都隨機
  // 同時保證“真實魚”在人眼視角畫面裡不貼邊（否則往下投的落點會跑出屏幕）
  const depth = 1.35 + level * 0.2 + Math.random() * 0.28;
  const zHi = Math.max(0.45, Math.min(1.9, 4.2 - (1.7 + depth) / 1.19));  // 視角不超過 ~50°
  const z = 0.4 + Math.random() * (zHi - 0.4);
  const x = (Math.random() * 3.0 - 1.5);
  const yaw = 0.55 + Math.random() * 0.8;

  fishReal.position.set(x, -depth, z);
  fishReal.userData = {
    t: Math.random() * 6, phase: Math.random() * 6.28,
    homeX: x, homeZ: z, depth, yaw
  };
  fishReal.rotation.y = yaw;

  syncFish();
  $('level').textContent = level;
  $('maxlevel').textContent = MAX_LEVEL;
  $('sdepth').textContent = '本關實深 h = ' + depth.toFixed(2) + ' m → 視深 ≈ ' + (depth / N_WATER).toFixed(2) + ' m';
}

function syncFish(){
  if(!fishReal) return;
  solveRefraction();
  fishSeen.position.copy(refr.V);
  fishGhost.position.copy(refr.V);
  fishGhost.rotation.y = fishReal.rotation.y;
  fishSeen.rotation.y = fishReal.rotation.y;
}

/* ---------------------------------------------------------
   視角切換
--------------------------------------------------------- */
function setView(v, opts){
  opts = opts || {};
  const side = (v === 'side');
  if(side && !revealed && !opts.noPeek) peeked = true;

  activeView = v;
  activeCamera = side ? cameraSide : cameraPerson;

  document.querySelectorAll('.viewbtn').forEach(b => {
    b.classList.toggle('active', b.dataset.view === v);
  });

  // 側面視角是示意圖：關掉霧，避免遠處背景板被霧遮擋
  scene.fog.near = side ? 400 : 14;
  scene.fog.far  = side ? 900 : 60;

  if(waterMesh) waterMesh.visible = !side;
  if(underwaterDecor) underwaterDecor.visible = !side;
  if(sideGroup) sideGroup.visible = side;
  if(pathGroup) pathGroup.visible = side;
  if(personGroup) personGroup.visible = side;
  if(fishReal) fishReal.visible = side;
  if(fishGhost) fishGhost.visible = side;
  if(fishSeen) fishSeen.visible = !side;
  if(heldSpear) heldSpear.visible = !side && !revealed;

  $('labels').classList.toggle('on', side);
  $('sidenote').classList.toggle('on', side);
  const brand = document.querySelector('.brand');
  if(brand) brand.style.opacity = side ? '0' : '1';
  $('crosshair').style.opacity = (!side && !revealed && !IS_TOUCH) ? '1' : '0';
  $('hint').style.opacity = (!side && !revealed) ? '1' : '0';

  if(side){
    layoutSideCamera();
    updatePath();
    updateAim();
    updateLabels();
  } else {
    hideLabels();
  }
}

/* ---------------------------------------------------------
   投叉
--------------------------------------------------------- */
function animThrust(){
  const base = heldSpear.position.clone();
  const dir = FWD.clone().applyQuaternion(heldSpear.quaternion).normalize();
  const t0 = performance.now();
  const dur = 300;
  const step = (now) => {
    const p = Math.min((now - t0) / dur, 1);
    const k = Math.sin(Math.PI * Math.min(p * 1.15, 1));
    heldSpear.position.copy(base).addScaledVector(dir, 0.75 * k);
    if(p < 1) requestAnimationFrame(step);
    else { heldSpear.position.copy(base); heldSpear.visible = false; }
  };
  requestAnimationFrame(step);
}

function throwSpear(nx, ny){
  if(activeView !== 'person'){ toast('請切回人眼視角再投叉'); return; }
  if(throwing || revealed || !fishReal) return;

  throwing = true; revealed = true;
  $('crosshair').style.opacity = '0';

  raycaster.setFromCamera(new THREE.Vector2(nx, ny), cameraPerson);
  const dir = raycaster.ray.direction.clone().normalize();
  if(dir.y > -0.08){ throwing = false; revealed = false; toast('請往水面方向投叉'); return; }

  // 判定：魚叉到達魚所在深度時的位置是否落在魚體範圍內
  const tF = (fishReal.position.y - cameraPerson.position.y) / dir.y;
  const hit = cameraPerson.position.clone().addScaledVector(dir, tF);
  const dx = (hit.x - fishReal.position.x) / 0.52;
  const dz = (hit.z - fishReal.position.z) / 0.74;
  const miss = Math.hypot(dx, dz);
  lastAim = {dir};

  updateHeldSpear(nx, ny);
  animThrust();
  playSfx('throw');

  setTimeout(() => {
    throwing = false;
    setView('side');
    resolveHit(miss);
  }, 330);
}

/* ---------------------------------------------------------
   判定與反饋
--------------------------------------------------------- */
function resolveHit(miss){
  let res;
  if(miss < PERFECT_R)     res = {ok:true,  perfect:true,  label:'完美命中！'};
  else if(miss < HIT_R)    res = {ok:true,  perfect:false, label:'叉中了！'};
  else                     res = {ok:false, perfect:false, label:'落空了…'};

  const depth = refr.depth;
  let pts = 0;
  if(res.ok){
    pts = 100 + Math.round(depth * 18) + (res.perfect ? 50 : 0);
    if(peeked) pts = Math.round(pts / 2);
    score += pts;
  }
  $('score').textContent = score;
  playSfx(res.ok ? (res.perfect ? 'perfect' : 'hit') : 'miss');

  const win = res.ok;
  const fb = $('feedback');
  const emWin = '<svg width="26" height="26" viewBox="0 0 32 32" fill="none"><circle cx="16" cy="18" r="8" fill="#16a34a"/><path d="M6 15 L2 21 L6 21 Z" fill="#16a34a"/><path d="M26 15 L30 21 L26 21 Z" fill="#16a34a"/><path d="M16 3 L15 7 L17 7 Z" fill="#065f46"/></svg>';
  const emLose = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14"/><path d="M19 5l-7 8"/></svg>';

  const scoreHtml = win ? '+' + pts + ' 分' : '0 分';
  const descHtml = win
    ? (peeked
        ? '你識破了折射！不過本關提前看了側面視角，分數減半。真實魚比虛像更深，叉要往虛像<b>下方</b>投。'
        : '你識破了折射！眼睛看到的是偏淺的虛像，你往“看到的魚”下方投，正好叉中真實位置的魚。')
    : (peeked
        ? '還是偏了。魚叉沿直線走，粉色箭頭就是落點——虛像在真實魚<b>上方</b>（更淺），所以要再往下一點。'
        : '你被折射“騙”了——朝看到的魚投叉，正好落在它的上方。真實魚在更深處，要往下叉。');

  fb.className = '';
  fb.innerHTML = `
    <div class="box ${win?'win':'lose'}">
      <div class="f-title"><span class="em">${win?emWin:emLose}</span>${res.label}</div>
      <div class="f-score">${scoreHtml}${peeked?' <span style="font-size:12px;font-weight:600;opacity:.65">（提前看了側面視角，減半）</span>':''}</div>
      <div class="f-desc">${descHtml}</div>
      <div class="f-cta">
        <button class="btn primary" id="nextBtn">${level>=MAX_LEVEL?'查看結果':'下一關'}</button>
        <button class="btn ghost" id="againBtn">重投本關</button>
      </div>
    </div>`;
  fb.style.display = 'flex';
  $('hint').style.opacity = '0';
  $('sidenote').classList.remove('on');

  $('nextBtn').onclick = () => {
    fb.style.display = 'none';
    if(level >= MAX_LEVEL){ finish(); return; }
    level++; revealed = false; peeked = false;
    setView('person', {noPeek:true});
    spawnLevel();
  };
  $('againBtn').onclick = () => {
    fb.style.display = 'none';
    revealed = false; peeked = false;
    clearAim();
    setView('person', {noPeek:true});
    spawnLevel();
  };
}

/* ---------------------------------------------------------
   結算
--------------------------------------------------------- */
function finish(){
  revealed = false; peeked = false;
  const fb = $('feedback');
  const star = score >= 500 ? 3 : score >= 300 ? 2 : 1;
  const msg = star === 3 ? '折射大師！你已完全掌握“往深處叉”的規律。'
           : star === 2 ? '不錯！你已經懂得繞過折射判斷真實位置。'
           : '再想想光的折射如何“欺騙”眼睛，多試幾次吧。';
  const stars = '<span style="color:#f59e0b;letter-spacing:3px;font-size:18px">' + '★'.repeat(star) + '</span>' +
                '<span style="color:#d1d5db;letter-spacing:3px;font-size:18px">' + '☆'.repeat(3-star) + '</span>';
  fb.className = '';
  fb.innerHTML = `
    <div class="box win">
      <div class="f-title"><span class="em"><svg width="26" height="26" viewBox="0 0 24 24" fill="#f59e0b"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z"/></svg></span>挑戰完成</div>
      <div class="f-score">${score} 分</div>
      <div class="f-desc">${stars}　${msg}</div>
      <div class="f-phy"><b>漁民為什麼能叉中？</b><br>魚發出的光從水中射向空氣，在<b>水面發生折射</b>，折射角大於入射角（<span class="eq">n<sub>水</sub>·sinθ₁ = sinθ₂</span>）。眼睛沿折射光線反向延長看過去，看到的只是魚的<b>虛像</b>，它比真實位置更<b>淺</b>（<span class="eq">視深 = 實深 ÷ 1.333</span>）。所以要叉中真實位置的魚，必須把叉投到<b>“看到的魚”的下方</b>——這正是漁民叉魚的經驗。</div>
      <div class="f-cta"><button class="btn primary" id="restartBtn">重新挑戰</button></div>
    </div>`;
  fb.style.display = 'flex';
  $('restartBtn').onclick = () => {
    score = 0; level = 1; revealed = false; peeked = false;
    $('score').textContent = 0;
    fb.style.display = 'none';
    setView('person', {noPeek:true});
    spawnLevel();
  };
}

/* ---------------------------------------------------------
   動畫循環
--------------------------------------------------------- */
let lastT = performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;

  // 水面波紋（PlaneGeometry 繞 X 轉 -90° 後，局部 z 才是高度）
  if(waterMesh && waterMesh.visible){
    const pos = waterMesh.geometry.attributes.position;
    for(let i = 0; i < pos.count; i++){
      const v = waterVerts[i];
      pos.setZ(i, Math.sin(v.x * 1.5 + now * 0.0017) * 0.05 + Math.sin(v.y * 1.9 + now * 0.0022) * 0.04);
    }
    pos.needsUpdate = true;
  }

  // 魚遊動（緩慢巡遊 + 擺尾）
  if(fishReal){
    const u = fishReal.userData;
    if(u){
      if(!revealed){
        u.t += dt;
        fishReal.position.x = u.homeX + Math.sin(u.t * 0.45 + u.phase) * 0.12;
        fishReal.position.z = u.homeZ + Math.sin(u.t * 0.55 + u.phase * 1.7) * 0.18;
        fishReal.position.y = -u.depth + Math.sin(u.t * 0.85 + u.phase) * 0.06;
        fishReal.rotation.y = u.yaw + Math.sin(u.t * 0.5 + u.phase) * 0.16;
      }
      syncFish();
    }
  }

  if(activeView === 'side'){
    updatePath();
    updateAim();
    updateLabels();
  }

  renderer.render(scene, activeCamera);
}

/* ---------------------------------------------------------
   交互
--------------------------------------------------------- */
function pointerNDC(e){
  const r = $('scene').getBoundingClientRect();
  const cx = (e.clientX !== undefined) ? e.clientX : e.touches[0].clientX;
  const cy = (e.clientY !== undefined) ? e.clientY : e.touches[0].clientY;
  return {nx:(cx - r.left) / r.width * 2 - 1, ny:-(cy - r.top) / r.height * 2 + 1, cx, cy};
}

$('scene').addEventListener('click', (e) => {
  if($('intro').style.display !== 'none') return;
  const {nx, ny} = pointerNDC(e);
  throwSpear(nx, ny);
});
/* 觸屏（平板/手機）：按下、拖動可瞄準，鬆手投叉 */
let lastTouch = null;
$('scene').addEventListener('touchstart', (e) => {
  if($('intro').style.display !== 'none') return;
  e.preventDefault();
  const {nx, ny, cx, cy} = pointerNDC(e);
  lastTouch = {nx, ny};
  const c = $('crosshair');
  c.style.left = cx + 'px'; c.style.top = cy + 'px';
  if(activeView === 'person' && !revealed){
    c.style.opacity = '1';
    updateHeldSpear(nx, ny);
  }
}, {passive:false});
$('scene').addEventListener('touchmove', (e) => {
  if($('intro').style.display !== 'none' || activeView !== 'person') return;
  e.preventDefault();
  const {nx, ny, cx, cy} = pointerNDC(e);
  lastTouch = {nx, ny};
  const c = $('crosshair');
  c.style.left = cx + 'px'; c.style.top = cy + 'px';
  if(!revealed){
    c.style.opacity = '1';
    updateHeldSpear(nx, ny);
  }
}, {passive:false});
$('scene').addEventListener('touchend', (e) => {
  if($('intro').style.display !== 'none' || !lastTouch) return;
  e.preventDefault();
  const t = lastTouch;
  lastTouch = null;
  throwSpear(t.nx, t.ny);
}, {passive:false});
$('scene').addEventListener('mousemove', (e) => {
  if(activeView !== 'person') return;
  const {nx, ny, cx, cy} = pointerNDC(e);
  const c = $('crosshair');
  c.style.left = cx + 'px';
  c.style.top = cy + 'px';
  if(!revealed){
    c.style.opacity = '1';
    updateHeldSpear(nx, ny);
  }
});

document.querySelectorAll('.viewbtn').forEach(b => {
  b.addEventListener('click', () => {
    const v = b.dataset.view;
    if(v === activeView) return;
    const wasPeek = (v === 'side' && !revealed);
    setView(v);
    if(wasPeek && fishReal) toast('側面視角會揭示真實魚位置，本關得分減半');
    else if(v === 'side') toast('金色=真實光路　淺紫虛線=反向延長線　淺色魚=虛像　θ₁入射角 θ₂折射角');
  });
});

/* ---------------------------------------------------------
   音效
--------------------------------------------------------- */
function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
  }
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, dur, type = 'sine', vol = 0.18, when = 0){
  if(muted || !audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, audioCtx.currentTime + when);
  g.gain.exponentialRampToValueAtTime(vol, audioCtx.currentTime + when + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + when + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(audioCtx.currentTime + when);
  o.stop(audioCtx.currentTime + when + dur + 0.05);
}
function playSfx(kind){
  ensureAudio();
  if(kind === 'throw'){ tone(320, 0.16, 'triangle', 0.12); tone(160, 0.2, 'sine', 0.1, 0.02); }
  else if(kind === 'hit'){ tone(880, 0.14, 'sine', 0.16); tone(1320, 0.2, 'sine', 0.14, 0.05); }
  else if(kind === 'perfect'){ tone(1046, 0.12, 'sine', 0.15); tone(1568, 0.18, 'sine', 0.15, 0.06); }
  else if(kind === 'miss'){ tone(220, 0.28, 'sawtooth', 0.1); tone(140, 0.3, 'square', 0.07, 0.03); }
}

/* ---------------------------------------------------------
   輕提示
--------------------------------------------------------- */
let toastEl;
function toast(msg){
  if(!toastEl){
    toastEl = document.createElement('div');
    Object.assign(toastEl.style, {
      position:'fixed', bottom:'88px', left:'50%', transform:'translateX(-50%)', zIndex:50,
      background:'rgba(6,42,51,.9)', border:'1px solid rgba(255,255,255,.2)', borderRadius:'10px',
      padding:'9px 16px', fontSize:'13px', color:'#eafcff', boxShadow:'0 8px 24px rgba(6,42,51,.35)',
      transition:'opacity .3s', pointerEvents:'none', maxWidth:'86vw', textAlign:'center'
    });
    document.body.appendChild(toastEl);
  }
  toastEl.textContent = msg;
  toastEl.style.opacity = '1';
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(() => { toastEl.style.opacity = '0'; }, 2400);
}

function onResize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  fitPersonCamera(w, h);
  layoutSideCamera();
}

/* 平板/手機豎屏時橫向視野會變窄，按需要放大縱向視角，保證魚和落點都在畫面內 */
function fitPersonCamera(w, h){
  const a = Math.max(0.35, w / h);
  const vHalf = Math.max(
    THREE.MathUtils.degToRad(31),                                  // 俯視方向至少要看到 31°
    Math.atan(Math.tan(THREE.MathUtils.degToRad(33)) / a)          // 左右方向至少要看到 33°
  );
  cameraPerson.fov = THREE.MathUtils.radToDeg(vHalf * 2);
  cameraPerson.aspect = a;
  cameraPerson.updateProjectionMatrix();
}

/* ---------------------------------------------------------
   啟動
--------------------------------------------------------- */
$('startBtn').addEventListener('click', () => {
  ensureAudio();
  $('intro').style.display = 'none';
  score = 0; level = 1; revealed = false; peeked = false;
  $('score').textContent = 0;
  setView('person', {noPeek:true});
  spawnLevel();
});
$('mute').addEventListener('click', () => {
  muted = !muted;
  $('icSoundOn').style.display = muted ? 'none' : '';
  $('icSoundOff').style.display = muted ? '' : 'none';
});

initThree();
initLabels();
spawnLevel();
setView('person', {noPeek:true});
animate();
})();
</script>
