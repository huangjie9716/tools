<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b12" />
    <title>澳門聖保祿中學物理公開課小組積分系統</title>
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            color-scheme: dark;
            --panel: rgba(18, 26, 38, 0.94);
            --line: rgba(120, 160, 255, 0.16);
            --text: #e6edf7;
            --muted: #8fa3bd;
            --cyan: #4dd0ff;
            --green: #5de0a1;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 40px 24px;
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background:
                radial-gradient(900px 520px at 8% 0%, rgba(77, 208, 255, 0.14), transparent 60%),
                radial-gradient(760px 480px at 100% 20%, rgba(124, 140, 255, 0.13), transparent 58%),
                linear-gradient(155deg, #070b12 0%, #0b1220 55%, #070b12 100%);
        }

        button {
            font: inherit;
        }

        .container {
            width: min(100%, 1040px);
            margin: 0 auto;
            padding: 32px;
            border: 1px solid var(--line);
            border-radius: 24px;
            background: linear-gradient(180deg, var(--panel), rgba(13, 20, 31, 0.97));
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.48);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 18px;
            padding-bottom: 26px;
            border-bottom: 1px solid var(--line);
        }

        .title-logo {
            width: 62px;
            height: 62px;
            flex: 0 0 auto;
            filter: drop-shadow(0 0 12px rgba(77, 208, 255, 0.22));
        }

        h1 {
            margin: 0;
            font-size: clamp(25px, 5vw, 36px);
            letter-spacing: 1px;
        }

        .back-link {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            padding: 9px 18px;
            border: 1px solid var(--line);
            border-radius: 999px;
            color: var(--muted);
            font-size: 14px;
            letter-spacing: 1px;
            text-decoration: none;
            white-space: nowrap;
            transition: color 180ms ease, border-color 180ms ease, background 180ms ease;
        }

        .back-link:hover,
        .back-link:focus-visible {
            color: var(--text);
            border-color: rgba(77, 208, 255, 0.45);
            background: rgba(77, 208, 255, 0.08);
            outline: none;
        }

        .group-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            padding-top: 28px;
        }

        .group-card {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            align-items: center;
            gap: 18px;
            min-height: 154px;
            padding: 23px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background:
                radial-gradient(220px 120px at 100% 0%, rgba(77, 208, 255, 0.08), transparent 75%),
                linear-gradient(145deg, rgba(22, 33, 49, 0.96), rgba(13, 21, 33, 0.96));
            transition: border-color 180ms ease, transform 180ms ease;
        }

        .group-card:hover {
            transform: translateY(-2px);
            border-color: rgba(77, 208, 255, 0.38);
        }

        .group-identity {
            display: flex;
            align-items: center;
            gap: 13px;
            min-width: 0;
        }

        .group-rank {
            display: grid;
            width: 36px;
            height: 36px;
            flex: 0 0 auto;
            place-items: center;
            border: 1px solid rgba(77, 208, 255, 0.2);
            border-radius: 11px;
            color: var(--cyan);
            background: rgba(77, 208, 255, 0.08);
            font-size: 13px;
            font-weight: 700;
        }

        .group-name {
            margin: 0;
            font-size: 21px;
            font-weight: 700;
            white-space: nowrap;
        }

        .group-score {
            color: #fff;
            font-size: clamp(36px, 5vw, 50px);
            font-variant-numeric: tabular-nums;
            font-weight: 800;
            line-height: 1;
            text-align: right;
            text-shadow: 0 0 22px rgba(77, 208, 255, 0.2);
        }

        .score-unit {
            margin-left: 5px;
            color: var(--muted);
            font-size: 14px;
            font-weight: 500;
            text-shadow: none;
        }

        .score-actions {
            display: flex;
            gap: 8px;
        }

        .score-button {
            display: grid;
            width: 50px;
            height: 50px;
            place-items: center;
            border: 1px solid transparent;
            border-radius: 15px;
            cursor: pointer;
            font-size: 29px;
            font-weight: 500;
            transition: transform 150ms ease, filter 150ms ease, background 150ms ease;
        }

        .score-button:hover:not(:disabled) {
            transform: translateY(-1px);
            filter: brightness(1.12);
        }

        .score-button:active:not(:disabled) {
            transform: scale(0.96);
        }

        .score-button:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 3px;
        }

        .add-button {
            border-color: rgba(93, 224, 161, 0.28);
            color: var(--green);
            background: rgba(93, 224, 161, 0.12);
        }

        .subtract-button {
            border-color: rgba(255, 120, 135, 0.24);
            color: #ff9aa5;
            background: rgba(255, 120, 135, 0.1);
        }

        .subtract-button:disabled {
            opacity: 0.38;
            cursor: not-allowed;
        }

        .save-status {
            min-height: 20px;
            margin: 17px 2px 0;
            color: var(--muted);
            font-size: 13px;
            text-align: right;
        }

        .save-status.error {
            color: #ff9aa5;
        }

        @media (max-width: 700px) {
            body {
                padding: 18px 12px;
            }

            .container {
                padding: 22px 18px;
                border-radius: 20px;
            }

            .group-list {
                gap: 11px;
            }

            .group-card {
                grid-template-columns: minmax(0, 1fr) auto;
                gap: 14px 8px;
                min-height: 0;
                padding: 17px;
            }

            .group-identity {
                grid-column: 1 / -1;
            }

            .group-score {
                font-size: 40px;
                text-align: left;
            }

            .score-actions {
                justify-self: end;
            }

            .score-button {
                width: 46px;
                height: 46px;
            }
        }

        @media (max-width: 480px) {
            .header {
                gap: 13px;
                padding-bottom: 21px;
            }

            .title-logo {
                width: 52px;
                height: 52px;
            }

            .group-list {
                grid-template-columns: 1fr;
            }

            .group-card {
                grid-template-columns: minmax(0, 1fr) auto auto;
                min-height: 112px;
                padding: 17px;
            }

            .group-identity {
                grid-column: auto;
                gap: 10px;
            }

            .group-rank {
                width: 32px;
                height: 32px;
            }

            .group-name {
                font-size: 18px;
            }

            .group-score {
                font-size: 34px;
            }

            .score-unit {
                margin-left: 3px;
                font-size: 12px;
            }

            .score-button {
                width: 40px;
                height: 40px;
                border-radius: 12px;
                font-size: 24px;
            }
        }
    </style>
</head>

            <h1>澳門聖保祿中學物理公開課小組積分系統</h1>
            <a class="back-link" href="macao-class.html">← 返回平台</a>
        </header>

        <section class="group-list" id="groupList" aria-label="小組積分">
            <article class="group-card" data-group="group-1">
                <div class="group-identity"><span class="group-rank">01</span><h2 class="group-name">第一組</h2></div>
                <div class="group-score" aria-live="polite">0<span class="score-unit">分</span></div>
                <div class="score-actions" aria-label="第一組積分操作">
                    <button class="score-button subtract-button" type="button" aria-label="第一組減 1 分" disabled>−</button>
                    <button class="score-button add-button" type="button" aria-label="第一組加 1 分">+</button>
                </div>
            </article>
            <article class="group-card" data-group="group-2">
                <div class="group-identity"><span class="group-rank">02</span><h2 class="group-name">第二組</h2></div>
                <div class="group-score" aria-live="polite">0<span class="score-unit">分</span></div>
                <div class="score-actions" aria-label="第二組積分操作">
                    <button class="score-button subtract-button" type="button" aria-label="第二組減 1 分" disabled>−</button>
                    <button class="score-button add-button" type="button" aria-label="第二組加 1 分">+</button>
                </div>
            </article>
            <article class="group-card" data-group="group-3">
                <div class="group-identity"><span class="group-rank">03</span><h2 class="group-name">第三組</h2></div>
                <div class="group-score" aria-live="polite">0<span class="score-unit">分</span></div>
                <div class="score-actions" aria-label="第三組積分操作">
                    <button class="score-button subtract-button" type="button" aria-label="第三組減 1 分" disabled>−</button>
                    <button class="score-button add-button" type="button" aria-label="第三組加 1 分">+</button>
                </div>
            </article>
            <article class="group-card" data-group="group-4">
                <div class="group-identity"><span class="group-rank">04</span><h2 class="group-name">第四組</h2></div>
                <div class="group-score" aria-live="polite">0<span class="score-unit">分</span></div>
                <div class="score-actions" aria-label="第四組積分操作">
                    <button class="score-button subtract-button" type="button" aria-label="第四組減 1 分" disabled>−</button>
                    <button class="score-button add-button" type="button" aria-label="第四組加 1 分">+</button>
                </div>
            </article>
        </section>
        <p class="save-status" id="saveStatus" role="status">積分保存在此瀏覽器</p>
    </main>

    <script>
        const STORAGE_KEY = 'macau-st-paul-group-scores';
        const groupCards = [...document.querySelectorAll('.group-card')];
        const saveStatus = document.getElementById('saveStatus');
        let audioContext;

        function setScore(card, score) {
            const scoreDisplay = card.querySelector('.group-score');
            scoreDisplay.firstChild.textContent = String(score);
            card.querySelector('.subtract-button').disabled = score <= 0;
        }

        function loadScores() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (!saved) return;

                const scores = JSON.parse(saved);
                for (const card of groupCards) {
                    const score = scores[card.dataset.group];
                    if (Number.isSafeInteger(score)) setScore(card, score);
                }
            } catch (error) {
                console.error('無法讀取本機保存的積分。', error);
                saveStatus.textContent = '無法讀取本機積分，當前從 0 分開始';
                saveStatus.classList.add('error');
            }
        }

        function saveScores() {
            const scores = Object.fromEntries(groupCards.map(card => [
                card.dataset.group,
                Number(card.querySelector('.group-score').firstChild.textContent)
            ]));
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(scores));
                saveStatus.textContent = '積分已保存在此瀏覽器';
                saveStatus.classList.remove('error');
            } catch (error) {
                console.error('無法保存積分到本機。', error);
                saveStatus.textContent = '本機保存失敗，請保持此頁面開啟';
                saveStatus.classList.add('error');
            }
        }

        function playAddSound() {
            const AudioContextType = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextType) {
                saveStatus.textContent = '此瀏覽器不支援加分音效';
                return;
            }

            try {
                audioContext ||= new AudioContextType();
                const oscillator = audioContext.createOscillator();
                const volume = audioContext.createGain();
                const startTime = audioContext.currentTime;

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(880, startTime);
                oscillator.frequency.exponentialRampToValueAtTime(1320, startTime + 0.12);
                volume.gain.setValueAtTime(0.0001, startTime);
                volume.gain.exponentialRampToValueAtTime(0.18, startTime + 0.015);
                volume.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.32);
                oscillator.connect(volume);
                volume.connect(audioContext.destination);
                oscillator.start(startTime);
                oscillator.stop(startTime + 0.33);
            } catch (error) {
                console.error('無法播放加分音效。', error);
                saveStatus.textContent = '加分成功，但音效無法播放';
            }
        }

        for (const card of groupCards) {
            card.querySelector('.add-button').addEventListener('click', () => {
                const scoreDisplay = card.querySelector('.group-score');
                const score = Number(scoreDisplay.firstChild.textContent);
                if (!Number.isSafeInteger(score + 1)) {
                    saveStatus.textContent = '積分已達到可記錄範圍上限';
                    saveStatus.classList.add('error');
                    return;
                }

                setScore(card, score + 1);
                saveScores();
                playAddSound();
            });

            card.querySelector('.subtract-button').addEventListener('click', () => {
                const scoreDisplay = card.querySelector('.group-score');
                const score = Number(scoreDisplay.firstChild.textContent);
                if (score <= 0) return;

                setScore(card, score - 1);
                saveScores();
            });
        }

        loadScores();
    </script>
</body>
