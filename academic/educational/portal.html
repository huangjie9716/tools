<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>珠海市九洲中学教育质量管理与分析系统</title>
<script src="shared/auth.js?v=202611032325"></script>
<link rel="icon" type="image/png" href="shared/assets/favicon.png?v=202611032325">
<link rel="apple-touch-icon" href="shared/assets/favicon.png?v=202611032325">
<link rel="stylesheet" href="shared/styles/cloud.css?v=202611032325">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f3f5f8;
    font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    color: #252a38;
  }
  .pf-main { max-width: 1560px; margin: 0 auto; padding: 22px 20px 60px; }


  .pf-grid { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 20px; align-items: start; }
  @media (max-width: 1100px) { .pf-grid { grid-template-columns: 1fr; } }

  .pf-card {
    background: #fff;
    border: 1px solid #e2e6ee;
    border-radius: 16px;
    padding: 20px 22px;
    box-shadow: 0 6px 22px rgba(20, 28, 60, .06);
    margin-bottom: 20px;
  }
  .pf-card:last-child { margin-bottom: 0; }
  .pf-card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .pf-card-head h2 { margin: 0; font-size: 17px; }
  .pf-head-icon { width: 20px; height: 20px; flex: 0 0 auto; color: #1b2454; }
  .pf-card-head > a, .pf-card-head > button {
    margin-left: auto;
    font-size: 13px;
    color: #1b2454;
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: none;
    font-family: inherit;
  }
  .pf-card-head > a:hover, .pf-card-head > button:hover { text-decoration: underline; }

  .pf-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 700px) { .pf-stats { grid-template-columns: repeat(2, 1fr); } }
  .pf-stat {
    background: #f4f6fa;
    border: 1px solid #e3e8f1;
    border-radius: 14px;
    padding: 18px 10px;
    text-align: center;
  }
  .pf-stat b { display: block; font-size: 28px; color: #1b2454; line-height: 1.1; }
  .pf-stat span { display: block; font-size: 12px; color: #6e7484; margin-top: 6px; }

  .pf-recent { display: flex; flex-direction: column; gap: 8px; }
  .pf-exam {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border: 1px solid #e4e8f0;
    border-radius: 12px;
    background: #fcfdff;
    text-decoration: none;
    color: inherit;
    transition: border-color .16s ease, background .16s ease;
  }
  .pf-exam:hover { border-color: #b9c3d5; background: #f4f6fa; }
  .pf-exam-grade { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; flex: none; }
  .pf-exam-name { font-weight: 600; font-size: 14px; }
  .pf-exam-meta { margin-left: auto; font-size: 12px; color: #707688; flex: none; }
  .pf-empty { font-size: 13px; color: #858b9a; padding: 24px 10px; text-align: center; background: #fbfcfe; border: 1px dashed #e2e7ef; border-radius: 12px; }

  /* 系统通知（由 notice.md 渲染） */
  .pf-notice { font-size: 14px; line-height: 1.85; color: #3f4558; }
  .pf-notice > :first-child { margin-top: 0; }
  .pf-notice > :last-child { margin-bottom: 0; }
  .pf-notice h2 { margin: 0 0 10px; font-size: 16px; color: #1b2454; }
  .pf-notice h3 { margin: 14px 0 8px; font-size: 15px; color: #1b2454; }
  .pf-notice h4,
  .pf-notice h5,
  .pf-notice h6 { margin: 12px 0 6px; font-size: 14px; color: #1b2454; }
  .pf-notice p { margin: 0 0 10px; }
  .pf-notice ul,
  .pf-notice ol { margin: 0 0 10px; padding-left: 20px; }
  .pf-notice li { margin: 4px 0; }
  .pf-notice li::marker { color: #1b2454; }
  .pf-notice a { color: #1b2454; text-decoration: underline; text-underline-offset: 2px; }
  .pf-notice strong { color: #1b2454; }
  .pf-notice code {
    padding: 1px 6px;
    border-radius: 6px;
    background: #eef1f8;
    font-size: 12.5px;
    font-family: ui-monospace, Consolas, "Courier New", monospace;
  }
  .pf-notice blockquote {
    margin: 10px 0;
    padding: 8px 14px;
    border-left: 3px solid #c8d1e2;
    background: #fbfcfe;
    border-radius: 0 10px 10px 0;
    color: #6e7484;
  }
  .pf-notice hr { height: 0; margin: 14px 0; border: 0; border-top: 1px solid #e7ebf3; }

  .pf-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 480px) { .pf-actions { grid-template-columns: 1fr; } }
  .pf-action {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 4px;
    padding: 18px 16px;
    border-radius: 14px;
    border: 1px solid #e4e8f0;
    background: #fcfdff;
    text-decoration: none;
    color: inherit;
    transition: transform .16s ease, box-shadow .18s ease, border-color .16s ease;
  }
  .pf-action:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(20, 28, 60, .14); border-color: #c8d1e2; }
  .pf-icon { display: inline-flex; width: 40px; height: 40px; margin-bottom: 8px; align-self: center; }
  .pf-icon svg { width: 100%; height: 100%; display: block; }
  .pf-action b { font-size: 14px; }
  .pf-action small { font-size: 12px; color: #707688; line-height: 1.6; }

  .pf-card-link { display: inline-flex; align-items: center; gap: 4px; }
  .pf-arrow-icon { width: 13px; height: 13px; display: block; }
  .pf-footer {
    text-align: center;
    padding: 10px 0 4px;
    font-size: 12px;
    color: #858b9a;
  }
  .pf-footer a { color: #707688; text-decoration: none; }
  .pf-footer a:hover { color: #151d40; text-decoration: underline; }

</style>
</head>

<script src="shared/cloud/config.js?v=202611032325"></script>
<script src="shared/cloud/api.js?v=202611032325"></script>
<script src="shared/cloud/store.js?v=202611032325"></script>
<script src="shared/cloud/ui.js?v=202611032325"></script>
<script src="shared/notice-md.js?v=202611032325"></script>
<script src="notice-data.js?v=202611032325"></script>
<script>
(function () {
  "use strict";
  var STORE = window.JZStore, UI = window.JZUI;

  function esc(v) { return UI.escapeHtml(v); }

  function showHint(html, type) {
    var box = document.getElementById("portalHint");
    if (!html) { box.hidden = true; return; }
    box.className = "jz-alert " + (type || "info");
    box.hidden = false;
    box.innerHTML = html;
  }

  async function loadStats() {
    try { if (window.JZCloud && window.JZCloud.ready) await window.JZCloud.ready(); } catch (e) { /* ignore */ }
    if (!STORE.isReady()) {
      showHint('还没有连接云端数据：打开 <a href="admin/admin.html">管理员入口 → 连接设置</a> 填写 Supabase 地址与 anon key（详见《Supabase配置与使用说明.md》）。', "warn");
      return;
    }
    try {
      var s = await STORE.stats();
      document.getElementById("statGrades").textContent = s.grades;
      document.getElementById("statExams").textContent = s.exams;
      document.getElementById("statPapers").textContent = s.papers;
      document.getElementById("statStudents").textContent = s.students;
      if (!s.grades) {
        showHint('云端还没有数据：请打开 <a href="admin/admin.html">管理员入口</a> 上传第一份成绩。', "info");
      } else {
        showHint("");
      }
    } catch (err) {
      showHint("读取云端数据失败：" + esc(err.message) + "。请检查连接设置，或在 Supabase 中执行 database/schema.sql。", "error");
    }
  }

  async function loadRecent() {
    var box = document.getElementById("recentExams");
    try { if (window.JZCloud && window.JZCloud.ready) await window.JZCloud.ready(); } catch (e) { /* ignore */ }
    if (!STORE.isReady()) {
      box.innerHTML = '<div class="pf-empty">未连接云端，暂无考试数据</div>';
      return;
    }
    try {
      var grades = await STORE.listGrades();
      var exams = await STORE.listAllExams(8);
      var gradeMap = {};
      (grades || []).forEach(function (g) { gradeMap[g.id] = g.name; });
      if (!exams.length) {
        box.innerHTML = '<div class="pf-empty">还没有上传过考试</div>';
        return;
      }
      box.innerHTML = exams.map(function (ex) {
        var dateText = ex.exam_date
          ? String(ex.exam_date).slice(0, 10)
          : (ex.created_at ? "上传于 " + String(ex.created_at).slice(0, 10) : "");
        var meta = [];
        if (ex.student_count) meta.push(ex.student_count + " 人");
        if (ex.scope) meta.push(ex.scope);
        if (dateText) meta.push(dateText);
        return '<a class="pf-exam" href="systems/basic/basic.html?exam=' + encodeURIComponent(ex.id) + '">' +
          (gradeMap[ex.grade_id] ? UI.gradeChip(gradeMap[ex.grade_id], "pf-exam-grade")
            : '<span class="pf-exam-grade">—</span>') +
          '<span class="pf-exam-name">' + esc(ex.name) + "</span>" +
          '<span class="pf-exam-meta">' + esc(meta.join(" · ")) + "</span>" +
          "</a>";
      }).join("");
    } catch (err) {
      box.innerHTML = '<div class="pf-empty">读取失败：' + esc(err.message) + "</div>";
    }
  }

  /* ---------------- 系统通知（读根目录 notice.md） ---------------- */
  /* 渲染逻辑放在 shared/notice-md.js，后台「预览效果」用的是同一份 */
  function renderNoticeMarkdown(source) {
    if (window.JZNoticeMarkdown) return window.JZNoticeMarkdown(source);
    return "";
  }

  async function loadNotice() {
    var box = document.getElementById("portalNotice");
    if (!box) return;
    var md = "";
    /* 1) 云端通知（管理员在后台保存后立即生效，无需重新部署） */
    if (window.JZCloud && typeof window.JZCloud.ready === "function") {
      try { await window.JZCloud.ready(); } catch (e) { /* 配置读取失败时按未配置处理 */ }
    }
    if (window.JZStore && window.JZStore.isReady && window.JZStore.isReady()) {
      try {
        var rec = await window.JZStore.getNotice();
        if (rec && rec.body && rec.body.trim()) md = rec.body;
      } catch (e) { /* 表未建或网络异常时继续走本地兜底 */ }
    }
    /* 2) 根目录 notice.md（http 访问时可直接读取） */
    if (!md || !md.trim()) {
      try {
        var res = await fetch("notice.md", { cache: "no-store" });
        if (res && res.ok) md = await res.text();
      } catch (e) { /* file:// 下浏览器不允许读取本地 md，走兜底 */ }
    }
    /* 3) 内嵌副本（由 tools/sync-notice.mjs 生成） */
    if (!md || !md.trim()) {
      if (typeof window.JZ_NOTICE_MD === "string") md = window.JZ_NOTICE_MD;
    }
    if (!md || !md.trim()) {
      box.innerHTML = '<div class="pf-empty">暂无系统通知或提醒</div>';
      return;
    }
    box.innerHTML = renderNoticeMarkdown(md);
  }

  function init() {
    var isAdmin = !!(window.JZAuth && window.JZAuth.isAdmin());
    if (!isAdmin) {
      var adminLink = document.getElementById("adminFooterLink");
      if (adminLink) adminLink.remove();
    }
    try { UI.mountNav({ base: "", page: "portal" }); } catch (e) { /* ignore */ }
    loadStats();
    loadRecent();
    loadNotice();
    document.getElementById("refreshStats").addEventListener("click", function () {
      loadStats();
      loadRecent();
      loadNotice();
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
</html>
