<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初中语文必背古诗文</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }
        :root {
            --bg: #1a1625;
            --bg2: #221d33;
            --card: #2a2440;
            --card2: #332b4d;
            --border: #3d3460;
            --text: #e8e2f0;
            --text2: #a99fc4;
            --text3: #7d7396;
            --accent: #d4a574;
            --accent2: #c08b5c;
            --accent3: #e8c9a0;
            --green: #7fb069;
            --blue: #6c9bd2;
            --red: #d97a7a;
            --purple: #b388d9;
            --sidebar-w: 200px;
        }
        html,
        body {
            height: 100%
        }
        body {
            font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.8;
            overflow: hidden
        }
        .layout {
            display: flex;
            height: 100vh
        }

        /* 左侧导航 */
        .sidebar {
            width: var(--sidebar-w);
            flex-shrink: 0;
            background: var(--bg2);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 0 0 0;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 20px 16px 14px;
            border-bottom: 1px solid var(--border);
            text-align: center;
            flex-shrink: 0;
        }
        .sidebar-header h1 {
            font-size: 1.1rem;
            color: var(--accent3);
            letter-spacing: 2px;
            margin-bottom: 4px;
            font-weight: 700
        }
        .sidebar-header p {
            font-size: .7rem;
            color: var(--text3)
        }

        /* 导航按钮容器 — 可滚动 */
        .nav-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 0 0 10px;
        }
        .grade-group {
            margin-top: 8px
        }
        .grade-label {
            padding: 10px 16px 4px;
            font-size: .85rem;
            color: var(--text3);
            font-weight: 600;
            letter-spacing: 1px
        }
        .sem-btn {
            display: block;
            width: 100%;
            padding: 12px 16px;
            border: none;
            background: transparent;
            color: var(--text2);
            cursor: pointer;
            font-family: inherit;
            font-size: .95rem;
            text-align: left;
            transition: all .2s;
            border-left: 3px solid transparent;
            letter-spacing: 1px
        }
        .sem-btn:hover {
            background: var(--card);
            color: var(--text)
        }
        .sem-btn.active {
            background: var(--card2);
            color: var(--accent3);
            border-left-color: var(--accent);
            font-weight: 600
        }
        .sem-btn .count {
            font-size: .75rem;
            color: var(--text3);
            float: right;
            margin-top: 2px
        }
        .sem-btn.active .count {
            color: var(--accent2)
        }

        /* 设计者注释 — 固定在底部 */
        .designer-credit {
            flex-shrink: 0;
            padding: 12px 16px 14px;
            font-size: 0.7rem;
            color: var(--text3);
            text-align: center;
            border-top: 1px solid var(--border);
            letter-spacing: 1px;
            background: var(--bg2);
            user-select: none;
            transition: color 0.3s;
        }
        .designer-credit:hover {
            color: var(--accent2);
        }
        .designer-credit .heart {
            display: inline-block;
            margin: 0 2px;
            color: var(--red);
            font-size: 0.65rem;
        }

        /* 右侧内容 */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px 60px;
            scroll-behavior: smooth
        }
        .content-header {
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border)
        }
        .content-header h2 {
            font-size: 1.4rem;
            color: var(--accent3);
            letter-spacing: 3px
        }
        .content-header .desc {
            font-size: .8rem;
            color: var(--text3);
            margin-top: 4px
        }
        .poem-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 10px;
            overflow: hidden;
            transition: all .3s
        }
        .poem-item:hover {
            border-color: var(--accent2)
        }
        .poem-item.open {
            border-color: var(--accent2);
            background: var(--card2)
        }
        .poem-header {
            padding: 14px 18px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none
        }
        .poem-title-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap
        }
        .poem-title {
            font-size: 1.05rem;
            color: var(--text);
            font-weight: 600
        }
        .poem-author {
            font-size: .8rem;
            color: var(--text3)
        }
        .poem-tag {
            font-size: .7rem;
            padding: 2px 8px;
            border-radius: 6px;
            background: var(--bg2);
            color: var(--text2)
        }
        .poem-tag.gushi {
            color: var(--green);
            border: 1px solid rgba(127, 176, 105, .3)
        }
        .poem-tag.ciren {
            color: var(--purple);
            border: 1px solid rgba(179, 136, 217, .3)
        }
        .poem-tag.wenyan {
            color: var(--blue);
            border: 1px solid rgba(108, 155, 210, .3)
        }
        .poem-tag.shijing {
            color: var(--red);
            border: 1px solid rgba(217, 122, 122, .3)
        }
        .poem-tag.xiandai {
            color: var(--accent3);
            border: 1px solid rgba(232, 201, 160, .3)
        }
        .poem-tag.xiandaishi {
            color: var(--blue);
            border: 1px solid rgba(108, 155, 210, .3)
        }
        .poem-header .arrow {
            color: var(--text3);
            transition: transform .3s;
            font-size: .8rem;
            flex-shrink: 0;
            margin-left: 8px
        }
        .poem-item.open .arrow {
            transform: rotate(180deg)
        }
        .poem-content-wrap {
            max-height: 0;
            overflow: hidden;
            transition: max-height .4s ease
        }
        .poem-item.open .poem-content-wrap {
            max-height: 99999px
        }
        .poem-content {
            padding: 16px 22px 20px;
            border-top: 1px solid var(--border)
        }
        .poem-text {
            font-size: 1.1rem;
            line-height: 2.2;
            color: var(--text);
            text-align: center;
            white-space: pre-wrap;
            padding: 8px 0
        }
        .poem-text.modern {
            text-align: left;
            white-space: normal;
            padding: 8px 0
        }
        .poem-text.modern p {
            margin: 0 0 1.2em 0;
            text-indent: 2em;
            line-height: 2
        }
        .poem-text.modern p:last-child {
            margin-bottom: 0
        }
        ruby {
            ruby-position: over
        }
        rt {
            font-size: .5em;
            color: var(--accent2);
            font-family: 'Noto Sans SC', sans-serif;
            line-height: 1.4
        }
        .pron-section {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px dashed var(--border)
        }
        .pron-title {
            font-size: .85rem;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px
        }
        .pron-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px
        }
        .pron-item {
            font-size: .85rem;
            color: var(--text2);
            background: var(--bg);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid var(--border)
        }
        .pron-item .char {
            color: var(--accent3);
            font-weight: 600;
            margin-right: 2px
        }
        .pron-item .pinyin {
            color: var(--green);
            font-style: italic
        }
        .notes-section {
            margin-top: 16px;
            padding: 14px 18px;
            background: rgba(108, 155, 210, .06);
            border-radius: 8px;
            border: 1px solid rgba(108, 155, 210, .2)
        }
        .notes-title {
            font-size: .85rem;
            color: var(--blue);
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px
        }
        .notes-list {
            display: flex;
            flex-direction: column;
            gap: 6px
        }
        .notes-item {
            font-size: .85rem;
            line-height: 1.7;
            color: var(--text2);
            padding: 4px 0;
            border-bottom: 1px dotted rgba(108, 155, 210, .15)
        }
        .notes-item:last-child {
            border-bottom: none
        }
        .notes-item .word {
            color: var(--accent3);
            font-weight: 600;
            margin-right: 4px
        }
        .notes-item .meaning {
            color: var(--text2)
        }
        .poem-meta {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px dashed var(--border);
            font-size: .8rem;
            color: var(--text3);
            text-align: center;
            line-height: 1.8
        }

        /* 语音朗诵 */
        .tts-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding: 10px 14px;
            background: rgba(212, 165, 116, .06);
            border-radius: 8px;
            border: 1px solid rgba(212, 165, 116, .15);
            flex-wrap: wrap
        }
        .tts-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #1a1625;
            font-family: inherit;
            font-size: .85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
            letter-spacing: 1px;
            white-space: nowrap
        }
        .tts-btn:hover {
            filter: brightness(1.1);
            transform: translateY(-1px)
        }
        .tts-btn.playing {
            background: linear-gradient(135deg, var(--red), #b85a5a);
            color: #fff
        }
        .tts-btn .icon {
            font-size: 1rem
        }
        .tts-speed {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: .8rem;
            color: var(--text2)
        }
        .tts-speed label {
            color: var(--text3);
            white-space: nowrap
        }
        .tts-speed select {
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-family: inherit;
            font-size: .8rem;
            cursor: pointer;
            outline: none
        }
        .tts-speed select:focus {
            border-color: var(--accent)
        }
        .tts-status {
            font-size: .78rem;
            color: var(--text3);
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 4px
        }
        .tts-status .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text3);
            display: inline-block
        }
        .tts-status.active .dot {
            background: var(--green);
            animation: pulse 1s ease-in-out infinite
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1
            }
            50% {
                opacity: .3
            }
        }

        /* 响应式 */
        @media(max-width:700px) {
            :root {
                --sidebar-w: 140px
            }
            .content-area {
                padding: 16px
            }
            .sidebar-header h1 {
                font-size: .95rem
            }
            .sem-btn {
                padding: 10px 12px;
                font-size: .85rem
            }
            .grade-label {
                padding: 8px 12px 2px;
                font-size: .75rem
            }
            .designer-credit {
                font-size: 0.6rem;
                padding: 10px 12px 12px;
            }
        }

        /* 自定义滚动条 */
        .sidebar::-webkit-scrollbar,
        .nav-scroll::-webkit-scrollbar,
        .content-area::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-track,
        .nav-scroll::-webkit-scrollbar-track,
        .content-area::-webkit-scrollbar-track {
            background: var(--bg);
        }
        .sidebar::-webkit-scrollbar-thumb,
        .nav-scroll::-webkit-scrollbar-thumb,
        .content-area::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
        .sidebar::-webkit-scrollbar-thumb:hover,
        .nav-scroll::-webkit-scrollbar-thumb:hover,
        .content-area::-webkit-scrollbar-thumb:hover {
            background: var(--accent2);
        }
    </style>
</head>
<body>

    <div class="layout">
        <!-- 左侧导航栏 -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1>必背古诗文</h1>
                <p>统编版 初中 7-9年级</p>
            </div>
            <!-- 导航按钮由 JS 生成 -->
            <div class="nav-scroll" id="navScroll"></div>
            <!-- 设计者注释（固定在底部） -->
            <div class="designer-credit">
                <span class="heart"> </span> 设计制作：juneyang23 <span class="heart"> </span>
            </div>
        </nav>

        <!-- 右侧内容区 -->
        <main class="content-area" id="contentArea">
            <!-- 内容由 JS 生成 -->
        </main>
    </div>

    <script src="data.js"></script>
    <script>

        let currentGrade = "七年级";
        let currentSemester = "上册";

        // 构建左侧导航
        function buildSidebar() {
            const navScroll = document.getElementById("navScroll");
            const grades = Object.keys(DATA);
            let navHtml = '';
            grades.forEach(grade => {
                navHtml += `<div class="grade-group">`;
                navHtml += `<div class="grade-label">${grade}</div>`;
                ["上册", "下册"].forEach(sem => {
                    const count = DATA[grade][sem].length;
                    const active = (grade === currentGrade && sem === currentSemester) ? "active" : "";
                    navHtml +=
                        `<button class="sem-btn ${active}" data-grade="${grade}" data-sem="${sem}" onclick="selectSemester('${grade}','${sem}')">${sem}<span class="count">${count}篇</span></button>`;
                });
                navHtml += `</div>`;
            });
            navScroll.innerHTML = navHtml;
        }

        // 点击左侧导航
        function selectSemester(grade, sem) {
            stopAllTts();
            currentGrade = grade;
            currentSemester = sem;
            // 更新按钮高亮
            document.querySelectorAll('.sem-btn').forEach(btn => btn.classList.remove('active'));
            const target = document.querySelector(`.sem-btn[data-grade="${grade}"][data-sem="${sem}"]`);
            if (target) target.classList.add('active');
            // 渲染右侧
            renderContent(grade, sem);
            // 滚动到顶部
            document.getElementById('contentArea').scrollTop = 0;
        }

        // 渲染右侧内容
        function renderContent(grade, sem) {
            const items = DATA[grade][sem];
            const area = document.getElementById("contentArea");
            let html = `<div class="content-header">
            <h2>${grade}·${sem}</h2>
            <div class="desc">共 ${items.length} 篇必背 · 点击篇目展开全文与读音</div>
          </div>`;

            items.forEach((item, idx) => {
                html += renderItem(item, idx);
            });

            area.innerHTML = html;
        }

        function renderItem(item, idx) {
            const tagClass = item.tag || "gushi";
            const tagLabel = item.tagLabel || "古诗";
            let textHtml = item.text;

            // 给生僻字加 ruby 注音
            if (item.pron && item.pron.length > 0) {
                const sortedPron = [...item.pron].sort((a, b) => b.c.length - a.c.length);
                for (const p of sortedPron) {
                    const escaped = p.c.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    const regex = new RegExp(escaped, 'g');
                    textHtml = textHtml.replace(regex, `<ruby>${p.c}<rt>${p.p}</rt></ruby>`);
                }
            }

            // 现代文按段落拆分，每段 <p> 首行缩进两格；其他用 <br> 换行
            const isModern = item.tag === 'xiandai';
            if (isModern) {
                const paragraphs = textHtml.split('\n').filter(p => p.trim().length > 0);
                textHtml = paragraphs.map(p => '<p>' + p + '</p>').join('');
            } else {
                textHtml = textHtml.replace(/\n/g, '<br>');
            }

            let pronHtml = '';
            if (item.pron && item.pron.length > 0) {
                pronHtml = `<div class="pron-section">
              <div class="pron-title">📖 读音说明</div>
              <div class="pron-list">`;
                item.pron.forEach(p => {
                    pronHtml +=
                        `<span class="pron-item"><span class="char">${p.c}</span> <span class="pinyin">${p.p}</span></span>`;
                });
                pronHtml += `</div></div>`;
            }

            let notesHtml = '';
            if (item.notes && item.notes.length > 0) {
                notesHtml = `<div class="notes-section">
              <div class="notes-title">📝 重点注释</div>
              <div class="notes-list">`;
                item.notes.forEach(n => {
                    notesHtml +=
                        `<div class="notes-item"><span class="word">${n.w}</span><span class="meaning">${n.m}</span></div>`;
                });
                notesHtml += `</div></div>`;
            }

            return `<div class="poem-item" id="item-${idx}">
            <div class="poem-header" onclick="toggleItem(${idx})">
              <div class="poem-title-wrap">
                <span class="poem-title">${item.title}</span>
                <span class="poem-author">· ${item.author}（${item.dynasty}）</span>
                <span class="poem-tag ${tagClass}">${tagLabel}</span>
              </div>
              <span class="arrow">▼</span>
            </div>
            <div class="poem-content-wrap">
              <div class="poem-content">
                <div class="tts-bar">
                  <button class="tts-btn" id="tts-btn-${idx}" onclick="speakPoem(${idx}, event)">
                    <span class="icon">🔊</span><span class="tts-label">朗诵</span>
                  </button>
                  <div class="tts-speed">
                    <label>语速</label>
                    <select id="tts-speed-${idx}" onchange="changeSpeed(${idx}, this.value)">
                      <option value="0.7">慢</option>
                      <option value="0.85">较慢</option>
                      <option value="0.95" selected>正常</option>
                      <option value="1.1">较快</option>
                    </select>
                  </div>
                  <div class="tts-status" id="tts-status-${idx}"><span class="dot"></span><span class="tts-status-text">就绪</span></div>
                </div>
                <div class="poem-text ${item.tag === 'xiandai' ? 'modern' : ''}">${textHtml}</div>
                ${pronHtml}
                ${notesHtml}
                <div class="poem-meta">${item.note || ''}</div>
              </div>
            </div>
          </div>`;
        }

        // 展开/折叠篇目
        function toggleItem(idx) {
            const el = document.getElementById('item-' + idx);
            if (el) el.classList.toggle('open');
        }

        // ============ 语音朗诵 ============
        let currentUtterance = null;
        let currentTtsIdx = null;

        function getCleanText(idx) {
            const items = DATA[currentGrade][currentSemester];
            const item = items[idx];
            if (!item) return '';
            let raw = item.text;
            raw = raw.replace(/\n/g, '，');
            return raw;
        }

        function speakPoem(idx, event) {
            if (event) event.stopPropagation();

            if (currentTtsIdx === idx && window.speechSynthesis.speaking) {
                stopSpeak();
                return;
            }

            stopSpeak();

            const text = getCleanText(idx);
            if (!text) return;

            const items = DATA[currentGrade][currentSemester];
            const item = items[idx];

            let fullText = '';
            if (item.title) fullText += item.title + '。';
            if (item.author && item.dynasty) fullText += item.dynasty + '，' + item.author + '。';
            fullText += text;
            if (item.note) fullText += '。' + item.note;

            const utter = new SpeechSynthesisUtterance(fullText);
            utter.lang = 'zh-CN';

            const speedSelect = document.getElementById('tts-speed-' + idx);
            const rate = speedSelect ? parseFloat(speedSelect.value) : 0.95;
            utter.rate = rate;
            utter.pitch = 1;
            utter.volume = 1;

            const voices = window.speechSynthesis.getVoices();
            const zhVoice = voices.find(v => v.lang.startsWith('zh')) || voices.find(v => v.lang.includes('CN'));
            if (zhVoice) utter.voice = zhVoice;

            const btn = document.getElementById('tts-btn-' + idx);
            const status = document.getElementById('tts-status-' + idx);
            if (btn) {
                btn.classList.add('playing');
                btn.querySelector('.icon').textContent = '⏹';
                btn.querySelector('.tts-label').textContent = '停止';
            }
            if (status) {
                status.classList.add('active');
                status.querySelector('.tts-status-text').textContent = '朗诵中…';
            }

            currentUtterance = utter;
            currentTtsIdx = idx;

            utter.onend = function() {
                resetTtsButton(idx);
                currentUtterance = null;
                currentTtsIdx = null;
            };

            utter.onerror = function() {
                resetTtsButton(idx);
                currentUtterance = null;
                currentTtsIdx = null;
            };

            window.speechSynthesis.speak(utter);
        }

        function stopSpeak() {
            if (window.speechSynthesis.speaking) {
                window.speechSynthesis.cancel();
            }
            if (currentTtsIdx !== null) {
                resetTtsButton(currentTtsIdx);
            }
            currentUtterance = null;
            currentTtsIdx = null;
        }

        function resetTtsButton(idx) {
            const btn = document.getElementById('tts-btn-' + idx);
            const status = document.getElementById('tts-status-' + idx);
            if (btn) {
                btn.classList.remove('playing');
                btn.querySelector('.icon').textContent = '🔊';
                btn.querySelector('.tts-label').textContent = '朗诵';
            }
            if (status) {
                status.classList.remove('active');
                status.querySelector('.tts-status-text').textContent = '就绪';
            }
        }

        function changeSpeed(idx, val) {
            if (currentTtsIdx === idx && window.speechSynthesis.speaking) {
                stopSpeak();
                setTimeout(() => speakPoem(idx), 100);
            }
        }

        function stopAllTts() {
            stopSpeak();
        }

        if (typeof speechSynthesis !== 'undefined') {
            speechSynthesis.onvoiceschanged = function() {};
        }

        // 初始化
        buildSidebar();
        renderContent(currentGrade, currentSemester);
    </script>
</body>
</html>
