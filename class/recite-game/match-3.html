            <div class="modal-icon">

                <button class="modal-btn modal-enter" onclick="enterGameWithoutSave()">不保存直接进入</button>
                <button class="modal-btn modal-cancel" onclick="closeUnsavedModal()">取消</button>
            </div>
        </div>
