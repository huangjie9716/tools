<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/webp" href="jzzxlogo.webp">
<title>珠海市九洲中学团委纪检管理系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f5f7fa;--card:#fff;--border:#e5e9f0;--border-soft:#eef1f6;
  --text:#1e293b;--dim:#64748b;--primary:#2563eb;
  --red:#ef4444;--red-bg:#fef2f2;--red-bd:#fecaca;
  --orange:#f97316;--orange-bg:#fff7ed;--orange-bd:#fed7aa;
  --green:#059669;--green-bg:#ecfdf5;--green-bd:#a7f3d0;
  --shadow:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;padding:18px 14px 40px}
.wrap{max-width:1320px;margin:0 auto}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
  gap:14px;padding:16px 20px;background:var(--card);border:1px solid var(--border);
  border-radius:14px;box-shadow:var(--shadow);margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:48px;height:48px;flex-shrink:0;object-fit:contain;display:block}
.brand h1{font-size:22px;font-weight:800;letter-spacing:.3px}
.tabs{display:flex;gap:4px;background:#f1f5f9;padding:4px;border-radius:40px}
.tabs button{border:none;background:transparent;color:var(--dim);font-family:inherit;
  font-size:14px;font-weight:600;padding:8px 20px;border-radius:30px;cursor:pointer;transition:.2s}
.tabs button:hover{color:var(--text);background:#e2e8f0}
.tabs button.active{background:var(--primary);color:#fff;box-shadow:0 2px 6px rgba(37,99,235,.28)}
.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--primary)}
.panel-head h2{font-size:17px;font-weight:700}
.panel-head .sub{font-size:13px;color:var(--dim);margin-left:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--border);background:#fff;color:var(--dim);
  font-size:13px;font-weight:500;padding:6px 13px;border-radius:14px;cursor:pointer;
  transition:.2s;font-family:inherit;white-space:nowrap}
.chips button:hover{color:var(--primary);border-color:#bfdbfe;background:#f0f7ff}
.chips button.active{background:var(--primary);color:#fff;border-color:var(--primary);
  box-shadow:0 2px 5px rgba(37,99,235,.25)}
.chips button.this-week::after{content:'本周';font-size:10px;line-height:1;margin-left:4px;
  padding:2px 4px;border-radius:6px;background:#dbeafe;color:var(--primary);vertical-align:2px}
.chips button.this-week.active::after{background:rgba(255,255,255,.25);color:#fff}
.chart-tools{display:flex;gap:6px;flex-wrap:wrap}
.tool-btn{border:1px solid var(--border);background:#fff;color:var(--dim);font-size:12px;
  font-weight:600;padding:5px 12px;border-radius:14px;cursor:pointer;font-family:inherit;transition:.2s}
.tool-btn:hover{color:var(--primary);border-color:#bfdbfe;background:#f0f7ff}
.tool-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;
  box-shadow:0 2px 5px rgba(37,99,235,.25)}
.top-banner{background:linear-gradient(135deg,#fffbeb,#fef3c7);border:1px solid #fcd34d;
  border-radius:14px;padding:18px 24px;margin-bottom:16px;display:flex;align-items:center;
  gap:16px;flex-wrap:wrap;box-shadow:0 2px 6px rgba(245,158,11,.08)}
.top-banner .crown{display:flex;align-items:center;justify-content:center;flex-shrink:0}
.top-banner .crown svg{width:52px;height:52px;display:block}
.top-banner .info{display:flex;flex-direction:column;gap:2px}
.top-banner .lbl{font-size:12px;color:#92400e;font-weight:500;letter-spacing:.5px}
.top-banner .val{font-size:22px;font-weight:800;color:#b45309}
.top-banner .score{margin-left:auto;font-size:28px;font-weight:800;color:#d97706}
.top-banner .score small{font-size:14px;font-weight:600;margin-left:2px}
.chart-box{position:relative;height:320px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.class-card{position:relative;background:#fff;border:1px solid var(--border);
  border-radius:12px;padding:12px 10px;cursor:pointer;transition:.2s;text-align:center}
.class-card:hover{border-color:#93c5fd;box-shadow:0 4px 12px rgba(37,99,235,.12);transform:translateY(-2px)}
.cc-name{font-size:12px;color:var(--dim);font-weight:600}
.cc-total{font-size:22px;font-weight:800;margin:4px 0}
.cc-total.up{color:var(--green)}
.cc-total.down{color:var(--orange)}
.cc-sub{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:4px}
.tag{font-size:10px;padding:2px 7px;border-radius:8px;font-weight:600;white-space:nowrap}
.tag.red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd)}
.tag.orange{background:var(--orange-bg);color:var(--orange);border:1px solid var(--orange-bd)}
.tag.green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd)}
.cc-empty{display:inline-block;font-size:10px;color:#94a3b8;
  background:#f1f5f9;padding:1px 7px;border-radius:8px;margin-bottom:5px}
.cc-empty svg{vertical-align:-1px;margin-right:3px}
.footer{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;
  padding:18px 0;font-size:15px;color:var(--dim)}
.footer a{color:var(--primary);text-decoration:none;font-weight:600;font-size:15px}
.footer a:hover{text-decoration:underline}
.footer .icon-sync{vertical-align:-2px;margin-right:6px}
/* ===== 登录 ===== */
.login-gate{position:fixed;inset:0;z-index:2000;padding:20px;
  background:linear-gradient(135deg,#eff6ff,#f8fafc 55%,#ecfdf5);
  display:flex;align-items:center;justify-content:center;overflow:auto}
.login-card{width:min(420px,100%);background:#fff;border:1px solid var(--border);
  border-radius:18px;padding:30px 26px 26px;box-shadow:0 20px 50px rgba(15,23,42,.12);text-align:center}
.login-logo{display:flex;justify-content:center;margin-bottom:12px}
.login-logo img{width:92px;height:92px;object-fit:contain;display:block}
.login-card h1{font-size:19px;font-weight:800;line-height:1.45;margin-bottom:20px}
.login-card .field{text-align:left;margin-bottom:12px}
.login-card label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;font-weight:500}
.login-card input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border);
  background:#fff;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:.2s}
.login-card input:hover{border-color:#93c5fd}
.login-card input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.login-card input::placeholder{color:#94a3b8}
.login-btn{width:100%;margin-top:6px;padding:12px;border:none;border-radius:12px;
  background:var(--primary);color:#fff;font-size:15px;font-weight:700;cursor:pointer;
  font-family:inherit;transition:background .2s}
.login-btn:hover{background:#1d4ed8}
.login-msg{margin-top:10px;font-size:13px;min-height:18px;color:var(--dim);line-height:1.5}
.login-msg.error{color:var(--red)}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;
  align-items:center;justify-content:center;z-index:1000;padding:18px}
.modal{width:min(680px,100%);max-height:86vh;overflow:auto;background:#fff;
  border-radius:16px;box-shadow:0 25px 60px rgba(15,23,42,.3)}
.modal-head{display:flex;align-items:center;justify-content:space-between;
  padding:16px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;
  background:#fff;z-index:2;border-radius:16px 16px 0 0}
.modal-head h3{font-size:16px;font-weight:700}
.modal-head button{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);
  background:#fff;color:var(--dim);font-size:18px;cursor:pointer;line-height:1;transition:.2s}
.modal-head button:hover{color:var(--red);border-color:var(--red-bd);background:var(--red-bg)}
.modal-body{padding:16px 22px 22px}
.day-block{margin-bottom:14px}
.day-title{font-size:13px;font-weight:700;padding-bottom:6px;margin-bottom:8px;
  border-bottom:1px solid var(--border-soft);display:flex;align-items:center;justify-content:space-between}
.day-title .day-sum{font-size:12px;color:var(--dim);font-weight:500}
.item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;
  margin-bottom:6px;font-size:13px}
.item.red{background:var(--red-bg);border:1px solid var(--red-bd)}
.item.orange{background:var(--orange-bg);border:1px solid var(--orange-bd)}
.item.green{background:var(--green-bg);border:1px solid var(--green-bd)}
.item .tag-lbl{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;
  flex-shrink:0;white-space:nowrap;background:#fff}
.item.red .tag-lbl{color:var(--red)}
.item.orange .tag-lbl{color:var(--orange)}
.item.green .tag-lbl{color:var(--green)}
.item .score{font-weight:800;font-size:14px;flex-shrink:0;min-width:38px;text-align:right}
.item.red .score{color:var(--red)}
.item.orange .score{color:var(--orange)}
.item.green .score{color:var(--green)}
.item .desc{color:var(--text);line-height:1.5;flex:1;word-break:break-word}
.item .desc.muted{color:#94a3b8;font-style:italic}
.day-empty{padding:10px 12px;background:#f8fafc;border:1px dashed var(--border);
  border-radius:9px;font-size:12px;color:var(--dim);text-align:center}
.modal-score{margin-top:14px;text-align:center;font-size:14px;padding:12px;
  border-radius:10px;background:#eff6ff;border:1px solid #bfdbfe;color:var(--primary);font-weight:600}
.modal-score b{font-size:18px;color:#1d4ed8}
/* ===== 平板 ===== */
@media (max-width:1024px){
  .wrap{max-width:100%}
  .brand h1{font-size:19px}
  .chart-box{height:290px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:9px}
  .top-banner .score{font-size:24px}
  .modal{width:min(620px,100%)}
}
/* ===== 手机 ===== */
@media (max-width:700px){
  body{padding:12px 10px 30px}
  .topbar{flex-direction:column;align-items:stretch;gap:10px;padding:12px 14px}
  .brand h1{font-size:16px}
  .brand .logo{width:36px;height:36px}
  .tabs{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px}
  .tabs button{padding:8px 14px;font-size:13px}
  .panel-head{gap:8px;margin-bottom:12px}
  .panel-head h2{font-size:16px}
  .panel-head .sub{margin-left:0;width:100%;font-size:12px}
  .chips button{font-size:12px;padding:5px 11px}
  .chart-tools{width:100%}
  .tool-btn{font-size:11px;padding:5px 10px}
  .chart-box{height:260px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(106px,1fr));gap:8px}
  .cc-total{font-size:18px}
  .cc-name{font-size:11px}
  .class-card{padding:10px 8px}
  .tag{font-size:9px;padding:2px 5px}
  .top-banner{padding:14px 16px;gap:12px;flex-direction:column;align-items:flex-start}
  .top-banner .val{font-size:18px}
  .top-banner .score{font-size:22px;margin-left:0}
  .top-banner .crown svg{width:38px;height:38px}
  .panel{padding:14px 12px}
  .footer{font-size:14px;gap:14px;padding:14px 0}
  .overlay{padding:10px}
  .modal{max-height:92vh;border-radius:14px}
  .modal-head{padding:13px 16px;border-radius:14px 14px 0 0}
  .modal-body{padding:12px 14px 16px}
  .item{flex-wrap:wrap;gap:8px;font-size:12.5px;padding:8px 10px}
  .item .desc{flex:1 1 100%}
  .day-title{font-size:13px}
  .modal-score{font-size:13px}
  .modal-score b{font-size:17px}
  .login-card{padding:26px 20px 22px}
}
/* ===== 小屏手机 ===== */
@media (max-width:420px){
  .brand h1{font-size:15px}
  .grid{grid-template-columns:repeat(3,1fr)}
  .cc-sub{gap:3px}
  .top-banner .score{font-size:20px}
}
</style>
</head>
<body>
<!-- 登录（需先登录才能查看数据） -->
<div class="login-gate" id="loginGate">
  <div class="login-card">
    <div class="login-logo"><img src="jzzxlogo.webp" alt="珠海市九洲中学团委纪检管理系统"></div>
    <h1>珠海市九洲中学团委纪检管理系统</h1>
    <div class="field">
      <label for="gateUser">账号</label>
      <input type="text" id="gateUser" placeholder="如：jzzxtw701（初一7班）" autocomplete="username">
    </div>
    <div class="field">
      <label for="gatePass">密码</label>
      <input type="password" id="gatePass" placeholder="请输入密码" autocomplete="current-password">
    </div>
    <button class="login-btn" id="gateBtn" type="button">登 录</button>
    <div class="login-msg" id="gateMsg"></div>
  </div>
</div>

<div class="wrap" id="appWrap" style="display:none">
  <header class="topbar">

      <div>
        <h1>珠海市九洲中学团委纪检管理系统</h1>
      </div>

    <div class="tabs" id="gradeTabs"></div>
  </header>

  <section class="panel">

  }

  function startApp(info) {
    user = info;
    if (user.grade) state.grade = user.grade;
    if (GRADES.indexOf(state.grade) < 0) state.grade = '初一';

    $('loginGate').style.display = 'none';
    $('appWrap').style.display = 'block';

    renderGradeTabs();
    renderWeekChips();
    loadWeek();
  }

  function renderGradeTabs() {
    var box = $('gradeTabs');
    box.innerHTML = '';
    GRADES.forEach(function (g) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = GRADE_LABEL[g];
      if (g === state.grade) b.classList.add('active');
      b.addEventListener('click', function () {
        state.grade = g;
        localStorage.setItem('jz_grade', g);
        renderGradeTabs();
        loadWeek();
      });
      box.appendChild(b);
    });
  }

  function renderWeekChips() {
    var box = $('weekChips');
    box.innerHTML = '';
    for (var i = 1; i <= WEEK_COUNT; i++) {
      (function (idx) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = '第' + idx + '周';
        if (idx === state.week) b.classList.add('active');
        /* 标记本周，便于一眼识别 */
        if (idx === THIS_WEEK) b.classList.add('this-week');
        b.addEventListener('click', function () {
          state.week = idx;
          renderWeekChips();
          loadWeek();
        });
        box.appendChild(b);
      })(i);
    }
    $('weekSub').textContent = '共 ' + WEEK_COUNT + ' 周 · 本周为第 ' + THIS_WEEK + ' 周';
  }

  function loadWeek() {
    setStatus('加载中…');
    sb.from(TABLE).select('*')
      .eq('grade', state.grade)
      .eq('week_index', state.week)
      .then(function (res) {
        if (res.error) {
          state.records = [];
          setStatus('⚠️ 加载失败：' + res.error.message);
        } else {
          state.records = res.data || [];
          if (state.records.length) {
            setStatus(ICON_SYNC + '已同步云端 · 本周共 ' + state.records.length + ' 条记录', true);
          } else {
            setStatus('本周暂无录入数据');
          }
        }
        renderAll();
      })
      .catch(function (e) {
        state.records = [];
        setStatus('⚠️ 加载失败：' + (e && e.message ? e.message : e));
        renderAll();
      });
  }

  function calcClass(no) {
    var inspect = 0, hygiene = 0, bonus = 0, days = 0;
    for (var i = 0; i < state.records.length; i++) {
      var r = state.records[i];
      if (Number(r.class_no) !== no) continue;
      inspect += Number(r.inspect_score) || 0;
      hygiene += Number(r.hygiene_score) || 0;
      bonus += Number(r.bonus_score) || 0;
      days++;
    }
    return {
      no: no,
      inspect: round2(inspect),
      hygiene: round2(hygiene),
      bonus: round2(bonus),
      total: round2(BASE - inspect - hygiene + bonus),
      days: days
    };
  }

  function buildList() {
    var list = [];
    for (var i = 1; i <= CLASS_COUNT; i++) list.push(calcClass(i));
    return list;
  }

  function renderTopBanner(list) {
    $('topLabel').textContent = '第' + state.week + '周最高分班级';

    /* 只统计本周有录入记录的班级，避免未录入的班级按 100 分误当第一名 */
    var scored = list.filter(function (x) { return x.days > 0; });
    if (!scored.length) {
      $('topClass').textContent = '本周暂无录入数据';
      $('topScore').textContent = '—';
      return;
    }

    var best = scored[0];
    for (var i = 1; i < scored.length; i++) {
      if (scored[i].total > best.total) best = scored[i];
    }
    $('topClass').textContent = classLabel(best.no);
    $('topScore').innerHTML = best.total.toFixed(1) + '<small>分</small>';
  }

  function renderChart(list) {
    var data = list.slice();
    /* 按分数排序（高→低），否则保持班级顺序 */
    if (sortByScore) {
      data.sort(function (a, b) { return (b.total - a.total) || (a.no - b.no); });
    }
    var labels = data.map(function (x) { return x.no + '班'; });
    var values = data.map(function (x) { return x.total; });
    var minV = Math.min.apply(null, values.concat([BASE]));

    /* 排名着色：名次越靠前颜色越亮，名次靠后越淡（同分同名次）
       未录入的班级固定 100 分，不参与排名，统一用淡灰
       第1名金、第2名深蓝、第3名亮蓝、其余淡蓝、未录入淡灰 */
    var ranked = data.filter(function (x) { return x.days > 0; }).slice();
    ranked.sort(function (a, b) { return (b.total - a.total) || (a.no - b.no); });
    var rankOf = {};
    var lastTotal = null, lastRank = 0;
    for (var r = 0; r < ranked.length; r++) {
      var rk = (lastTotal !== null && ranked[r].total === lastTotal) ? lastRank : r + 1;
      rankOf[ranked[r].no] = rk;
      lastTotal = ranked[r].total;
      lastRank = rk;
    }
    var RANK_COLORS = ['#f59e0b', '#2563eb', '#60a5fa', '#93c5fd'];
    var PLAIN_COLOR = '#cbd5e1';
    var bestIdx = -1;
    var colors = data.map(function (x, i) {
      var rk = rankOf[x.no];
      if (rk === 1 && bestIdx < 0) bestIdx = i;   /* 窄屏只标注第1名 */
      return rk ? RANK_COLORS[Math.min(rk, RANK_COLORS.length) - 1] : PLAIN_COLOR;
    });
    var dataset = {
      data: values,
      backgroundColor: colors,
      hoverBackgroundColor: '#6366f1',
      borderRadius: 6,
      barPercentage: 0.68,
      categoryPercentage: 0.84
    };

    var ctx = $('scoreChart').getContext('2d');
    if (chart) { chart.destroy(); chart = null; }

    /* 窄屏（手机）：柱子多、字号小，只标注最高分的数值，其余靠点按提示 */
    var narrow = (window.innerWidth || 1024) < 560;

    chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [dataset]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 22 } },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: 'rgba(15,23,42,.92)',
            titleColor: '#fff',
            bodyColor: '#cbd5e1',
            padding: 10,
            callbacks: {
              title: function (items) {
                return classLabel(items[0].label.replace('班', ''));
              },
              label: function (c) {
                var rk = rankOf[data[c.dataIndex].no];
                return '总分 ' + c.parsed.y.toFixed(2) + ' 分' +
                  (rk ? ' · 第' + rk + '名' : ' · 本周未录入');
              }
            }
          }
        },
        scales: {
          y: {
            min: Math.max(0, Math.floor((minV - 6) / 5) * 5),
            grid: { color: 'rgba(148,163,184,.15)' },
            ticks: { color: '#64748b', font: { size: narrow ? 10 : 11 } }
          },
          x: {
            grid: { display: false },
            ticks: {
              color: '#334155',
              maxRotation: narrow ? 60 : 0,
              font: { size: narrow ? 9 : 11, weight: '600' }
            }
          }
        },
        animation: { duration: 450 }
      },
      plugins: [{
        id: 'barValue',
        afterDatasetsDraw: function (c) {
          if (bestIdx < 0) return;
          var ctx2 = c.ctx;
          var values = c.data.datasets[0].data;
          c.getDatasetMeta(0).data.forEach(function (bar, i) {
            if (narrow && i !== bestIdx) return;
            ctx2.save();
            ctx2.textAlign = 'center';
            ctx2.textBaseline = 'bottom';
            ctx2.font = '700 11px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
            ctx2.fillStyle = '#2563eb';
            ctx2.fillText(values[i].toFixed(1), bar.x, bar.y - 5);
            ctx2.restore();
          });
        }
      }]
    });
  }

  function renderGrid(list) {
    var box = $('classGrid');
    box.innerHTML = '';
    list.forEach(function (item) {
      var card = document.createElement('div');
      card.className = 'class-card';
      var cls = item.total > BASE ? 'up' : (item.total < BASE ? 'down' : '');
      var html = '';
      if (!item.days) html += '<div class="cc-empty">' + ICON_WARN + '未录入</div>';
      html += '<div class="cc-name">' + classLabel(item.no) + '</div>';
      html += '<div class="cc-total ' + cls + '">' + item.total.toFixed(1) + '</div>';
      html += '<div class="cc-sub">' +
        '<span class="tag red">纪 -' + fmtNum(item.inspect) + '</span>' +
        '<span class="tag orange">卫 -' + fmtNum(item.hygiene) + '</span>' +
        '<span class="tag green">加 +' + fmtNum(item.bonus) + '</span>' +
        '</div>';
      card.innerHTML = html;
      card.addEventListener('click', function () { openModal(item.no); });
      box.appendChild(card);
    });
  }

  function openModal(no) {
    $('modalTitle').textContent =
      classLabel(no) + ' · 第' + state.week + '周 加减分明细';

    var tIns = 0, tHyg = 0, tBon = 0;
    var html = '';

    DAYS.forEach(function (dayName, idx) {
      var r = null;
      for (var i = 0; i < state.records.length; i++) {
        if (Number(state.records[i].class_no) === no &&
            Number(state.records[i].day_index) === idx) { r = state.records[i]; break; }
      }
      var ins = r ? (Number(r.inspect_score) || 0) : 0;
      var hyg = r ? (Number(r.hygiene_score) || 0) : 0;
      var bon = r ? (Number(r.bonus_score) || 0) : 0;
      var insN = r ? (r.inspect_note || '') : '';
      var hygN = r ? (r.hygiene_note || '') : '';
      var bonN = r ? (r.bonus_note || '') : '';
      if (r) { tIns += ins; tHyg += hyg; tBon += bon; }

      html += '<div class="day-block">';
      html += '<div class="day-title"><span>' + dayName + '</span>';
      if (r) {
        var daySum = BASE - ins - hyg + bon;
        html += '<span class="day-sum">当日得分 ' + daySum.toFixed(1) + '</span>';
      }
      html += '</div>';

      var hasContent = false;
      if (ins > 0) {
        hasContent = true;
        html += '<div class="item red"><span class="tag-lbl">纪检扣分</span>' +
          '<span class="score">-' + fmtNum(ins) + '</span>' +
          '<span class="desc' + (insN ? '' : ' muted') + '">' + (insN ? esc(insN) : '（未填写说明）') + '</span></div>';
      }
      if (hyg > 0) {
        hasContent = true;
        html += '<div class="item orange"><span class="tag-lbl">卫检扣分</span>' +
          '<span class="score">-' + fmtNum(hyg) + '</span>' +
          '<span class="desc' + (hygN ? '' : ' muted') + '">' + (hygN ? esc(hygN) : '（未填写说明）') + '</span></div>';
      }
      if (bon > 0) {
        hasContent = true;
        html += '<div class="item green"><span class="tag-lbl">加分</span>' +
          '<span class="score">+' + fmtNum(bon) + '</span>' +
          '<span class="desc' + (bonN ? '' : ' muted') + '">' + (bonN ? esc(bonN) : '（未填写说明）') + '</span></div>';
      }
      if (!hasContent) {
        html += '<div class="day-empty">— 当天暂无记录 —</div>';
      }
      html += '</div>';
    });

    var total = round2(BASE - tIns - tHyg + tBon);
    html += '<div class="modal-score">本周总分 = 100 − ' + fmtNum(tIns) + ' − ' + fmtNum(tHyg) +
      ' + ' + fmtNum(tBon) + ' = <b>' + total.toFixed(1) + '</b> 分</div>';

    $('modalBody').innerHTML = html;
    $('overlay').style.display = 'flex';
  }

  function closeModal() { $('overlay').style.display = 'none'; }

  function renderAll() {
    var list = buildList();
    $('chartTitle').textContent = GRADE_LABEL[state.grade] + ' · 第' + state.week + '周 各班级总分';
    renderTopBanner(list);
    renderChart(list);
    renderGrid(list);
  }

  $('modalX').addEventListener('click', closeModal);
  $('overlay').addEventListener('click', function (e) {
    if (e.target === $('overlay')) closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeModal();
  });

  /* ========== 启动 ========== */
  $('gateBtn').addEventListener('click', doLogin);
  $('gateUser').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  $('gatePass').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  $('logoutLink').addEventListener('click', function (e) {
    e.preventDefault();
    /* 结束登录态回到登录界面；保留 jz_saved_login，登录框会自动带出上次账号与密码 */
    try { sessionStorage.removeItem('jz_view_user'); } catch (err) { }
    try { sessionStorage.setItem('jz_logged_out', '1'); } catch (err) { }
    location.reload();
  });

  /* 图表工具：按分数排序 */
  function syncChartTools() {
    var s = $('sortBtn');
    s.textContent = sortByScore ? '恢复班级顺序' : '按分数排序';
    s.className = 'tool-btn' + (sortByScore ? ' active' : '');
  }

  $('sortBtn').addEventListener('click', function () {
    sortByScore = !sortByScore;
    syncChartTools();
    renderAll();
  });

  /* 导出图片：按当前排序方式（班级顺序 / 分数顺序）导出各班总分图 */
  function exportStamp() {
    var d = new Date();
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
      ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function exportChartImage() {
    var src = $('scoreChart');
    if (!chart || !src || !src.width || !src.height) {
      setStatus('图表尚未生成，无法导出，请稍后再试');
      return;
    }
    var dpr = window.devicePixelRatio || 1;
    var scale = Math.min(2, Math.max(1.5, dpr));
    var pad = 26, headH = 96;
    var w = src.clientWidth || 900;
    var h = src.clientHeight || 320;
    var FONT = ' -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';

    var cv = document.createElement('canvas');
    cv.width = Math.round((w + pad * 2) * scale);
    cv.height = Math.round((h + headH + pad) * scale);
    var g = cv.getContext('2d');
    g.scale(scale, scale);

    g.fillStyle = '#ffffff';
    g.fillRect(0, 0, w + pad * 2, h + headH + pad);

    /* 文字过宽时自动缩小字号，避免窄屏导出被截断 */
    function fitText(text, x, y, maxW, size, weight, color) {
      var s = size;
      do {
        g.font = weight + ' ' + s + 'px' + FONT;
        if (g.measureText(text).width <= maxW || s <= 9) break;
        s -= 0.5;
      } while (true);
      g.fillStyle = color;
      g.fillText(text, x, y);
    }

    var innerW = w;
    fitText(GRADE_LABEL[state.grade] + ' · 第' + state.week + '周 各班总分' +
      (sortByScore ? '（按分数排序）' : '（按班级顺序）'), pad, 34, innerW, 19, '800', '#1e293b');
    fitText('总分 = 100 − 纪检扣分 − 卫检扣分 + 加分', pad, 57, innerW, 12, '500', '#64748b');
    fitText('柱色越亮表示排名越靠前（未录入班级为淡灰色） · 导出时间 ' + exportStamp(),
      pad, 76, innerW, 12, '500', '#94a3b8');

    g.drawImage(src, pad, headH, w, h);

    var name = '九洲中学_' + GRADE_LABEL[state.grade] + '_第' + state.week + '周_各班总分_' +
      (sortByScore ? '按分数' : '按班级') + '.png';
    try {
      var a = document.createElement('a');
      a.download = name;
      a.href = cv.toDataURL('image/png');
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setStatus('已导出图片：' + name);
    } catch (e) {
      setStatus('导出失败：' + (e && e.message ? e.message : e));
    }
  }

  $('exportBtn').addEventListener('click', exportChartImage);

  /* 窗口尺寸变化（手机横竖屏切换等）：重绘图表以适配刻度字号 */
  var resizeTimer = null;
  window.addEventListener('resize', function () {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (chart) renderChart(buildList());
    }, 220);
  });

  syncChartTools();

  /* 登录态：
     1) 本次会话已登录（含从管理后台返回）→ 直接进看板；
     2) 上次登录过且未主动“退出登录” → 用记住的账号自动进看板；
     3) 其余情况显示登录界面，并自动带出上次的账号与密码，登录一次后无需再输入。 */
  var autoInfo = null;
  var loggedOut = false;
  var savedLogin = null;
  try { savedLogin = getSavedLogin(); } catch (e) { }
  try { loggedOut = sessionStorage.getItem('jz_logged_out') === '1'; } catch (e) { }
  try { autoInfo = parseAccount(sessionStorage.getItem('jz_view_user')); } catch (e) { }

  if (!autoInfo && !loggedOut && savedLogin && savedLogin.u && savedLogin.p === savedLogin.u) {
    autoInfo = parseAccount(savedLogin.u);
  }

  if (autoInfo) {
    startApp(autoInfo);
  } else {
    /* 回填上次的账号与密码 */
    if (savedLogin && savedLogin.u) {
      $('gateUser').value = savedLogin.u;
      $('gatePass').value = savedLogin.p || savedLogin.u;
    }
    $('gateBtn').focus();
  }
})();
</script>
</body>
</html>
