<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D球形环绕点名系统</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- XLSX -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">
    </script>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
        }
        body {
            background-color: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            user-select: none;
        }

        /* ===== 星空 ===== */
        #space {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            pointer-events: none;
        }
        .star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            animation: twinkle var(--dur, 3s) ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.15; transform: scale(0.8); }
            100% { opacity: 0.95; transform: scale(1.2); }
        }

        /* ===== 物理装饰（原子） ===== */
        #physicsElements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        .atom {
            position: absolute;
            width: 140px;
            height: 140px;
        }
        .nucleus {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            background: radial-gradient(circle, #ff4466, #cc1133);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px rgba(255, 68, 102, 0.7);
        }
        .orbit {
            position: absolute;
            border: 1px dashed rgba(77, 166, 255, 0.25);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .electron {
            position: absolute;
            width: 10px;
            height: 10px;
            background: radial-gradient(circle, #66ddff, #1a8cff);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            box-shadow: 0 0 12px rgba(77, 166, 255, 0.8);
            animation: orbit var(--orbit-dur, 6s) linear infinite;
        }
        @keyframes orbit {
            0% { transform: rotate(0deg) translateX(var(--radius)) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(var(--radius)) rotate(-360deg); }
        }

        /* ===== 标题 ===== */
        .header {
            text-align: center;
            padding: 18px 20px 12px;
            background: linear-gradient(to bottom, rgba(0, 20, 40, 0.92), transparent);
            z-index: 10;
            position: relative;
            pointer-events: none;
        }
        .header h1 {
            font-size: 2.6rem;
            color: #4da6ff;
            margin-bottom: 6px;
            text-shadow: 0 0 20px rgba(77, 166, 255, 0.6);
            letter-spacing: 2px;
        }
        .header h1 i {
            margin-right: 10px;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #88ccff;
            font-weight: 300;
            letter-spacing: 4px;
        }
        .subject {
            display: inline-block;
            background: rgba(77, 166, 255, 0.18);
            color: #4da6ff;
            padding: 4px 18px;
            border-radius: 20px;
            margin-top: 6px;
            border: 1px solid rgba(77, 166, 255, 0.4);
            font-size: 0.9rem;
            pointer-events: none;
        }

        /* ===== 速度指示器 ===== */
        .speed-indicator {
            position: absolute;
            top: 20px;
            right: 24px;
            background: rgba(0, 20, 40, 0.75);
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid rgba(77, 166, 255, 0.4);
            z-index: 20;
            font-size: 0.95rem;
            color: #4da6ff;
            backdrop-filter: blur(4px);
            pointer-events: none;
        }
        .speed-indicator i {
            margin-right: 6px;
        }

        /* ===== 3D球体 ===== */
        #sphere-container {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vmin;
            height: 100vmin;
            transform-style: preserve-3d;
            transform: translate(-50%, -50%);
            /* 旋转由动画循环每帧驱动，不能加 transition（会产生追帧滞后） */
            pointer-events: none;
            will-change: transform;
        }
        .name-item {
            position: absolute;
            top: 50%;
            left: 50%;
            color: #4da6ff;
            font-size: 1.6rem;
            font-weight: 700;
            text-shadow: 0 0 18px rgba(77, 166, 255, 0.7);
            transform-origin: 0 0;
            white-space: nowrap;
            transition: color 0.3s, font-weight 0.3s, text-shadow 0.3s;
            will-change: transform, opacity, font-size, filter;
            pointer-events: none;
        }

        /* ===== 选中名字大号显示 ===== */
        #selected-name {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0;
            color: #ffcc00;
            text-align: center;
            z-index: 30;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-shadow: 0 0 30px rgba(255, 204, 0, 0.9);
            background: rgba(0, 0, 0, 0.75);
            padding: 30px 50px;
            border-radius: 28px;
            border: 4px solid rgba(255, 204, 0, 0.6);
            animation: glow-pulse 2s ease-in-out infinite alternate;
            pointer-events: none;
            backdrop-filter: blur(8px);
            letter-spacing: 4px;
        }
        #selected-name.active {
            font-size: 4.8rem;
            font-weight: 900;
            opacity: 1;
            z-index: 40;
        }
        @keyframes glow-pulse {
            0% { box-shadow: 0 0 20px rgba(255, 204, 0, 0.4); }
            100% { box-shadow: 0 0 60px rgba(255, 204, 0, 0.9); }
        }

        /* ===== 底部控制栏 ===== */
        .controls {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 14px 20px;
            background: rgba(0, 10, 30, 0.88);
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            z-index: 100;
            border-top: 2px solid rgba(77, 166, 255, 0.25);
            backdrop-filter: blur(6px);
        }
        .control-btn {
            padding: 14px 28px;
            font-size: 1.05rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 600;
            transition: all 0.25s;
            min-width: 170px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            color: #fff;
        }
        .control-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.7);
        }
        .control-btn:active {
            transform: translateY(-1px);
        }
        .control-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        .upload-btn {
            background: linear-gradient(135deg, #0066cc, #0099ff);
        }
        .start-btn {
            background: linear-gradient(135deg, #00b84c, #00e676);
        }
        .stop-btn {
            background: linear-gradient(135deg, #e53935, #ff6b6b);
        }

        /* ===== 上传弹窗 ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: rgba(0, 20, 50, 0.95);
            padding: 40px 48px;
            border-radius: 24px;
            text-align: center;
            max-width: 460px;
            width: 90%;
            border: 2px solid rgba(77, 166, 255, 0.4);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            position: relative;
            animation: modal-in 0.35s ease;
        }
        @keyframes modal-in {
            0% { transform: scale(0.9) translateY(30px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .modal-box .close-btn {
            position: absolute;
            top: 14px;
            right: 20px;
            font-size: 1.8rem;
            color: #ff6b6b;
            cursor: pointer;
            transition: transform 0.2s;
            background: none;
            border: none;
        }
        .modal-box .close-btn:hover {
            transform: rotate(90deg);
        }
        .modal-box .icon-big {
            font-size: 3.6rem;
            color: #4da6ff;
            margin-bottom: 12px;
        }
        .modal-box h2 {
            color: #fff;
            margin-bottom: 8px;
            font-size: 1.6rem;
        }
        .modal-box p {
            color: #aaccee;
            font-size: 0.95rem;
            margin: 4px 0;
        }
        .modal-box .file-label {
            display: inline-block;
            margin: 18px 0 12px;
            padding: 14px 32px;
            background: linear-gradient(135deg, #0066cc, #0099ff);
            color: #fff;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
            transition: background 0.3s;
        }
        .modal-box .file-label:hover {
            background: linear-gradient(135deg, #0077ee, #33aaff);
        }
        .modal-box .file-input {
            display: none;
        }
        .modal-box .file-info {
            margin-top: 10px;
            color: #88ccff;
            font-size: 0.95rem;
            min-height: 28px;
        }
        .modal-box .hint {
            margin-top: 14px;
            color: #ffcc66;
            font-size: 0.9rem;
        }
        .modal-box .hint i {
            margin-right: 6px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 1000px) {
            .control-btn {
                min-width: 150px;
                padding: 12px 20px;
                font-size: 0.95rem;
            }
            .header h1 {
                font-size: 2.0rem;
            }
            #selected-name.active {
                font-size: 3.6rem;
                padding: 24px 36px;
            }
            .modal-box {
                padding: 30px 28px;
            }
        }
        @media (max-width: 640px) {
            .controls {
                flex-direction: column;
                align-items: center;
                gap: 8px;
                padding: 12px 16px;
            }
            .control-btn {
                width: 92%;
                min-width: unset;
                padding: 12px 16px;
                font-size: 0.9rem;
            }
            .header h1 {
                font-size: 1.5rem;
            }
            .header .subtitle {
                font-size: 0.85rem;
            }
            .speed-indicator {
                top: 12px;
                right: 12px;
                font-size: 0.8rem;
                padding: 4px 12px;
            }
            #selected-name.active {
                font-size: 2.4rem;
                padding: 18px 22px;
                border-width: 3px;
            }
            .modal-box {
                padding: 24px 18px;
            }
            .modal-box h2 {
                font-size: 1.3rem;
            }
        }
        @media (max-width: 420px) {
            #selected-name.active {
                font-size: 1.8rem;
                padding: 14px 16px;
            }
            .header h1 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 星空 ===== -->
    <div id="space"></div>

    <!-- ===== 物理装饰 ===== -->
    <div id="physicsElements"></div>

    <!-- ===== 标题 ===== -->
    <div class="header">
        <h1><i class="fas fa-atom"></i> 3D球形环绕点名系统</h1>
        <p class="subtitle">公平 · 有趣 · 高效</p>
        <div class="subject"><i class="fas fa-chalkboard-teacher"></i> 课堂互动专用工具</div>
    </div>

    <!-- ===== 速度指示器 ===== -->
    <div class="speed-indicator">
        <i class="fas fa-tachometer-alt"></i> 速度: <span id="speed-value">0</span> 级
    </div>

    <!-- ===== 3D球体 ===== -->
    <div id="sphere-container"></div>

    <!-- ===== 选中名字 ===== -->
    <div id="selected-name"></div>

    <!-- ===== 底部控制栏 ===== -->
    <div class="controls">
        <button class="control-btn upload-btn" id="uploadBtn">
            <i class="fas fa-file-upload"></i> 上传名单
        </button>
        <button class="control-btn start-btn" id="startBtn">
            <i class="fas fa-play-circle"></i> 开始抽签
        </button>
        <button class="control-btn stop-btn" id="stopBtn" disabled>
            <i class="fas fa-stop-circle"></i> 停止
        </button>
    </div>

    <!-- ===== 上传名单弹窗 ===== -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal-box">
            <button class="close-btn" id="closeUploadModal"><i class="fas fa-times"></i></button>
            <div class="icon-big"><i class="fas fa-file-excel"></i></div>
            <h2>上传学生名单</h2>
            <p>支持 .xlsx / .xls 格式</p>
            <p>请确保第一列为学生姓名</p>
            <input type="file" id="fileInput" class="file-input" accept=".xlsx,.xls" />
            <label for="fileInput" class="file-label"><i class="fas fa-cloud-upload-alt"></i> 选择Excel文件</label>
            <div class="file-info" id="fileInfo">尚未选择文件</div>
            <div class="hint"><i class="fas fa-lightbulb"></i> 也可直接点击「开始抽签」使用示例名单</div>
        </div>
    </div>

    <!-- ===== 音频元素 ===== -->
    <!-- 抽签背景音（循环播放，点击"开始抽签"时触发） -->
    <audio id="bgmDraw" loop preload="auto">
        <!-- ⬇️ 请替换为您的抽签背景音乐链接 -->
        <source src="https://pub-3827e3697a0b44428ab555d41c8d38f3.r2.dev/rollback/%E7%82%B9%E5%90%8D%E8%83%8C%E6%99%AF%E9%9F%B3.mp3" type="audio/mpeg" />
    </audio>
    <!-- 选中音效（播放一次，点击"停止"时触发） -->
    <audio id="selectSound" preload="auto">
        <!-- ⬇️ 请替换为您的选中特效音链接 -->
        <source src="https://pub-3827e3697a0b44428ab555d41c8d38f3.r2.dev/rollback/%E6%88%90%E5%8A%9F%E9%80%89%E4%B8%AD.mp3" type="audio/mpeg" />
    </audio>

    <!-- ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ============================================================
            //  1. 状态变量
            // ============================================================
            let students = [];
            let selectedIndices = new Set(); // 已抽中学生的下标（用 Set，避免 O(n²) 的 includes 查找，且支持重名）
            let isRunning = false;
            let sphereRadius = 250;
            let rotX = 0;
            let rotY = 0;
            let rotationSpeed = 0.01;
            let currentSpeedLevel = 0;
            let animId = null;
            let speedUpInterval = null;
            let nameElements = [];
            let spherePoints = []; // buildSphere 时固定的 3D 坐标，动画每帧直接复用，避免重复三角函数计算

            // ============================================================
            //  2. DOM 引用
            // ============================================================
            const space = document.getElementById('space');
            const sphere = document.getElementById('sphere-container');
            const selectedNameEl = document.getElementById('selected-name');
            const uploadModal = document.getElementById('uploadModal');
            const fileInput = document.getElementById('fileInput');
            const fileInfo = document.getElementById('fileInfo');
            const uploadBtn = document.getElementById('uploadBtn');
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');
            const speedSpan = document.getElementById('speed-value');
            const physicsEl = document.getElementById('physicsElements');

            // 音频元素
            const bgmDraw = document.getElementById('bgmDraw'); // 抽签背景音（循环）
            const selectSound = document.getElementById('selectSound'); // 选中音效（一次）

            // localStorage 键名
            const STORAGE_KEY = 'savedStudentList';

            // ============================================================
            //  3. 星空
            // ============================================================
            function createStars() {
                const count = 280;
                for (let i = 0; i < count; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    const x = Math.random() * 100;
                    const y = Math.random() * 100;
                    const size = 0.5 + Math.random() * 3.5;
                    const dur = 1.8 + Math.random() * 3.2;
                    star.style.cssText =
                        `left:${x}%; top:${y}%; width:${size}px; height:${size}px; --dur:${dur}s; animation-delay:${Math.random()*3}s; opacity:${0.2+Math.random()*0.7};`;
                    space.appendChild(star);
                }
            }

            // ============================================================
            //  4. 原子装饰
            // ============================================================
            function createAtoms() {
                const positions = [
                    { x: 12, y: 18 }, { x: 85, y: 12 }, { x: 78, y: 78 },
                    { x: 8, y: 82 }, { x: 50, y: 92 }, { x: 92, y: 50 }
                ];
                positions.forEach(pos => {
                    const atom = document.createElement('div');
                    atom.className = 'atom';
                    atom.style.left = pos.x + '%';
                    atom.style.top = pos.y + '%';
                    atom.style.width = '120px';
                    atom.style.height = '120px';

                    const nucleus = document.createElement('div');
                    nucleus.className = 'nucleus';
                    atom.appendChild(nucleus);

                    const orbitCount = 2 + Math.floor(Math.random() * 3);
                    for (let o = 0; o < orbitCount; o++) {
                        const radius = 20 + o * 22;
                        const orbit = document.createElement('div');
                        orbit.className = 'orbit';
                        orbit.style.width = (radius * 2) + 'px';
                        orbit.style.height = (radius * 2) + 'px';
                        atom.appendChild(orbit);

                        const electronCount = 2 + Math.floor(Math.random() * 2);
                        for (let e = 0; e < electronCount; e++) {
                            const el = document.createElement('div');
                            el.className = 'electron';
                            const angle = (Math.PI * 2 / electronCount) * e;
                            const dur = 4 + Math.random() * 4;
                            el.style.setProperty('--radius', radius + 'px');
                            el.style.setProperty('--orbit-dur', dur + 's');
                            el.style.animationDelay = (Math.random() * 2) + 's';
                            const ix = Math.cos(angle) * radius;
                            const iy = Math.sin(angle) * radius;
                            el.style.transform = 'translate(calc(-50% + ' + ix + 'px), calc(-50% + ' + iy + 'px))';
                            atom.appendChild(el);
                        }
                    }
                    physicsEl.appendChild(atom);
                });
            }

            // ============================================================
            //  5. 示例名单
            // ============================================================
            const SAMPLE_NAMES = [
                '李明', '王芳', '张伟', '刘洋', '陈静',
                '赵磊', '孙悦', '周涛', '吴昊', '郑洁',
                '马超', '朱琳', '胡军', '林峰', '何佳',
                '高翔', '罗敏', '梁爽', '宋佳', '谢明',
                '黄涛', '杨光', '刘欣', '周杰', '吴梦',
                '郑凯', '王磊', '赵敏', '孙伟', '陈飞'
            ];

            function useSampleStudents() {
                students = SAMPLE_NAMES.slice();
                selectedIndices = new Set();
                startBtn.disabled = false;
                buildSphere();
            }

            // ============================================================
            //  6. 构建球体
            // ============================================================
            function buildSphere() {
                sphere.innerHTML = '';
                nameElements = [];
                spherePoints = [];
                if (!students.length) return;

                const total = students.length;
                const phi = Math.PI * (3 - Math.sqrt(5));

                for (let i = 0; i < total; i++) {
                    const y = 1 - (i / (total - 1)) * 2;
                    const radiusAtY = Math.sqrt(1 - y * y) * sphereRadius;
                    const theta = phi * i;
                    const x = Math.cos(theta) * radiusAtY;
                    const z = Math.sin(theta) * radiusAtY;
                    const yPos = y * sphereRadius;
                    // 固定坐标只算一次，动画循环里直接复用
                    spherePoints.push({ x, y: yPos, z });

                    const el = document.createElement('div');
                    el.className = 'name-item';
                    el.textContent = students[i];
                    el.dataset.index = i;
                    el.style.transform = `translate3d(${x}px, ${yPos}px, ${z}px)`;
                    const normZ = (z + sphereRadius) / (2 * sphereRadius);
                    el.style.opacity = 0.5 + normZ * 0.5;
                    el.style.fontSize = `${(1.4 + normZ * 1.2)}rem`;
                    el.style.filter = `brightness(${0.65 + normZ * 0.6})`;
                    sphere.appendChild(el);
                    nameElements.push(el);
                }
            }

            // ============================================================
            //  7. 动画循环
            // ============================================================
            function animateSphere() {
                if (!isRunning) return;

                rotX += rotationSpeed;
                rotY += rotationSpeed * 0.7;

                // 只旋转容器这一个元素（GPU 合成加速）。
                // 绕 Y 轴乘 3.5 倍，等效于原来“容器旋转 + 每个名字再绕自身 Y 轴快速旋转”的叠加效果。
                const totalRotY = rotY * 3.5;
                sphere.style.transform = `translate(-50%, -50%) rotateX(${rotX}rad) rotateY(${totalRotY}rad)`;

                // 名字坐标已在 buildSphere 固定，这里仅用旋转后的深度 z 更新视觉层级，
                // 不再逐元素改写 transform，避免每帧触发布局重排。
                const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
                const cosY = Math.cos(totalRotY), sinY = Math.sin(totalRotY);
                const total = spherePoints.length;
                for (let i = 0; i < total; i++) {
                    const el = nameElements[i];
                    if (!el) continue;
                    const p = spherePoints[i];
                    const z2 = -p.x * sinY + p.z * cosY; // rotateY(totalRotY) 后的 z
                    const z3 = p.y * sinX + z2 * cosX;   // rotateX(rotX) 后的 z
                    const normZ = (z3 + sphereRadius) / (2 * sphereRadius);
                    el.style.opacity = 0.4 + normZ * 0.6;
                    el.style.fontSize = `${(1.3 + normZ * 1.4)}rem`;
                    el.style.filter = `brightness(${0.6 + normZ * 0.6})`;
                }

                animId = requestAnimationFrame(animateSphere);
            }

            // ============================================================
            //  8. 开始抽签（播放抽签背景音）
            // ============================================================
            function startSelection() {
                if (!students.length) {
                    alert('请先上传学生名单！');
                    return;
                }
                if (selectedIndices.size >= students.length) {
                    alert('所有学生都已被抽中！请上传新名单或重置系统。');
                    return;
                }

                isRunning = true;
                rotationSpeed = 0.012;
                currentSpeedLevel = 1;
                speedSpan.textContent = currentSpeedLevel;

                selectedNameEl.classList.remove('active');
                selectedNameEl.textContent = '';

                startBtn.disabled = true;
                stopBtn.disabled = false;
                uploadBtn.disabled = true;

                // ---- 播放抽签背景音（循环） ----
                bgmDraw.currentTime = 0;
                bgmDraw.play().catch(function(e) {
                    // 自动播放被浏览器阻止时静默处理
                    console.warn('抽签背景音播放被阻止:', e);
                });

                // 爆炸散开效果
                const els = nameElements;
                const w = window.innerWidth;
                const h = window.innerHeight;
                for (let i = 0; i < els.length; i++) {
                    const el = els[i];
                    const x = (Math.random() - 0.5) * w * 1.6;
                    const y = (Math.random() - 0.5) * h * 1.6;
                    const z = (Math.random() - 0.5) * 600;
                    el.style.transition = 'all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1)';
                    el.style.transform = `translate3d(${x}px, ${y}px, ${z}px)`;
                    el.style.opacity = '1';
                    el.style.fontSize = '2.2rem';
                }

                setTimeout(function() {
                    buildSphere();
                    // buildSphere 已重新生成 nameElements / spherePoints，无需再手动查询 DOM
                    animateSphere();

                    if (speedUpInterval) clearInterval(speedUpInterval);
                    speedUpInterval = setInterval(function() {
                        if (rotationSpeed < 0.065) {
                            rotationSpeed += 0.002;
                            currentSpeedLevel = Math.floor(rotationSpeed * 100);
                            speedSpan.textContent = currentSpeedLevel;
                        } else {
                            clearInterval(speedUpInterval);
                            speedUpInterval = null;
                        }
                    }, 180);
                }, 800);
            }

            // ============================================================
            //  9. 停止抽签（停止背景音，播放选中音效）
            // ============================================================
            function stopSelection() {
                if (!isRunning) return;

                isRunning = false;
                if (animId) {
                    cancelAnimationFrame(animId);
                    animId = null;
                }
                if (speedUpInterval) {
                    clearInterval(speedUpInterval);
                    speedUpInterval = null;
                }

                startBtn.disabled = false;
                stopBtn.disabled = true;
                uploadBtn.disabled = false;

                // ---- 停止抽签背景音 ----
                bgmDraw.pause();
                bgmDraw.currentTime = 0;

                // 从剩余学生中随机选一个（按下标记录已抽中，重名学生也能正确区分）
                const remaining = students
                    .map((name, index) => ({ name, index }))
                    .filter(o => !selectedIndices.has(o.index));
                if (!remaining.length) {
                    alert('所有学生都已被抽中！');
                    return;
                }
                const pick = remaining[Math.floor(Math.random() * remaining.length)];
                const chosen = pick.name;
                selectedIndices.add(pick.index);

                // ---- 播放选中音效（一次） ----
                selectSound.currentTime = 0;
                selectSound.play().catch(function(e) {
                    console.warn('选中音效播放被阻止:', e);
                });

                // 显示选中名字
                selectedNameEl.textContent = chosen;
                selectedNameEl.classList.add('active');

                // 高亮选中的名字
                const els = document.querySelectorAll('.name-item');
                for (let i = 0; i < els.length; i++) {
                    const el = els[i];
                    if (el.textContent === chosen) {
                        el.style.color = '#ffcc00';
                        el.style.fontWeight = '900';
                        el.style.fontSize = '3.0rem';
                        el.style.textShadow = '0 0 40px rgba(255,204,0,1)';
                        el.style.zIndex = '100';
                    } else {
                        el.style.opacity = '0.15';
                    }
                }

                speedSpan.textContent = '0';
            }

            // ============================================================
            //  10. 文件上传 + localStorage 存储
            // ============================================================
            function handleFileUpload(e) {
                const file = e.target.files[0];
                if (!file) return;

                const ext = file.name.split('.').pop().toLowerCase();
                if (ext !== 'xlsx' && ext !== 'xls') {
                    alert('请上传 .xlsx 或 .xls 格式的 Excel 文件！');
                    return;
                }

                fileInfo.innerHTML = `<i class="fas fa-file-excel"></i> 已选择: ${file.name}`;

                const reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        const data = new Uint8Array(ev.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const json = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

                        const names = [];
                        for (let r = 0; r < json.length; r++) {
                            const row = json[r];
                            if (row && row[0] && typeof row[0] === 'string' && row[0].trim()) {
                                names.push(row[0].trim());
                            }
                        }
                        if (names.length && ['姓名', '名字', '学生姓名', 'name', 'Name'].includes(names[0])) {
                            names.shift();
                        }
                        if (!names.length) {
                            alert('文件中未找到学生姓名，请检查格式。');
                            return;
                        }

                        // 更新内存
                        students = names;
                        selectedIndices = new Set();

                        // ---- 存储到 localStorage ----
                        try {
                            localStorage.setItem(STORAGE_KEY, JSON.stringify(students));
                        } catch (err) {
                            console.warn('存储名单到 localStorage 失败:', err);
                        }

                        startBtn.disabled = false;
                        uploadModal.classList.remove('active');
                        buildSphere();
                        alert(`✅ 成功导入 ${students.length} 名学生！`);
                    } catch (err) {
                        alert('读取文件失败：' + err.message);
                    }
                };
                reader.readAsArrayBuffer(file);
            }

            // ============================================================
            //  11. 从 localStorage 加载名单
            // ============================================================
            function loadSavedList() {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (!saved) return false;
                    const parsed = JSON.parse(saved);
                    if (!Array.isArray(parsed) || parsed.length === 0) return false;
                    return parsed;
                } catch (e) {
                    return false;
                }
            }

            // ============================================================
            //  12. 弹窗控制
            // ============================================================
            function openUploadModal() { uploadModal.classList.add('active'); }

            function closeUploadModal() { uploadModal.classList.remove('active'); }

            // ============================================================
            //  13. 事件绑定
            // ============================================================
            uploadBtn.addEventListener('click', openUploadModal);
            document.getElementById('closeUploadModal').addEventListener('click', closeUploadModal);
            uploadModal.addEventListener('click', function(e) {
                if (e.target === uploadModal) closeUploadModal();
            });

            fileInput.addEventListener('change', handleFileUpload);

            startBtn.addEventListener('click', startSelection);
            stopBtn.addEventListener('click', stopSelection);

            // ============================================================
            //  14. 窗口尺寸变化
            // ============================================================
            let resizeTimer = null;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(function() {
                    if (!isRunning && students.length) {
                        buildSphere();
                    }
                }, 400);
            });

            // ============================================================
            //  15. 初始化
            // ============================================================
            function init() {
                createStars();
                createAtoms();

                // ---- 检查是否有已存储的名单 ----
                const savedList = loadSavedList();
                if (savedList && savedList.length > 0) {
                    const useSaved = confirm(
                        `📋 检测到已存储的学生名单（${savedList.length} 人），是否直接使用？\n\n点击「确定」使用已存储名单\n点击「取消」使用示例名单`
                        );
                    if (useSaved) {
                        students = savedList;
                        selectedIndices = new Set();
                        startBtn.disabled = false;
                        buildSphere();
                        console.log('📂 已加载存储的名单:', students.length, '人');
                        return;
                    }
                }

                // 没有存储的名单，或用户取消 → 使用示例名单
                useSampleStudents();
                console.log('📋 使用示例名单:', students.length, '人');
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

</body>
</html>
