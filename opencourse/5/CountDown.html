<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>课堂计时器｜公开课倒计时</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f172a;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        /* ===== 计时器容器 —— 铺满全屏 ===== */
        .timer-wrapper {
            width: 100vw;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #f8fafc;
            padding: 20px 30px 28px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: none;
            border-radius: 0;
            transition: none;
        }

        /* ===== 全屏模式（使用 Fullscreen API） ===== */
        .timer-wrapper.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            padding: 20px 30px;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            border-radius: 0;
        }

        .timer-wrapper.fullscreen .time-display {
            font-size: 50vh;
        }

        .timer-wrapper.fullscreen .presets,
        .timer-wrapper.fullscreen .sound-control,
        .timer-wrapper.fullscreen .custom-input-group {
            display: none !important;
        }

        .timer-wrapper.fullscreen .control-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            width: auto;
            justify-content: flex-end;
            padding: 0;
        }

        .timer-wrapper.fullscreen .action-bar {
            position: absolute;
            bottom: 10vh;
            width: 100%;
            justify-content: center;
        }

        .timer-wrapper.fullscreen .timer-main {
            flex: 0 1 auto;
            width: 100%;
        }

        /* ===== 控制栏 ===== */
        .control-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px 16px;
            margin-bottom: 18px;
            z-index: 10;
            flex-shrink: 0;
        }

        .presets {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .presets .label {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-right: 4px;
            font-weight: 500;
        }

        .presets .btn-preset {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #cbd5e1;
            padding: 4px 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .presets .btn-preset:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .presets .btn-preset.active {
            background: #3b82f6;
            border-color: #3b82f6;
            color: #fff;
            box-shadow: 0 0 16px rgba(59, 130, 246, 0.45);
        }

        .actions-right {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .sound-control {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .sound-control .switch-label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            user-select: none;
            transition: color 0.2s;
        }

        .sound-control .switch-label:hover {
            color: #e2e8f0;
        }

        .sound-control input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #3b82f6;
            cursor: pointer;
            flex-shrink: 0;
        }

        .btn-icon {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.95rem;
            padding: 6px 10px;
            border-radius: 6px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 500;
        }

        .btn-icon:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-small {
            padding: 2px 12px;
            font-size: 0.8rem;
            border-radius: 6px;
            border: 1px solid #475569;
            background: transparent;
            color: #cbd5e1;
            cursor: pointer;
            transition: all 0.2s;
            height: 28px;
        }

        .btn-small:hover {
            background: #334155;
            border-color: #64748b;
        }

        /* ===== 计时器主体 —— 占满剩余空间 ===== */
        .timer-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            width: 100%;
            min-height: 0; /* 防止溢出 */
        }

        .timer-circle {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ===== 时间数字 —— 加大铺满 ===== */
        .time-display {
            font-size: clamp(120px, 35vh, 350px);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            line-height: 1.1;
            background: linear-gradient(to bottom, #f8fafc, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: font-size 0.3s;
            letter-spacing: 2px;
            width: 100%;
            text-align: center;
        }

        /* 大屏限制最大尺寸 */
        @media (min-width: 1400px) {
            .time-display {
                font-size: 280px;
            }
        }

        .status-text {
            font-size: 1.6rem;
            color: #64748b;
            margin-top: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
            transition: color 0.4s;
        }

        .timer-circle.running .time-display {
            background: linear-gradient(to bottom, #ffffff, #e2e8f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .timer-circle.finished .time-display {
            background: linear-gradient(to bottom, #ef4444, #f87171);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: pulseText 0.6s infinite alternate;
        }

        .timer-circle.finished .status-text {
            color: #ef4444;
        }

        .timer-circle.ringing .time-display {
            animation: pulseText 0.5s infinite alternate;
            background: linear-gradient(to bottom, #ef4444, #ff0000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @keyframes pulseText {
            0% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 0.5;
                transform: scale(0.97);
            }
        }

        /* ===== 进度条 ===== */
        .progress-container {
            width: 80%;
            max-width: 700px;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            margin-top: 20px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .progress-container .progress-bar {
            height: 100%;
            background: #3b82f6;
            width: 0%;
            transition: width 0.8s linear;
            border-radius: 4px;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
        }

        .progress-container .progress-bar.warning {
            background: #f59e0b;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.5);
        }

        .progress-container .progress-bar.danger {
            background: #ef4444;
            box-shadow: 0 0 16px rgba(239, 68, 68, 0.6);
            animation: pulseBar 0.6s infinite alternate;
        }

        @keyframes pulseBar {
            0% {
                opacity: 1;
            }
            100% {
                opacity: 0.4;
            }
        }

        /* ===== 操作栏 ===== */
        .action-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            margin-top: 24px;
            z-index: 10;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .custom-input-group {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px 4px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            gap: 6px;
        }

        .custom-input-group .input-custom {
            background: transparent;
            border: none;
            color: #fff;
            width: 70px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 6px 0;
            outline: none;
        }

        .custom-input-group .input-custom::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }
        .custom-input-group .input-custom[type="number"] {
            -moz-appearance: textfield;
        }

        .custom-input-group .unit {
            color: #64748b;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .custom-input-group .btn-set {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #cbd5e1;
            padding: 4px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
            height: 32px;
        }

        .custom-input-group .btn-set:hover {
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
        }

        .main-controls {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .main-controls button {
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            font-weight: 600;
            border-radius: 50px;
            font-size: 1rem;
        }

        .main-controls button:active {
            transform: scale(0.95);
        }

        .main-controls .btn-main {
            padding: 14px 42px;
            min-width: 150px;
            font-size: 1.2rem;
            border-radius: 50px;
        }

        .main-controls .btn-main.btn-start {
            background: #3b82f6;
            color: #fff;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4);
        }

        .main-controls .btn-main.btn-start:hover {
            background: #2563eb;
            box-shadow: 0 4px 28px rgba(59, 130, 246, 0.6);
        }

        .main-controls .btn-main.btn-pause {
            background: #f59e0b;
            color: #fff;
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.35);
        }

        .main-controls .btn-main.btn-pause:hover {
            background: #d97706;
        }

        .main-controls .btn-main.btn-stop-alarm {
            background: #ef4444;
            color: #fff;
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.5);
            animation: pulseBtn 1s infinite;
        }

        .main-controls .btn-main.btn-stop-alarm:hover {
            background: #dc2626;
        }

        @keyframes pulseBtn {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.04);
            }
        }

        .main-controls .btn-reset {
            padding: 14px 28px;
            background: rgba(255, 255, 255, 0.07);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-weight: 500;
        }

        .main-controls .btn-reset:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        /* ===== 响应式适配 ===== */
        @media (max-width: 700px) {
            .timer-wrapper {
                padding: 16px 18px 20px;
            }

            .time-display {
                font-size: clamp(80px, 22vh, 160px);
            }

            .timer-wrapper.fullscreen .time-display {
                font-size: 40vh;
            }

            .presets .btn-preset {
                padding: 3px 10px;
                font-size: 0.75rem;
            }

            .control-bar {
                gap: 8px;
            }

            .actions-right {
                gap: 8px;
            }

            .main-controls .btn-main {
                padding: 12px 28px;
                min-width: 110px;
                font-size: 1rem;
            }

            .main-controls .btn-reset {
                padding: 12px 22px;
                font-size: 0.9rem;
            }

            .custom-input-group .input-custom {
                width: 55px;
                font-size: 1rem;
            }

            .action-bar {
                gap: 14px;
                margin-top: 16px;
            }

            .status-text {
                font-size: 1.2rem;
            }

            .progress-container {
                width: 90%;
                max-width: 90%;
            }

            .timer-wrapper.fullscreen .action-bar {
                bottom: 6vh;
            }

            .timer-wrapper.fullscreen .control-bar {
                top: 12px;
                right: 12px;
            }
        }

        @media (max-width: 480px) {
            .time-display {
                font-size: clamp(60px, 16vh, 110px);
            }
            .timer-wrapper.fullscreen .time-display {
                font-size: 30vh;
            }
            .presets .label {
                font-size: 0.75rem;
            }
            .presets .btn-preset {
                padding: 2px 8px;
                font-size: 0.7rem;
            }
            .main-controls .btn-main {
                padding: 10px 20px;
                min-width: 80px;
                font-size: 0.9rem;
            }
        }

        /* ===== 工具类 ===== */
        .hidden {
            display: none !important;
        }

        /* 音效复选框美化 */
        .sound-control input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin: 0;
        }

        /* 防止全屏时滚动 */
        .no-scroll {
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div class="timer-wrapper" id="app">
        <!-- ===== 控制栏 ===== -->
        <div class="control-bar">
            <div class="presets">
                <span class="label">⏱ 快速</span>
                <button class="btn-preset" data-minutes="1">1分</button>
                <button class="btn-preset" data-minutes="3">3分</button>
                <button class="btn-preset" data-minutes="5">5分</button>
                <button class="btn-preset" data-minutes="10">10分</button>
                <button class="btn-preset" data-minutes="15">15分</button>
                <button class="btn-preset" data-minutes="30">30分</button>
                <button class="btn-preset" data-minutes="45">45分</button>
                <button class="btn-preset active" data-minutes="60">60分</button>
            </div>
            <div class="actions-right">
                <div class="sound-control">
                    <label class="switch-label">
                        <input type="checkbox" id="soundToggle" checked />
                        <span class="switch-text">🔊 音效</span>
                    </label>
                    <button class="btn-small" id="testSoundBtn">🎵 测试</button>
                </div>
                <button class="btn-icon" id="fullscreenBtn">⛶ 全屏</button>
            </div>
        </div>

        <!-- ===== 计时器主体 ===== -->
        <div class="timer-main">
            <div class="timer-circle" id="timerCircle">
                <div class="time-display" id="timeDisplay">60:00</div>
                <div class="status-text" id="statusText">准备就绪</div>
            </div>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>

        <!-- ===== 操作栏 ===== -->
        <div class="action-bar">
            <div class="custom-input-group">
                <input type="number" class="input-custom" id="customMinutes" placeholder="自定义" min="1" max="999" value="5" />
                <span class="unit">分</span>
                <button class="btn-set" id="setCustomBtn">设定</button>
            </div>
            <div class="main-controls">
                <button class="btn-main btn-start" id="mainBtn">开始计时</button>
                <button class="btn-reset" id="resetBtn">重置</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ===== DOM 引用 =====
            const wrapper = document.getElementById('app');
            const timeDisplay = document.getElementById('timeDisplay');
            const statusText = document.getElementById('statusText');
            const progressBar = document.getElementById('progressBar');
            const mainBtn = document.getElementById('mainBtn');
            const resetBtn = document.getElementById('resetBtn');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const soundToggle = document.getElementById('soundToggle');
            const testSoundBtn = document.getElementById('testSoundBtn');
            const customMinutes = document.getElementById('customMinutes');
            const setCustomBtn = document.getElementById('setCustomBtn');
            const timerCircle = document.getElementById('timerCircle');
            const presetBtns = document.querySelectorAll('.btn-preset');

            // ===== 状态 =====
            const STATE = {
                IDLE: 'idle',
                RUNNING: 'running',
                PAUSED: 'paused',
                FINISHED: 'finished',
                RINGING: 'ringing'
            };

            let state = STATE.IDLE;
            let totalSeconds = 3600;
            let remainingSeconds = 3600;
            let timerInterval = null;
            let alarmInterval = null;
            let audioCtx = null;

            // ===== 音效 =====
            function getAudioContext() {
                if (!audioCtx) {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                }
                return audioCtx;
            }

            function playBeep() {
                if (!soundToggle.checked) return;
                try {
                    const ctx = getAudioContext();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.value = 880;
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0.25, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.2);
                } catch (_) { /* 静默处理 */ }
            }

            function playAlarmLoop() {
                if (alarmInterval) return;
                playBeep();
                alarmInterval = setInterval(() => {
                    if (soundToggle.checked) {
                        playBeep();
                    }
                }, 600);
            }

            function stopAlarmLoop() {
                if (alarmInterval) {
                    clearInterval(alarmInterval);
                    alarmInterval = null;
                }
            }

            // ===== 辅助函数 =====
            function formatTime(seconds) {
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
            }

            function updateDisplay() {
                timeDisplay.textContent = formatTime(remainingSeconds);
                const pct = totalSeconds > 0 ? ((totalSeconds - remainingSeconds) / totalSeconds) * 100 : 0;
                progressBar.style.width = Math.min(pct, 100) + '%';
                const ratio = remainingSeconds / totalSeconds;
                progressBar.classList.remove('warning', 'danger');
                if (state === STATE.FINISHED || state === STATE.RINGING) {
                    progressBar.classList.add('danger');
                } else if (ratio <= 0.2 && state === STATE.RUNNING) {
                    progressBar.classList.add('warning');
                }
            }

            function setState(newState) {
                state = newState;
                timerCircle.classList.remove('running', 'finished', 'ringing');
                if (state === STATE.RUNNING) {
                    timerCircle.classList.add('running');
                } else if (state === STATE.FINISHED) {
                    timerCircle.classList.add('finished');
                } else if (state === STATE.RINGING) {
                    timerCircle.classList.add('ringing');
                }
                updateMainBtn();
                updateStatusText();
            }

            function updateMainBtn() {
                if (state === STATE.IDLE || state === STATE.FINISHED) {
                    mainBtn.textContent = '开始计时';
                    mainBtn.className = 'btn-main btn-start';
                } else if (state === STATE.RUNNING) {
                    mainBtn.textContent = '暂停';
                    mainBtn.className = 'btn-main btn-pause';
                } else if (state === STATE.PAUSED) {
                    mainBtn.textContent = '继续';
                    mainBtn.className = 'btn-main btn-start';
                } else if (state === STATE.RINGING) {
                    mainBtn.textContent = '⏹ 停止提醒';
                    mainBtn.className = 'btn-main btn-stop-alarm';
                }
            }

            function updateStatusText() {
                const map = {
                    [STATE.IDLE]: '准备就绪',
                    [STATE.RUNNING]: '倒计时中 ...',
                    [STATE.PAUSED]: '已暂停',
                    [STATE.FINISHED]: '时间到！',
                    [STATE.RINGING]: '⏰ 时间到！'
                };
                statusText.textContent = map[state] || '准备就绪';
            }

            // ===== 核心逻辑 =====
            function setTime(minutes) {
                stopTimer();
                stopAlarmLoop();
                totalSeconds = Math.max(1, minutes * 60);
                remainingSeconds = totalSeconds;
                setState(STATE.IDLE);
                updateDisplay();
                presetBtns.forEach(btn => {
                    const val = parseInt(btn.dataset.minutes, 10);
                    btn.classList.toggle('active', val === minutes);
                });
            }

            function startTimer() {
                if (state === STATE.IDLE || state === STATE.FINISHED) {
                    if (remainingSeconds <= 0) {
                        remainingSeconds = totalSeconds;
                    }
                    setState(STATE.RUNNING);
                    timerInterval = setInterval(tick, 1000);
                    updateDisplay();
                } else if (state === STATE.PAUSED) {
                    setState(STATE.RUNNING);
                    timerInterval = setInterval(tick, 1000);
                    updateDisplay();
                } else if (state === STATE.RUNNING) {
                    pauseTimer();
                } else if (state === STATE.RINGING) {
                    stopAlarmLoop();
                    setState(STATE.FINISHED);
                    updateDisplay();
                }
            }

            function pauseTimer() {
                if (state === STATE.RUNNING) {
                    stopTimer();
                    setState(STATE.PAUSED);
                    updateDisplay();
                }
            }

            function stopTimer() {
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
            }

            function resetTimer() {
                stopTimer();
                stopAlarmLoop();
                remainingSeconds = totalSeconds;
                setState(STATE.IDLE);
                updateDisplay();
                const minutes = Math.round(totalSeconds / 60);
                presetBtns.forEach(btn => {
                    const val = parseInt(btn.dataset.minutes, 10);
                    btn.classList.toggle('active', val === minutes);
                });
            }

            function tick() {
                if (remainingSeconds <= 0) {
                    stopTimer();
                    setState(STATE.RINGING);
                    updateDisplay();
                    playAlarmLoop();
                    return;
                }
                remainingSeconds -= 1;
                updateDisplay();
                if (remainingSeconds <= 5 && remainingSeconds > 0 && soundToggle.checked) {
                    playBeep();
                }
            }

            // ===== 预设点击 =====
            presetBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const mins = parseInt(this.dataset.minutes, 10);
                    if (isNaN(mins) || mins < 1) return;
                    if (state === STATE.RINGING) {
                        stopAlarmLoop();
                    }
                    setTime(mins);
                    customMinutes.value = mins;
                });
            });

            // ===== 自定义设定 =====
            setCustomBtn.addEventListener('click', function() {
                let mins = parseInt(customMinutes.value, 10);
                if (isNaN(mins) || mins < 1) {
                    mins = 5;
                    customMinutes.value = 5;
                }
                if (mins > 999) mins = 999;
                if (state === STATE.RINGING) {
                    stopAlarmLoop();
                }
                setTime(mins);
            });

            customMinutes.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    setCustomBtn.click();
                }
            });

            // ===== 主按钮 =====
            mainBtn.addEventListener('click', startTimer);

            // ===== 重置 =====
            resetBtn.addEventListener('click', function() {
                if (state === STATE.RINGING) {
                    stopAlarmLoop();
                }
                resetTimer();
                const mins = Math.round(totalSeconds / 60);
                customMinutes.value = mins;
            });

            // ===== 全屏 =====
            fullscreenBtn.addEventListener('click', function() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen?.() ||
                        document.documentElement.webkitRequestFullscreen?.();
                    wrapper.classList.add('fullscreen');
                    fullscreenBtn.textContent = '⛶ 退出';
                } else {
                    document.exitFullscreen?.() ||
                        document.webkitExitFullscreen?.();
                    wrapper.classList.remove('fullscreen');
                    fullscreenBtn.textContent = '⛶ 全屏';
                }
            });

            document.addEventListener('fullscreenchange', function() {
                if (!document.fullscreenElement) {
                    wrapper.classList.remove('fullscreen');
                    fullscreenBtn.textContent = '⛶ 全屏';
                }
            });

            document.addEventListener('webkitfullscreenchange', function() {
                if (!document.webkitFullscreenElement) {
                    wrapper.classList.remove('fullscreen');
                    fullscreenBtn.textContent = '⛶ 全屏';
                }
            });

            // ===== 音效测试 =====
            testSoundBtn.addEventListener('click', function() {
                if (!soundToggle.checked) {
                    playBeep();
                    return;
                }
                playBeep();
                setTimeout(() => playBeep(), 250);
            });

            // ===== 键盘快捷键 =====
            document.addEventListener('keydown', function(e) {
                if (e.target.tagName === 'INPUT') return;
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    mainBtn.click();
                }
                if (e.key === 'r' || e.key === 'R') {
                    resetBtn.click();
                }
                if (e.key === 'f' || e.key === 'F') {
                    fullscreenBtn.click();
                }
                if (e.key === 'Escape') {
                    if (state === STATE.RINGING) {
                        stopAlarmLoop();
                        setState(STATE.FINISHED);
                        updateDisplay();
                    }
                    if (document.fullscreenElement) {
                        document.exitFullscreen?.();
                        wrapper.classList.remove('fullscreen');
                        fullscreenBtn.textContent = '⛶ 全屏';
                    }
                }
            });

            // ===== 初始化 =====
            function init() {
                const defaultMinutes = 5;
                totalSeconds = defaultMinutes * 60;
                remainingSeconds = totalSeconds;
                setState(STATE.IDLE);
                updateDisplay();
                customMinutes.value = defaultMinutes;
                presetBtns.forEach(btn => {
                    const val = parseInt(btn.dataset.minutes, 10);
                    btn.classList.toggle('active', val === defaultMinutes);
                });
            }

            init();

            console.log('✅ 课堂计时器已启动 | 快捷键: 空格=开始/暂停, R=重置, F=全屏, ESC=退出全屏/停止提醒');
        })();
    </script>

</body>
</html>
