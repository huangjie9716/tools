<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 聚光灯·老虎机点名器</title>
    <link rel="stylesheet" href="RollCall3.css">
</head>
<body>

<div class="app">
    <!-- 顶栏：标题 + 最近点名 + 人数 -->
    <header class="topbar">
        <h1 class="title">🎰 聚光灯·点名器</h1>
        <div class="topbar-right">
            <div class="history-strip">
                <b>最近点名</b>
                <div id="historyChips"></div>
            </div>
            <span class="count-chip" id="countChip">
                <svg viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M510.08 476.288c-102.08 0-185.152-90.496-185.152-201.792 0-111.232 83.008-201.792 185.152-201.792s185.152 90.56 185.152 201.792c0 111.296-83.072 201.792-185.152 201.792z m0-339.776c-69.76 0-126.592 61.952-126.592 137.984 0 76.096 56.768 137.984 126.592 137.984s126.592-61.888 126.592-137.984c0-76.032-56.704-137.984-126.592-137.984z m181.696 812.736H332.16a137.28 137.28 0 0 1-108.544-52.608 137.344 137.344 0 0 1-25.92-117.76l22.016-117.76c20.352-85.312 88.96-130.432 192-130.432a31.936 31.936 0 0 1 0 63.808c-42.688 0-111.872 6.144-129.536 79.872l-22.016 117.76c-5.696 23.872-0.64 46.976 13.568 65.024s35.52 28.352 58.496 28.352H691.84c22.912 0 44.224-10.368 58.432-28.352S769.6 816 764.16 793.664l-22.656-120.768c-17.344-72.256-86.784-83.264-129.408-83.264a32 32 0 0 1 0-63.872c102.976 0 171.776 49.984 191.808 133.696l22.656 120.896a136.32 136.32 0 0 1-26.176 116.224 137.472 137.472 0 0 1-108.608 52.672z" fill="currentColor"></path></svg><span id="countText">0 人</span>
            </span>
        </div>
    </header>

    <!-- 姓名舞台：所有学生姓名全部呈现于此 -->
    <main class="stage">
        <div class="name-grid-wrapper">
            <div class="name-grid" id="nameGrid"></div>
        </div>
    </main>

    <!-- 控制条 -->
    <footer class="controls">
        <button class="btn btn-upload" id="btnUpload" title="支持 Excel(.xlsx/.xls) / .csv / .txt，单列姓名，第一行为表头">📂 上传名单</button>
        <button class="btn btn-start" id="btnStart" disabled>▶ 开始点名</button>
        <button class="btn btn-stop" id="btnStop" disabled>⏹ 停止</button>
        <button class="btn btn-fs" id="btnFs">⛶ 全屏</button>
    </footer>

    <!-- 提示气泡 -->
    <div class="toast" id="toast"></div>

    <!-- 隐藏的文件选择框 -->
    <input type="file" id="fileInput" accept=".xlsx,.xls,.xlsm,.xlsb,.csv,.txt,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/plain,text/csv" style="display:none" />
</div>

<script src="RollCall3.js"></script>
</body>
</html>
